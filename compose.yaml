# Reproducible container workflow (no Debian: Alpine for light images, Arch Linux for heavy ones).
# Override any value via environment or a local .env (see .env.example section 0).
#   docker compose build
#   docker compose run --rm dev       # Arch Linux workstation shell, repo at /src
#   docker compose run --rm verify    # just verify-all inside the Arch image
#   docker compose run --rm runtime   # Alpine shell with the first-party CLIs only
name: aphrody-monorepo

x-args: &args
  ALPINE_VERSION: ${ALPINE_VERSION:-3.23}
  ARCH_TAG: ${ARCH_TAG:-base-devel}
  BUN_VERSION: ${BUN_VERSION:-1.4.4}
  GO_VERSION: ${GO_VERSION:-1.27.0}
  RUST_TOOLCHAIN: ${RUST_TOOLCHAIN:-nightly}
  JUST_VERSION: ${JUST_VERSION:-1.58.0}
  CLI_UNITS: ${CLI_UNITS:-crates/ay}

x-workspace: &workspace
  working_dir: /src
  environment:
    SRC_ROOT: /src
    AGENT_GUARD: ${AGENT_GUARD:-off}
  volumes:
    - .:/src
    # Keep Linux build outputs out of the host checkout.
    - node-modules:/src/node_modules
    - cargo-target:/src/target
    - cargo-registry:/root/.cargo/registry
    - bun-cache:/root/.bun/install/cache

services:
  dev:
    <<: *workspace
    build: { context: ., target: dev, args: *args }
    image: ${SRC_IMAGE:-aphrody/monorepo-dev:local}
    platform: linux/amd64
    stdin_open: true
    tty: true
  verify:
    <<: *workspace
    image: ${SRC_IMAGE:-aphrody/monorepo-dev:local}
    platform: linux/amd64
    build: { context: ., target: dev, args: *args }
    command: ["just", "verify-all"]
  runtime:
    build: { context: ., target: runtime, args: *args }
    image: ${SRC_RUNTIME_IMAGE:-aphrody/monorepo-runtime:local}
    working_dir: /src
    environment:
      SRC_ROOT: /src
    volumes:
      - .:/src
    stdin_open: true
    tty: true

volumes:
  node-modules:
  cargo-target:
  cargo-registry:
  bun-cache:
