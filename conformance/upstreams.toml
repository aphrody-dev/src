[[suite]]
id = "test262"
upstream = "test262"
paths = ["test/built-ins", "test/language", "test/annexB", "test/intl402", "harness"]

[[suite]]
id = "bun"
upstream = "bun"
paths = ["test/js/bun", "test/js/node", "test/js/web", "test/cli", "test/bundler", "test/regression", "test/harness.ts"]

[[suite]]
id = "oxide"
upstream = "tailwindcss"
paths = ["crates/oxide"]

[[suite]]
id = "tailwind-snapshots"
upstream = "tailwindcss"
paths = ["packages/tailwindcss/src"]

[[suite]]
id = "tailwind-integrations"
upstream = "tailwindcss"
paths = ["integrations/cli", "integrations/postcss", "integrations/vite", "integrations/upgrade"]

[[suite]]
id = "shadcn"
upstream = "shadcn"
paths = ["apps/v4/public/schema", "apps/v4/registry", "apps/v4/public/r"]

[[suite]]
id = "base-ui"
upstream = "base-ui"
paths = ["packages/react/src"]

[[suite]]
id = "next-e2e"
upstream = "nextjs"
paths = ["test/e2e/app-dir", "run-tests.js"]

[[suite]]
id = "next-deploy"
upstream = "nextjs"
paths = ["test/deploy-tests-manifest.json", "packages/next/src/build/adapter"]

[[suite]]
id = "build-output-v3"
upstream = "vercel"
paths = ["packages/next", "packages/static-build"]

[[suite]]
id = "wpt"
upstream = "wpt"
paths = ["css/css-flexbox", "css/css-grid", "css/css-box", "css/css-display", "css/css-position", "css/css-sizing", "css/css-text", "css/css-fonts", "css/css-backgrounds", "css/css-color", "css/css-values", "css/css-cascade", "css/css-variables", "css/selectors"]
