# License and supply-chain policy for the root Cargo workspace (cargo-deny 0.20; docs/deps/POLICY.md, docs/DEPS-MINIMIZE.md).
# Run: `just deny` (part of `just check` and CI).
[graph]
all-features = true

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "Unlicense",
  "MPL-2.0",
  # Permissive, reviewed 2026-11-13: encase (MIT-0), xxhash-rust (BSL-1.0), webpki-roots (CDLA-Permissive-2.0),
  # unicode_names2 data (Unicode-DFS-2016), libbz2-rs-sys (bzip2-1.0.6).
  "MIT-0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "Unicode-DFS-2016",
  "bzip2-1.0.6",
]
confidence-threshold = 0.9
# Reviewed exception (docs/ARCHITECTURE.md §11): ffmpeg-next bindings are WTFPL; FFmpeg libav* is linked dynamically.
exceptions = [
  { crate = "ffmpeg-next", allow = ["WTFPL"] },
  { crate = "ffmpeg-sys-next", allow = ["WTFPL"] },
]

[bans]
# Remaining duplicates are transitive (RustCrypto/rand/windows/syn transitions, docs/deps/DEDUP.md).
# Direct duplicates are blocked by policy (one entry per crate in [workspace.dependencies]).
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { name = "openssl-sys" },
  { name = "openssl" },
  # Superseded upstreams: use the maintained successor already in the graph.
  { name = "atty", reason = "unmaintained; std::io::IsTerminal" },
  { name = "instant", reason = "unmaintained; web-time or std::time" },
  { name = "ansi_term", reason = "unmaintained; anstyle" },
  { name = "serde_yaml", reason = "archived; serde-saphyr or toml" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Forks only: aphrody-labs (upstream forks) and aphrody-dev (own repos), always pinned by rev.
[sources.allow-org]
# storytold: craft-libs (Apache-2.0), consumed by crates/craft-formats pinned by rev, not forked.
github = ["aphrody-labs", "aphrody-dev", "storytold"]

[advisories]
yanked = "deny"
unmaintained = "workspace"
# No fixed release upstream; tracked in docs/DEPS-MINIMIZE.md (remove when the dependents move).
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa 0.9 via jsonwebtoken 11, no fixed 0.9 release; leaves with jsonwebtoken on rsa 0.10" },
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 via elliptic-curve 0.13 (p256/p384 0.13), no fixed 0.5 release; 0.7 already in graph" },
]
