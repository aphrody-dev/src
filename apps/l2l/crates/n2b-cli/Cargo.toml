[package]
name = "n2b-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Sovereign n2b CLI, Headless Runner, and C-ABI FFI library (Node-to-Bun, Polyglot Tree-Sitter/Magika/Helix, LLVM IR, Ghidra-Rust SRE)"

[lints]
workspace = true

[lib]
name = "n2b_ffi"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "n2b"
path = "src/main.rs"

[dependencies]
argh.workspace = true
blake3.workspace = true
n2b-core.workspace = true
n2b-dotnet.workspace = true
n2b-ghidra.workspace = true
n2b-llvm.workspace = true
n2b-migrate.workspace = true
n2b-mingw-rea.workspace = true
n2b-polyglot.workspace = true
serde.workspace = true
serde_json.workspace = true
