[workspace]
resolver = "2"
members = [
  "crates/n2b-core",
  "crates/n2b-polyglot",
  "crates/n2b-migrate",
  "crates/n2b-llvm",
  "crates/n2b-dotnet",
  "crates/n2b-cli",
]
exclude = ["dotnet"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/aphrody/n2b"

# ─── Rust-in-Chromium / Rust-in-Bun / Rust-in-Linux Workspace Lints ──────────
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
large_stack_arrays = "warn"

[workspace.dependencies]
n2b-core = { path = "crates/n2b-core" }
n2b-polyglot = { path = "crates/n2b-polyglot" }
n2b-migrate = { path = "crates/n2b-migrate" }
n2b-llvm = { path = "crates/n2b-llvm" }
n2b-dotnet = { path = "crates/n2b-dotnet" }

# Sovereign Canonical Upstream Crates (Google argh/zerocopy, Microsoft windows-sys, BurntSushi ripgrep)
argh = "0.1.13"
blake3 = { version = "1.6.1", features = ["mmap", "rayon"] }
cc = "1.2"
goblin = "0.10.7"
grep-matcher = "0.1.7"
grep-regex = "0.1.13"
grep-searcher = "0.1.14"
iced-x86 = { version = "1.21.0", features = [
  "std",
  "decoder",
  "intel",
  "fast_fmt",
  "instr_info",
] }
ignore = "0.4.23"
memmap2 = "0.9.5"
parking_lot = "0.12.3"
ropey = "1.6.1"
rustc-hash = "2.1.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
zerocopy = { version = "0.8.20", features = ["derive"] }

# Tree-Sitter Incremental Polyglot Parsing Stack
tree-sitter = "0.25"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-java = "0.23"
tree-sitter-python = "0.23"
tree-sitter-json = "0.24"
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"
tree-sitter-bash = "0.23"
tree-sitter-go = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-lua = "0.2"

[workspace.dependencies.windows-sys]
version = "0.59.0"
features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_Storage_FileSystem",
  "Win32_System_Performance",
  "Win32_System_Threading",
]

# ─── Bun / Chromium AOT + LTO Release Optimization Profile ──────────────────
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
panic = "abort"
split-debuginfo = "unpacked"
