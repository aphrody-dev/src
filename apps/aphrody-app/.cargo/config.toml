[target.wasm32-unknown-unknown]
rustflags = ["--cfg=web_sys_unstable_apis"]

# Android and musl linkers come from the environment, never from a path of one machine:
#   CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/<host>/bin/aarch64-linux-android35-clang
# musl targets, when built, use the shared LLVM toolchain (clang --target + -fuse-ld=lld, docs/llvm/UNIFIED-TOOLCHAIN.md) in CI or on fr1.
