<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aphrody: windows and apps in your browser</title>
    <meta
      name="description"
      content="Aphrody opens windows and apps side by side in your browser: tiled layouts, shared state across tabs, drawn by your GPU. Nothing to install."
    />
    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0F0F0F" />
    <link rel="canonical" href="https://aphrody.app/" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="llms.txt" />
    <link rel="modulepreload" href="/aphrody_app_wasm.js" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Aphrody: windows and apps in your browser"
    />
    <meta
      property="og:description"
      content="Windows and apps side by side in your browser, drawn by your GPU, with state shared across tabs."
    />
    <meta property="og:url" content="https://aphrody.app/" />
    <meta property="og:site_name" content="Aphrody" />
    <meta property="og:image" content="https://aphrody.app/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Aphrody",
        "url": "https://aphrody.app/",
        "description": "Windows and apps side by side in your browser, drawn by your GPU.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://aphrody.app/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #0F0F0F;
        --layer: #1C1C1C;
        --brand: #0078D4;
        --brand-light: #60CDFF;
        --fg: #F3F3F3;
        --muted: #B8B8B8;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #F5F5F5;
          --layer: #FFFFFF;
          --fg: #1A1A1A;
          --muted: #4A4A4A;
          --brand-light: #005A9E;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.5 "Segoe UI Variable",
          "Segoe UI",
          system-ui,
          sans-serif;
      }
      header,
      footer {
        padding: 12px 20px;
        background: var(--layer);
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 24px;
        align-items: baseline;
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      main {
        padding: 16px 20px;
        display: grid;
        gap: 12px;
        grid-template-rows: 1fr auto auto;
      }
      canvas {
        display: block;
        width: 100%;
        height: min(70vh, 720px);
        border-radius: 8px;
        background: var(--bg);
        touch-action: none;
      }
      #hud {
        font:
          13px/1.4 "Cascadia Mono",
          Consolas,
          monospace;
        color: var(--brand-light);
        min-height: 2.8em;
      }
      kbd {
        padding: 0 6px;
        border: 1px solid var(--muted);
        border-radius: 4px;
        font:
          12px "Cascadia Mono",
          Consolas,
          monospace;
      }
      a {
        color: var(--brand-light);
      }
      :focus-visible {
        outline: 2px solid var(--brand-light);
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1 style="display: flex; align-items: center; gap: 12px">
        <img src="/icon.svg" alt="" width="40" height="40" />
        Aphrody
      </h1>
      <p data-i="tagline">Windows and apps side by side in your browser</p>
      <nav aria-label="Resources">
        <a href="/llms.txt">llms.txt</a> |
        <a href="/.well-known/webmcp.json">WebMCP tools</a> |
        <a href="/releases/manifest.json">Releases</a>
      </nav>
    </header>
    <main>
      <canvas
        id="gpu"
        width="1280"
        height="720"
        tabindex="0"
        role="application"
        aria-label="Aphrody window manager canvas. Press n to open a window, w to close, Tab to move focus, l to change layout, 1 to 4 to switch workspace."
      ></canvas>
      <p id="hud" role="status" aria-live="polite" data-i="loading">Loading</p>
      <p data-i="keys">
        Keys: <kbd>n</kbd> new window, <kbd>w</kbd> close, <kbd>Tab</kbd> focus,
        <kbd>l</kbd> layout, <kbd>1</kbd> to <kbd>4</kbd> workspace,
        <kbd>Space</kbd> shared counter.
      </p>
    </main>
    <footer>
      <p data-i="foot">
        Four layouts: tiled, grid, scrolling and floating. Needs a browser with
        WebGPU.
      </p>
    </footer>
    <noscript><p>JavaScript is required to run Aphrody.</p></noscript>
    <script type="module">
      import init from "/aphrody_app_wasm.js";
      // Five locales, same set as aphrody.com (packages/i18n); English is the markup default.
      const L = {
        fr: {
          tagline: "Fenêtres et applications côte à côte dans votre navigateur",
          loading: "Chargement",
          keys: "Touches : <kbd>n</kbd> nouvelle fenêtre, <kbd>w</kbd> fermer, <kbd>Tab</kbd> focus, <kbd>l</kbd> disposition, <kbd>1</kbd> à <kbd>4</kbd> espace de travail, <kbd>Espace</kbd> compteur partagé.",
          foot: "Quatre dispositions : mosaïque, grille, défilement et flottante. Demande un navigateur avec WebGPU.",
          nogpu:
            "WebGPU n'est pas disponible dans ce navigateur : les fenêtres ne seront pas dessinées.",
          fail: "Démarrage impossible : ",
        },
        "zh-CN": {
          tagline: "在浏览器中并排运行窗口和应用",
          loading: "加载中",
          keys: "按键：<kbd>n</kbd> 新窗口，<kbd>w</kbd> 关闭，<kbd>Tab</kbd> 切换焦点，<kbd>l</kbd> 布局，<kbd>1</kbd> 到 <kbd>4</kbd> 工作区，<kbd>空格</kbd> 共享计数器。",
          foot: "四种布局：平铺、网格、滚动和浮动。需要支持 WebGPU 的浏览器。",
          nogpu: "此浏览器不支持 WebGPU，窗口无法绘制。",
          fail: "启动失败：",
        },
        ja: {
          tagline: "ブラウザーでウィンドウとアプリを並べて表示",
          loading: "読み込み中",
          keys: "キー：<kbd>n</kbd> 新規ウィンドウ、<kbd>w</kbd> 閉じる、<kbd>Tab</kbd> フォーカス、<kbd>l</kbd> レイアウト、<kbd>1</kbd> から <kbd>4</kbd> ワークスペース、<kbd>Space</kbd> 共有カウンター。",
          foot: "4 つのレイアウト：タイル、グリッド、スクロール、フローティング。WebGPU 対応のブラウザーが必要です。",
          nogpu:
            "このブラウザーは WebGPU に対応していないため、ウィンドウを描画できません。",
          fail: "起動できませんでした：",
        },
        es: {
          tagline: "Ventanas y aplicaciones lado a lado en tu navegador",
          loading: "Cargando",
          keys: "Teclas: <kbd>n</kbd> nueva ventana, <kbd>w</kbd> cerrar, <kbd>Tab</kbd> foco, <kbd>l</kbd> disposición, <kbd>1</kbd> a <kbd>4</kbd> espacio de trabajo, <kbd>Espacio</kbd> contador compartido.",
          foot: "Cuatro disposiciones: mosaico, cuadrícula, desplazamiento y flotante. Requiere un navegador con WebGPU.",
          nogpu:
            "WebGPU no está disponible en este navegador: las ventanas no se dibujarán.",
          fail: "No se pudo iniciar: ",
        },
      };
      const lang = [navigator.language, ...navigator.languages]
        .map((x) => (x.startsWith("zh") ? "zh-CN" : x.slice(0, 2)))
        .find((x) => L[x]);
      const m = L[lang] ?? {
        nogpu:
          "WebGPU is not available in this browser; windows will not be drawn.",
        fail: "Failed to start: ",
      };
      if (lang) {
        document.documentElement.lang = lang;
        for (const el of document.querySelectorAll("[data-i]"))
          el.innerHTML = L[lang][el.dataset.i];
      }
      const hud = document.getElementById("hud");
      if (!navigator.gpu) hud.textContent = m.nogpu;
      init({ module_or_path: "/aphrody_app_wasm.wasm" }).catch((e) => {
        hud.textContent = m.fail + e;
      });
    </script>
  </body>
</html>
