[workspace]
resolver = "3"
members = [
  "crates/aphrody-core",
  "crates/aphrody-wasm",
  "crates/aphrody-host",
  "crates/aphrody-android",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
aphrody-core = { path = "crates/aphrody-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = { version = "1", default-features = false, features = ["std", "pure"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "s"
