# Worker "creator-aphrody-com" apps/r2-site (serveStatic). No secrets. Deploy from apps/r2-site: `ay auth mint cloudflare -- bunx wrangler@4.161.0 deploy -c wrangler/<host>.toml` (--dry-run first).
name = "creator-aphrody-com"
main = "../src/entry.cf.ts"
compatibility_date = "2026-11-01"
routes = [{ pattern = "creator.aphrody.com", custom_domain = true }]
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "aphrody-dist"
[vars]
PREFIX = "sites/creator.aphrody.com"
SERVICE = "aphrody-creator"
SPA = "1"
