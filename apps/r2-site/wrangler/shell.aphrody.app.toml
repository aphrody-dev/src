# Worker "aphrody-app-site" apps/r2-site (serveStatic). No secrets. Deploy from apps/r2-site: `ay auth mint cloudflare -- bunx wrangler@4.161.0 deploy -c wrangler/<host>.toml` (--dry-run first).
name = "aphrody-app-site"
main = "../src/entry.cf.ts"
compatibility_date = "2026-11-01"
routes = [{ pattern = "shell.aphrody.app", custom_domain = true }] # was aphrody.app until 2026-11-13 (apex = packages/deploy)
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "aphrody-dist"
[vars]
PREFIX = "sites/aphrody.app"
SERVICE = "aphrody-app"
SPA = "1"
