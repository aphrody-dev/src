# Worker "cdn-aphrody-com" apps/r2-site (serveStatic). No secrets. Deploy from apps/r2-site: `ay auth mint cloudflare -- bunx wrangler@4.161.0 deploy -c wrangler/<host>.toml` (--dry-run first).
name = "cdn-aphrody-com"
main = "../src/entry.cf.ts"
compatibility_date = "2026-11-01"
routes = [{ pattern = "cdn.aphrody.com", custom_domain = true }]
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "aphrody-assets"
[vars]
PREFIX = ""
SERVICE = "aphrody-cdn"
SPA = "0"
CROSS_ORIGIN = "1"
