# Static README badges (no badge service). `value = "@rust-toolchain"` is read from
# rust-toolchain.toml at build time so a badge never states an unverified version.
[[badge]]
id = "license"
label = "license"
value = "MIT OR Apache-2.0"

[[badge]]
id = "rust"
label = "rust"
value = "@rust-toolchain"

[[badge]]
id = "bun"
label = "runtime"
value = "bun"

[[badge]]
id = "main-only"
label = "workflow"
value = "main only"
