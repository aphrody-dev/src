# Aphrody brand: single source of truth for every logo, icon, token, banner, badge and social image
# of the monorepo. `ay brand build` (crates/aphrody-brand) reads this file and writes assets/brand/gen/.
# All artwork is original (see LICENSE). No third-party character, logo or game asset is used.

[brand]
name = "Aphrody"
# CDN path version: https://cdn.aphrody.com/brand/v<version>/... (immutable; bump on any visual change).
version = 1
# Material 3 dynamic scheme seed (electric indigo) and variant.
seed = "#3355FF"
variant = "vibrant"
# The bolt accent (amber), an M3 custom color harmonized nowhere: it stays the same hue in every theme.
accent = "#FFB300"
# Typeface: Google Sans Flex (SIL OFL 1.1, no Reserved Font Name; google/fonts ofl/googlesansflex).
# Trademark terms (TRADEMARKS.md upstream): the font name must not be used as or within a product name.
font = "Google Sans Flex"
font_fallback = ["Roboto Flex", "Inter", "system-ui", "sans-serif"]
# Variable font file, fetched by assets/brand/fetch.ts (pinned git blob, verified) into gen-cache/.
font_file = "gen-cache/GoogleSansFlex.ttf"

# The two organisations. `container` is the tile behind the monogram.
[[org]]
id = "aphrody-labs"
name = "Aphrody"
suffix = "Labs"
tagline = "Systems, runtimes and desktops in Rust and Bun"
container = "primary"
url = "https://github.com/aphrody-labs"

[[org]]
id = "aphrody-dev"
name = "Aphrody"
suffix = "Dev"
tagline = "Upstream work on Bun, Rust and the Windows platform"
container = "ink"
url = "https://github.com/aphrody-dev"

# One icon per product: an M3 rounded tile in the product hue (HCT, chroma 56, tone 40) and a
# Material Symbols Rounded glyph (Apache-2.0, assets/brand/symbols/NOTICE).
# `deploy` lists the directories that receive the web icon set (favicon.ico, icon.svg, PNGs,
# apple-touch-icon.png, site.webmanifest). `ico` lists the Windows .ico copies for binaries.
[[product]]
id = "ay"
name = "ay"
symbol = "terminal"
hue = 268
tagline = "One multicall CLI for the monorepo"
path = "crates/ay"
ico = ["crates/ay/ay.ico"]

