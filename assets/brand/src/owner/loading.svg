<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" width="120" height="40">
  <style>
    .dot { animation: googleArc 1.2s cubic-bezier(0.2, 0, 0, 1) infinite; transform-origin: center; }
    .d1 { fill: #4285F4; animation-delay: 0.00s; } /* Bleu Zeus */
    .d2 { fill: #EA4335; animation-delay: 0.15s; } /* Carmin Iris Byron */
    .d3 { fill: #D4CD8A; animation-delay: 0.30s; } /* Or Blond Céleste */
    .d4 { fill: #3DDC84; animation-delay: 0.45s; } /* Émeraude / Cyan */
    @keyframes googleArc {
      0%, 100% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-10px) scale(1.12); }
      70% { transform: translateY(3px) scale(0.95); }
    }
  </style>
  <circle class="dot d1" cx="24" cy="22" r="6" />
  <circle class="dot d2" cx="48" cy="22" r="6" />
  <circle class="dot d3" cx="72" cy="22" r="6" />
  <circle class="dot d4" cx="96" cy="22" r="6" />
</svg>