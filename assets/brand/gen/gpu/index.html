<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aphrody brand tile, WebGPU</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #0f0f14;
      display: grid;
      place-items: center;
    }
    aphrody-tile {
      display: block;
      width: min(80vmin, 640px);
      aspect-ratio: 1;
    }
    aphrody-tile img,
    aphrody-tile canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
  <aphrody-tile data-texture="../icons/aphrody-labs/icon-512.png"
    ><img src="../icons/aphrody-labs/icon.svg" alt="Aphrody Labs"
  /></aphrody-tile>
  <script type="module" src="brand-gpu.js"></script>
</html>
