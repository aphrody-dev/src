# Publish targets for `ay assets publish <name>`. Credentials: only names of environment
# variables (env.*), never values. Targets with type dir/next or external = false are
# local or own-fleet; every other target is an external effect and is held in
# var/agents/outbox/ unless .agents/owner-rules.json grants step "assets.publish.<name>".

# Local static tree (CI artifact, smoke tests).
[target.local]
type = "dir"
dir = "assets/dist/site"

# Next.js app: files land in <app>/public/_assets/<kind>/<name>.<hash>.<ext> (immutable hashed
# paths); serve with the generated _headers / next.config headers (Cache-Control immutable).
[target.next-aphrody]
type = "next"
app = "apps/aphrody"
public_url = "/"

# fr1 artifact store (factory, own disk).
[target.fr1]
type = "ssh"
external = false
host = "vps"
dir = "/srv/artifacts/assets/dist"
timeout = 1800

# fr2 edge nginx (assets.aphrody.com): tar over ssh, then nginx serves with
# gzip_static/brotli_static and immutable headers (assets.nginx.conf in the bundle).
[target.fr2]
type = "ssh"
host = "cdn"
dir = "/var/www/assets"
public_url = "https://assets.aphrody.com"
timeout = 1800

# Cloudflare R2 through rclone: remote config from RCLONE_CONFIG_R2_* variables (r2 skill).
[target.r2]
type = "rclone"
remote = "r2:aphrody-assets"
public_url = "https://assets.aphrody.com"

# Any S3-compatible store through Bun.S3Client (R2 endpoint, MinIO, AWS).
[target.s3]
type = "s3"
bucket = "aphrody-assets"
public_url = "https://assets.aphrody.com"
[target.s3.env]
access_key_id = "ASSETS_S3_ACCESS_KEY_ID"
secret_access_key = "ASSETS_S3_SECRET_ACCESS_KEY"
endpoint = "ASSETS_S3_ENDPOINT"

# Vercel Blob (CDN). Not live-tested: the Vercel team is soft-blocked.
[target.vercel-blob]
type = "vercel-blob"
public_url = "https://blob.vercel-storage.com"
[target.vercel-blob.env]
token = "BLOB_READ_WRITE_TOKEN"
