# Toolchain manifest for `ay up` (crates/up). One [[tool]] per tool:
#   version   pinned version; `lock = "<key>"` takes it from src.lock.json `toolchains.<key>` instead
#   bin       executables it provides (first one is probed); for layout = "tree", paths in the archive
#   verify    argv printing the version (default: <bin> --version)
#   source    github | url | bun | installer
#   assets.*  per platform: windows-x86_64, linux-x86_64, linux-aarch64, macos-x86_64, macos-aarch64
#   checksum  published sha256 file (release asset name or URL; {version}, {asset}, {url});
#             sha256.* pins hashes per platform when the upstream publishes them elsewhere
# Everything installs under the user's home: settings.bin_dir, settings.tools_dir, Bun's global
# directory, or rustup's ~/.cargo. Never a system directory. See docs/INSTALL_UPDATE.md.

[settings]
bin_dir = "~/.local/bin"
tools_dir = "~/.local/share/ay/tools"

# The monorepo CLI itself, released by dist (dist-workspace.toml, .github/workflows/release.yml).
# `ay self-update` uses axoupdater for the same releases.
[[tool]]
name = "ay"
version = "0.2.0"
bin = ["ay"]
source = "github"
repo = "aphrody-dev/src"
tag = "v{version}"
checksum = "{asset}.sha256"
assets.windows-x86_64 = "aphrody-x86_64-pc-windows-msvc.zip"
assets.linux-x86_64 = "aphrody-x86_64-unknown-linux-musl.tar.xz"
assets.linux-aarch64 = "aphrody-aarch64-unknown-linux-musl.tar.xz"
assets.macos-x86_64 = "aphrody-x86_64-apple-darwin.tar.xz"
assets.macos-aarch64 = "aphrody-aarch64-apple-darwin.tar.xz"

[[tool]]
name = "bun"
version = "1.4.4"
lock = "bun"
bin = ["bun"]
source = "github"
repo = "oven-sh/bun"
tag = "bun-v{version}"
checksum = "SHASUMS256.txt"
assets.windows-x86_64 = "bun-windows-x64.zip"
assets.linux-x86_64 = "bun-linux-x64-musl.zip"
assets.linux-aarch64 = "bun-linux-aarch64-musl.zip"
assets.macos-x86_64 = "bun-darwin-x64.zip"
assets.macos-aarch64 = "bun-darwin-aarch64.zip"

# rustup-init from the versioned archive; an existing rustup updates itself.
[[tool]]
name = "rustup"
version = "1.29.2"
bin = ["rustup"]
source = "installer"
checksum = "{url}.sha256"
args = ["-y", "--no-modify-path", "--default-toolchain", "none"]
update = ["rustup", "self", "update"]
assets.windows-x86_64 = "https://static.rust-lang.org/rustup/archive/{version}/x86_64-pc-windows-msvc/rustup-init.exe"
assets.linux-x86_64 = "https://static.rust-lang.org/rustup/archive/{version}/x86_64-unknown-linux-musl/rustup-init"
assets.linux-aarch64 = "https://static.rust-lang.org/rustup/archive/{version}/aarch64-unknown-linux-musl/rustup-init"
assets.macos-x86_64 = "https://static.rust-lang.org/rustup/archive/{version}/x86_64-apple-darwin/rustup-init"
assets.macos-aarch64 = "https://static.rust-lang.org/rustup/archive/{version}/aarch64-apple-darwin/rustup-init"
note = "toolchains themselves are pinned by rust-toolchain files, not here"

[[tool]]
name = "gh"
version = "2.102.0"
bin = ["gh"]
source = "github"
repo = "cli/cli"
checksum = "gh_{version}_checksums.txt"
assets.windows-x86_64 = "gh_{version}_windows_amd64.zip"
assets.linux-x86_64 = "gh_{version}_linux_amd64.tar.gz"
assets.linux-aarch64 = "gh_{version}_linux_arm64.tar.gz"
assets.macos-x86_64 = "gh_{version}_macOS_amd64.zip"
assets.macos-aarch64 = "gh_{version}_macOS_arm64.zip"

[[tool]]
name = "wrangler"
version = "4.157.0"
bin = ["wrangler"]
source = "bun"
package = "wrangler"

