# Shell : niubash remplace Git Bash et pwsh (bash 5.3 natif Rust, git MSVC, sans MSYS).
# Installation de référence : configuration/shell.dsc.winget (winget configure) ; cette entrée
# épingle la même version et vérifie le binaire sur le PATH. Preuves : dépôt nt,
# docs/research/shell-replacement.md (test Claude Code de bout en bout, imports PE).
# Première installation seulement : le niu.exe en service vient des forks aphrody-labs (niubash + rubash)
# construits par prd ou par la CI du fork, puis `just unixwin-install` (docs/unixwin/BUILD.md, DEDUP.md).
# `bin` n'est pas un gabarit {version} : à mettre à jour avec `version`.
[[tool]]
name = "niubash"
version = "1.5.0"
bin = ["niubash-v1.5.0-win-x64/niu"]
verify = ["niu", "--version"]
source = "github"
repo = "unixwin/niubash"
layout = "tree"
checksum = "SHA256SUMS"
assets.windows-x86_64 = "niubash-v{version}-win-x64.zip"
unsupported = ["linux-x86_64", "linux-aarch64", "macos-x86_64", "macos-aarch64"] # Unix : bash du système ; niubash remplace Git Bash sous Windows

# Coreutils for Windows : build Microsoft de uutils coreutils + findutils + grep (Learn :
