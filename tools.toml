sha256.windows-x86_64 = "e01a35c1856991e313564f02b540c6079274f0ecb3be22de764edd5341eabfaa"
unsupported = ["linux-x86_64", "linux-aarch64", "macos-x86_64", "macos-aarch64"] # release v2026.9.3 : x64 et arm64 Windows uniquement

# ---------------------------------------------------------------------------------------------
# Workstation bootstrap (ay up --bootstrap), absorbed from install.ps1 / install.sh.
# Files are created only when missing and never overwritten; `ay up --check` reports drift.
# ---------------------------------------------------------------------------------------------

[[file]]
name = "cargo-config"
os = "windows"
path = "~/.cargo/config.toml"
content = """
# Canonical Cargo configuration (written by ay up --bootstrap when missing)
[build]
rustc-wrapper = "sccache"

[alias]
ay = "run --manifest-path {repo}/Cargo.toml -p aphrody --bin ay --release --"
nt = "nextest run"
b = "build"
c = "check"
t = "test"

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=native"]

[net]
git-fetch-with-cli = true
"""

[[file]]
name = "cargo-config"
os = "unix"
path = "~/.cargo/config.toml"
content = """
# Canonical Cargo configuration (written by ay up --bootstrap when missing)
[build]
rustc-wrapper = "sccache"

[alias]
ay = "run --manifest-path {repo}/Cargo.toml -p aphrody --bin ay --release --"
nt = "nextest run"
b = "build"
c = "check"
t = "test"

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=native"]

[net]
git-fetch-with-cli = true
"""

[[file]]
name = "jj-config"
path = "{config}/jj/config.toml"
content = """
[user]
name = "aphrody-dev"
email = "contact@aphrody.com"

[ui]
default-command = "log"
diff-editor = ":builtin"
paginate = "never"

[snapshot]
max-new-file-size = "1MiB"
auto-track = "all()"

[git]
auto-local-bookmark = true
abandon-unreachable-commits = true

[revset-aliases]
"stack()" = "ancestors(@, 10) & mutable()"
"wip()" = "mutable() & ~empty()"
"review()" = "heads(mutable())"
"""

