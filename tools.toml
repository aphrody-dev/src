# ---------------------------------------------------------------------------------------------
# Workstation bootstrap (ay up --bootstrap), absorbed from install.ps1 / install.sh.
# Files are created only when missing and never overwritten; `ay up --check` reports drift.
# ---------------------------------------------------------------------------------------------

[[file]]
name = "cargo-config"
os = "windows"
path = "~/.cargo/config.toml"
content = """
# Canonical Cargo configuration (written by ay up --bootstrap when missing)
[build]
rustc-wrapper = "sccache"

[alias]
ay = "run --manifest-path {repo}/Cargo.toml -p aphrody --bin ay --release --"
nt = "nextest run"
b = "build"
c = "check"
t = "test"

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=native"]

[net]
git-fetch-with-cli = true
"""

[[file]]
name = "cargo-config"
os = "unix"
path = "~/.cargo/config.toml"
content = """
# Canonical Cargo configuration (written by ay up --bootstrap when missing)
[build]
rustc-wrapper = "sccache"

[alias]
ay = "run --manifest-path {repo}/Cargo.toml -p aphrody --bin ay --release --"
nt = "nextest run"
b = "build"
c = "check"
t = "test"

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=native"]

[net]
git-fetch-with-cli = true
"""

[[file]]
name = "jj-config"
path = "{config}/jj/config.toml"
content = """
[user]
name = "aphrody-dev"
email = "contact@aphrody.com"

[ui]
default-command = "log"
diff-editor = ":builtin"
paginate = "never"

[snapshot]
max-new-file-size = "1MiB"
auto-track = "all()"

[git]
auto-local-bookmark = true
abandon-unreachable-commits = true

[revset-aliases]
"stack()" = "ancestors(@, 10) & mutable()"
"wip()" = "mutable() & ~empty()"
"review()" = "heads(mutable())"
"""

# .agents/skills is the single source; Claude Code reads .claude/skills.
[[link]]
name = "claude-skills"
path = "{repo}/.claude/skills"
target = "{repo}/.agents/skills"

[[step]]
name = "src-deploy"
when = "{repo}/infra/go.mod"
cwd = "{repo}/infra"
run = ["go", "build", "-o", "{bin}/src-deploy{exe}", "./cmd/src-deploy"]
creates = "{bin}/src-deploy{exe}"

[[step]]
name = "ai-os"
when = "{repo}/packages/ai-os/src/cli.ts"
run = ["bun", "build", "--compile", "{repo}/packages/ai-os/src/cli.ts", "--outfile", "{bin}/ai-os{exe}"]
creates = "{bin}/ai-os{exe}"

# frg as an AOT binary instead of the former frg.cmd / bash shim.
[[step]]
name = "frg"
when = "{repo}/packages/forge/src/cli.ts"
run = ["bun", "build", "--compile", "{repo}/packages/forge/src/cli.ts", "--outfile", "{bin}/frg{exe}"]
creates = "{bin}/frg{exe}"
