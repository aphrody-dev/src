[package]
name = "aios-wasm-kernel"
version = "2.1.0"
edition = "2024"
description = "Cross-platform + wasm32-unknown-unknown deterministic compute & POSIX/Nix kernel for @aphrody/ai-os"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
