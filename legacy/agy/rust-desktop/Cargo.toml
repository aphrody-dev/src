[package]
name = "agy-desktop"
version = "2.0.0"
edition = "2024"
description = "Native Rust Desktop Shell & TUI Launcher for Google Antigravity + Gemini + Gemma 4 (@aphrody/agy + @aphrody/ai-os)"

[[bin]]
name = "agy-desktop"
path = "src/main.rs"

[workspace]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
