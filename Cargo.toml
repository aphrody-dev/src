# Root Cargo workspace for the first-party Rust crates that live in this repository.
# Units still kept as their own git submodules (crates/depot, crates/xtask, crates/unix, ...)
# join one at a time; see docs/CONSOLIDATION_PLAN.md.
[workspace]
resolver = "3"
members = [
  "tools/archguard",
  "crates/corelib",
  "crates/aphrody-design-*",
]
# Submodule units keep their own manifests until they join (docs/CONSOLIDATION_PLAN.md).
exclude = [
  "third_party",
  "apps",
  "packages",
  "infra",
  "crates/bench",
  "crates/depot",
  "crates/gamescope-rs",
  "crates/ring3-agent",
  "crates/rust-stack",
  "crates/unix",
  "crates/wayland",
  "crates/xtask",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
aphrody-design-shared = { path = "crates/aphrody-design-shared" }
aphrody-design-tokens = { path = "crates/aphrody-design-tokens" }

base64 = "0.22.1"
bevy = { version = "0.18", default-features = false }
clap = { version = "4.5", features = ["derive"] }
egui = { version = "0.31", default-features = false }
image = { version = "0.25", default-features = false }
lightningcss = { version = "=1.0.0-alpha.72", default-features = false }
quick-xml = "0.37"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
taffy = "0.15"
thiserror = "2.0"
toml = "0.8.20"

[profile.dev]
opt-level = 0
debug = 1
split-debuginfo = "unpacked"
incremental = true

# One release profile for every member: fat LTO, single codegen unit, abort on panic.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
