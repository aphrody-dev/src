cargo-features = ["codegen-backend", "panic-immediate-abort"]

# Root Cargo workspace for every first-party Rust crate in this repository.
# Every first-party crate sits one level below crates/ and is a member through the glob.
# See docs/CONSOLIDATION_PLAN.md.
[workspace]
resolver = "3"
members = [
  "crates/*",
]
exclude = [
  "third_party",
  "apps",
  "packages",
  "infra",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["aphrody-dev"]
repository = "https://github.com/aphrody-labs/src"
homepage = "https://labs.aphrody.com"

[workspace.dependencies]
