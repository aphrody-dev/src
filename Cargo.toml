# Root Cargo workspace for every first-party Rust crate in this repository.
# Every first-party crate sits one level below crates/ and is a member through the glob.
# See docs/CONSOLIDATION_PLAN.md.
[workspace]
resolver = "3"
members = [
  "crates/*",
]
exclude = [
  "third_party",
  "apps",
  "packages",
  "infra",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["aphrody-dev"]

[workspace.dependencies]
# First-party crates
archguard = { path = "crates/archguard" }
aphrody-design-shared = { path = "crates/aphrody-design-shared" }
aphrody-design-tokens = { path = "crates/aphrody-design-tokens" }
corelib = { package = "sovereign-corelib", path = "crates/corelib", default-features = false }
depot-cli = { path = "crates/depot-cli" }
depot-core = { path = "crates/depot-core" }
depot-cas = { path = "crates/depot-cas" }
depot-treesitter = { path = "crates/depot-treesitter" }
depot-re = { path = "crates/depot-re" }
depot-migrate = { path = "crates/depot-migrate" }
depot-forge = { path = "crates/depot-forge" }
depot-ingest = { path = "crates/depot-ingest" }
depot-graph = { path = "crates/depot-graph" }
gamescope-core = { path = "crates/gamescope-core" }
gamescope-wgsl = { path = "crates/gamescope-wgsl" }
stack-bench = { path = "crates/bench" }
xtk = { path = "crates/xtask" }

# crates.io
anyhow = "1.0"
bitflags = "2.8"
byteorder = "1.5"
raw-cpuid = "11.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_DirectComposition",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Composition",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Networking_WinSock",
  "System",
] }
argh = "0.1.13"
base64 = "0.22.1"
bevy = { version = "0.18", default-features = false }
blake3 = { version = "1.6.1", features = ["mmap", "rayon"] }
bytemuck = { version = "1.22", features = ["derive"] }
clap = { version = "4.5", features = ["derive", "env", "cargo"] }
console_error_panic_hook = "0.1.7"
egui = { version = "0.31", default-features = false }
gix = { version = "0.61.0", default-features = false, features = ["default"] }
globset = "0.4.15"
goblin = "0.10.7"
iced-x86 = { version = "1.21.0", features = ["std", "decoder", "intel", "fast_fmt", "instr_info"] }
ignore = "0.4.23"
image = { version = "0.25", default-features = false }
js-sys = "0.3.107"
lightningcss = { version = "=1.0.0-alpha.72", default-features = false }
pollster = "0.4"
quick-xml = "0.37"
rayon = "1.10.0"
regex = "1.11.1"
ropey = "1.6.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
streaming-iterator = "0.1.9"
taffy = "0.15"
thiserror = "2.0"
toml = "0.8.20"
tree-sitter = "0.24.7"
tree-sitter-language = "0.1.9"
tree-sitter-rust = "0.23.3"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.23.1"
tree-sitter-python = "0.23.6"
tree-sitter-go = "0.23.4"
tree-sitter-c = "0.23.4"
tree-sitter-cpp = "0.23.4"
tree-sitter-json = "0.24.8"
tree-sitter-bash = "0.23.3"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.23.2"
tree-sitter-lua = "0.2.0"
ureq = { version = "2.12.1", default-features = false, features = ["tls", "json"] }
walkdir = "2.5.0"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = "0.3.107"
wgpu = "30.0"
winit = "0.30.8"
windows-sys = { version = "0.59.0", features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_System_SystemInformation",
  "Win32_Storage_FileSystem",
  "Win32_System_Performance",
  "Win32_Security",
] }
zerocopy = { version = "0.8.20", features = ["derive"] }

# Edit-compile loop profile. Measurements and rejected levers: docs/BUILD_SPEED.md.
[profile.dev]
opt-level = 0
debug = 1
# Only takes effect on Linux/macOS (no objcopy pass, faster links); MSVC always emits a PDB.
split-debuginfo = "unpacked"
incremental = true

# No debuginfo for crates.io dependencies: 17% smaller target/, less I/O. Workspace
# crates keep debug = 1 (line tables and function info for backtraces and breakpoints).
[profile.dev.package."*"]
debug = false

# One release profile for every member: fat LTO, single codegen unit, abort on panic.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Profile dist (dist-workspace.toml) builds release artifacts with; same settings as release.
[profile.dist]
inherits = "release"

# Per-package overrides carried over from the members manifests.
[profile.dev.package.ring3-agent]
opt-level = 1

[profile.dev.package.rust-stack]
opt-level = 1
