# Edit-compile loop: dependencies at opt-level 1. Everything on LLVM: the Chromium 157 Rust toolchain
# (rust-toolchain.toml) ships no Cranelift backend (docs/llvm/CHROMIUM-157-TOOLCHAIN.md).
# Measurements and rejected levers: docs/BUILD_SPEED.md.
[profile.dev]
opt-level = 0
debug = "line-tables-only"
# Only takes effect on Linux/macOS (no objcopy pass, faster links); MSVC always emits a PDB.
split-debuginfo = "unpacked"
incremental = true

# Dependencies: LLVM, opt-level 1, no debuginfo (smaller target/).
[profile.dev.package."*"]
codegen-backend = "llvm"
opt-level = 1
debug = false

[profile.test]
codegen-backend = "llvm"

# One release profile for every member: fat LTO, single codegen unit, abort on panic.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release.package.quinn]
debug-assertions = false

[profile.release.package.tokio]
debug-assertions = false

# Profile dist (dist-workspace.toml) builds release artifacts with; same settings as release.
[profile.dist]
inherits = "release"

# Fast optimized local iteration (labs).
[profile.iteration]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true
strip = "none"
debug = "line-tables-only"
debug-assertions = true

# Size-optimized (labs).
[profile.min]
inherits = "release"
opt-level = "z"
panic = "immediate-abort"

# Per-package overrides carried over from the members manifests.
[profile.dev.package.ring3-agent]
opt-level = 1

[profile.dev.package.rust-stack]
opt-level = 1

[patch.crates-io]
# aphrody-dev forks: russh with sntrup761x25519-sha512 (OpenSSH hybrid PQ kex), pure-Rust sntrup761.
# Every git source is pinned by rev (branch noted for `ay lock --deps --bump`); deny.toml allows only these repos.
russh = { git = "https://github.com/aphrody-dev/russh", rev = "a9f644259fa57ddb2da0f980e6ae813b829f7ad4" } # aphrody/sntrup761
