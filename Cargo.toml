[workspace]
resolver = "2"
members = [
    "crates/gamescope-core",
    "crates/gamescope-wgsl",
    "crates/gamescope-web-wasm",
    "crates/gamescope-cli",
]

[workspace.dependencies]
gamescope-core = { path = "crates/gamescope-core" }
gamescope-wgsl = { path = "crates/gamescope-wgsl" }
wgpu = "30.0"
winit = { version = "0.30.8" }
bytemuck = { version = "1.22", features = ["derive"] }
pollster = "0.4"
serde = { version = "1.0", features = ["derive"] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = "0.3.107"
js-sys = "0.3.107"
console_error_panic_hook = "0.1.7"
