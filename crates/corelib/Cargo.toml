[package]
repository.workspace = true
name = "aphrody-corelib"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Product support library for Shenron and RoseGriffon: GPU (wgpu), RE formats, emulation clock, Epic assets, Boq wire format and adblock glue"
authors.workspace = true

[lib]
name = "corelib"
crate-type = ["rlib"]
path = "src/lib.rs"

[features]
default = ["gpu", "re", "emulation"]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
re = ["dep:sha2", "dep:byteorder"]
emulation = []
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:web-sys", "dep:serde-wasm-bindgen"]
full = ["gpu", "re", "emulation", "wasm"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
adblock = { workspace = true }
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
bytemuck = { workspace = true, features = ["derive"], optional = true }
sha2 = { workspace = true, optional = true }
byteorder = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
