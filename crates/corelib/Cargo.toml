[package]
repository.workspace = true
name = "aphrody-corelib"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Product support library for Shenron and RoseGriffon: GPU (wgpu), RE formats, emulation clock, Epic assets, Boq wire format and adblock glue"
authors.workspace = true

[lib]
name = "corelib"
crate-type = ["rlib"]
path = "src/lib.rs"

[features]
default = ["gpu", "re", "emulation"]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
re = ["dep:sha2", "dep:byteorder"]
emulation = []
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:web-sys", "dep:serde-wasm-bindgen"]
full = ["gpu", "re", "emulation", "wasm"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4.35"
# Web surface: network filter engine (Brave adblock-rust, MPL-2.0; crates.io 0.13.5, 2026-10-28)
adblock = "0.13.5"

# GPU Surface dependencies
wgpu = { version = "30.0.1", optional = true }
pollster = { version = "1.0", optional = true }
bytemuck = { version = "1.25", features = ["derive"], optional = true }

# RE Surface dependencies
sha2 = { version = "0.11", optional = true }
byteorder = { version = "1.5", optional = true }

# WASM Surface dependencies
wasm-bindgen = { version = "0.2.130", optional = true }
js-sys = { version = "0.3.107", optional = true }
web-sys = { version = "0.3.107", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2 = "0.9.12"

[dev-dependencies]
tempfile = "3.27"
