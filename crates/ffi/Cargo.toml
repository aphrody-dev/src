[package]
repository.workspace = true
name = "aphrody-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Stable C ABI over the depot library and the corelib Boq parser (aphrody_ffi shared library)"

[lib]
name = "aphrody_ffi"
crate-type = ["cdylib", "rlib"]

[features]
default = ["depot", "web"]
depot = [
  "dep:depot-core",
  "dep:aphrody-core",
  "dep:depot-re",
  "dep:depot-migrate",
  "dep:depot-forge",
  "dep:depot-ingest",
  "dep:depot-graph",
]
web = ["dep:corelib"]

[dependencies]
corelib = { workspace = true, optional = true }
depot-core = { workspace = true, optional = true }
aphrody-core = { workspace = true, optional = true }
depot-re = { workspace = true, optional = true }
depot-migrate = { workspace = true, optional = true }
depot-forge = { workspace = true, optional = true }
depot-ingest = { workspace = true, optional = true }
depot-graph = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
