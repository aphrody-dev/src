[package]
name = "aphrody-core-capi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C ABI over aphrody-core (core_* symbols), loaded by packages/core through bun:ffi"
publish = false

[lib]
name = "aphrody_core_capi"
crate-type = ["cdylib", "rlib"]

[features]
default = ["core", "ai-os"]
core = ["dep:aphrody-core"]
ai-os = ["dep:agent-context", "dep:rusqlite"]

[dependencies]
agent-context = { workspace = true, optional = true }
aphrody-core = { workspace = true, optional = true }
rusqlite = { workspace = true, features = ["bundled"], optional = true }
serde.workspace = true
serde_json.workspace = true
