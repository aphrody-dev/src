[package]
name = "stack-bench"
version = "0.1.0"
edition = "2024"
description = "Hardware and compiler benchmark suite behind `ay bench` (Windows)"
publish = false

[dependencies]
argh = "0.1.19"
zerocopy = { version = "0.9.0-alpha.0", features = ["derive"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rayon = "1.12"
