# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-brand"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "`ay brand build`: renders assets/brand (SVG sources, brand.toml) with the shared M3 tokens of packages/design into outlined SVG logos, product icons, favicon/app .ico, PNG, web manifests, social images, badges and ANSI banners with resvg/usvg/tiny-skia."

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "aphrody-brand"
path = "src/main.rs"

[dependencies]
# resvg re-exports usvg (parse, text shaping and outlining, SVG writer) and tiny-skia (raster).
resvg = { version = "0.50.0", default-features = false, features = ["text"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
