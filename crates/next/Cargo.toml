[package]
name = "next"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Next.js compiler front end in Rust: next.config, App Router, RSC, Server Actions, metadata, next/font, next/image, CDN; emits Bun, Dioxus or Leptos."
publish = false
autoexamples = false

[dependencies]
oxc_allocator = "0.155"
oxc_ast = "0.155"
oxc_parser = "0.155"
oxc_span = "0.155"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = "1.1.2"
walkdir = { workspace = true }
react = { path = "../react" }
aphrody-design-shared = { path = "../aphrody-design-shared" }
