[package]
repository.workspace = true
name = "aphrody-design-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
description = "Aphrody product identity: brand icons, favicon, webmanifest, and typed 2D pet runtime (RGBA atlas, Codex contract, 16-way gaze, web parity)."

[features]
default = ["fs"]
fs = []

[dependencies]
aphrody-design-sprite-sheet = { version = "0.2.0", path = "../aphrody-design-sprite-sheet" }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
png = "0.18"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
