[workspace]
resolver = "2"
members = [
    "crates/aphrody-design-shared",
    "crates/aphrody-design-tokens",
    "crates/aphrody-design-emit",
    "crates/aphrody-design-layout",
    "crates/aphrody-design-icons",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
aphrody-design-shared = { path = "crates/aphrody-design-shared" }
aphrody-design-tokens = { path = "crates/aphrody-design-tokens" }

base64 = "0.22.1"
bevy = { version = "0.18", default-features = false }
clap = { version = "4.5", features = ["derive"] }
egui = { version = "0.31", default-features = false }
image = { version = "0.25", default-features = false }
lightningcss = { version = "=1.0.0-alpha.72", default-features = false }
quick-xml = "0.37"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
taffy = { path = "../../third_party/taffy", version = "0.15.0" }
thiserror = "2.0"
toml = "0.8.20"

[profile.dev]
opt-level = 0
debug = 1
split-debuginfo = "unpacked"
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
