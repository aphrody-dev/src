# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-design-emit"
version = { workspace = true }
edition.workspace = true
rust-version.workspace = true
authors = ["Aphrody Contributors"]
repository = "https://github.com/aphrody-dev/monorepo"
license = "MIT OR Apache-2.0"
description = "Multi-preset theme emitter for Aphrody Design: writes every YoloThemePreset as web CSS, Tailwind v4, GTK4/libadwaita, KDE, COSMIC, Qt6 QML, WinUI 3, Fluent 2, Apple asset catalogs, Jetpack Compose, Chrome themes, Omarchy, Hyprland and W3C DTCG."

[dependencies]
aphrody-design-shared = { workspace = true }
aphrody-design-tokens = { workspace = true }

[[bin]]
name = "aphrody-design-emit"
path = "src/main.rs"

[dev-dependencies]
lightningcss = { workspace = true }
quick-xml = { workspace = true }
ron = "0.12"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
