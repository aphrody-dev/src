[package]
name = "aphrody-factory"
description = "Chromium factory (F4): sync, gn gen, siso build over NativeLink REAPI, R2 publish, doctor, toolchain. Library first; `ay factory` later."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
name = "aphrody_factory"

[[bin]]
name = "aphrody-factory"
path = "src/main.rs"

[dependencies]
aphrody-conformance = { version = "0.3.0", path = "../conformance" }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
toml.workspace = true
sha2.workspace = true
blake3.workspace = true
hex.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
