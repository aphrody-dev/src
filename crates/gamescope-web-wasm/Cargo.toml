[package]
name = "gamescope-web-wasm"
version = "0.1.0"
edition = "2024"
authors = ["Aphrody / DeepMind Antigravity"]
description = "Gamescope WebAssembly / WebGPU client for Chromium"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gamescope-core = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
console_error_panic_hook = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gamescope-wgsl = { workspace = true }
wgpu = { workspace = true, features = ["web", "webgpu"] }
bytemuck = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Window",
    "console",
    "Performance",
] }
js-sys = { workspace = true }
