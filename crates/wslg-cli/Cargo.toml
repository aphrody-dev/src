[package]
repository.workspace = true
description = "wslg-cli: part of the Aphrody monorepo"
name = "wslg-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "wslg-rs"
path = "src/main.rs"

[[bin]]
name = "wslg-cosmic-hypr"
path = "src/bin/wslg_cosmic_hypr.rs"

[dependencies]
hypr-tiler = { version = "0.4.0", path = "../hypr-tiler" }
cosmic-compat = { version = "0.4.0", path = "../cosmic-compat" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true

# The compositor host runs on Windows only; elsewhere the binaries print an error.
[target.'cfg(windows)'.dependencies]
dx12-hal.workspace = true
smithay-wayland-wire.workspace = true
windows.workspace = true
