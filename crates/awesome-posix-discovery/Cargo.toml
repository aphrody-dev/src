[package]
name = "awesome-posix-discovery"
version = "0.1.0"
edition = "2024"
description = "High-speed Gitoxide + Gitingest pipeline indexing awesome lists, Linux kernels, POSIX implementations, and 2026 distributions"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["full"] }
rayon = "1.10"
walkdir = "2.5"
regex = "1.11"
gix = { version = "0.61", default-features = false, features = ["default"] }
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "awesome-posix-discovery"
path = "src/main.rs"
