[package]
name = "agent-py"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "pyo3 bridge: exposes the agent Context store to Python (Hermes memory provider)."

[lib]
name = "agent_core"
crate-type = ["cdylib"]

[dependencies]
agent-context.workspace = true
pyo3 = { workspace = true, features = ["abi3-py310", "extension-module"] }
