[package]
repository.workspace = true
description = "Lore version control: lore-capi (absorbed from Epic Games Lore, MIT)"
license = "MIT"
name = "aphrody-lore-capi"
edition = "2024"
version = "0.13.1-nightly"

# The C library, named `lore` so it builds as liblore.so, liblore.dylib or lore.dll, and liblore.a
# or lore.lib. The build script generates lore.h.
[lib]
name = "lore"
crate-type = ["cdylib", "staticlib"]
test = false
doctest = false

[dependencies]
lore-library = { version = "0.13.1-nightly", package = "aphrody-lore", path = "../lore" }

[build-dependencies]
cbindgen = { version = "=0.29.2", default-features = false }
cc = "1.11.1"
glob = "0.3.4"
blake3 = { workspace = true }
regex = "1.13.1"

[features]
default = []
oodle = ["lore-library/oodle"]

[lints]
workspace = true
