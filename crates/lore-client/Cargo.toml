[package]
repository.workspace = true
description = "Lore version control: lore-client (absorbed from Epic Games Lore, MIT)"
license = "MIT"
name = "aphrody-lore-client"
edition = "2024"
version = "0.13.1-nightly"

[dependencies]
anstream = { workspace = true }
anstyle = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
clap-markdown = { workspace = true }
clap_complete = { workspace = true }
libc = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }

lore = { workspace = true }
lore-base = { workspace = true }
lore-macro = { workspace = true }

[target.'cfg(target_family = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console", "Win32_Networking_WinSock", "Win32_Globalization"] }

[features]
default = []
oodle = ["lore/oodle"]
test-util = []

[dev-dependencies]
lore-client = { path = ".", features = ["test-util"] , package = "aphrody-lore-client" }

[build-dependencies]
winresource = { workspace = true }

[[bin]]
name = "lore"
path = "src/cli/main.rs"
test = false
doctest = false
bench = false
doc = false
harness = false

[lib]
name = "lore_client"
path = "src/cli/lib.rs"
test = false

[package.metadata.winresource]
OriginalFilename = "lore.exe"
ProductName = "Lore"
FileDescription = "Lore CLI"
LegalCopyright = "Copyright Epic Games, Inc."

[lints]
workspace = true
