[package]
name = "aphrody-design-shared"
version = { workspace = true }
authors = ["Aphrody Contributors"]
edition.workspace = true
description = "Shared zero-overhead foundation crate for the Aphrody Design monorepo: neutral customizable manifest, 5 built-in theme presets (Neutral, M3, Fluent 2, Apple HIG Liquid Glass, Aphrody brand), CSS/GPU color parsers, and multi-engine fleet metadata."
license = "MIT OR Apache-2.0"
repository = "https://github.com/aphrody-dev/monorepo"
keywords = ["dioxus", "gpui", "iced", "tauri", "design-tokens"]
rust-version.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
