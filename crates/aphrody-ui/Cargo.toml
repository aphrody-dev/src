# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-ui"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Rust core of the Aphrody design system: Material 3 color (HCT, schemes, contrast), tokens, component contracts, layout, theme presets, React/Next front ends and the brand renderer."

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[[bin]]
name = "aphrody-brand"
path = "src/bin/aphrody-brand.rs"
required-features = ["brand"]

[features]
# color, components and shared are always built; the heavy modules are opt-out features so a renderer
# (GPUI, WebGPU) can depend on `aphrody-ui = { default-features = false, features = ["std", "serde"] }`.
default = ["std", "serde", "layout", "react", "next", "brand"]
layout = ["dep:lightningcss"]
react = ["layout", "dep:oxc_allocator", "dep:oxc_ast", "dep:oxc_parser", "dep:oxc_span"]
next = ["react", "dep:sha2", "dep:walkdir", "dep:toml"]
brand = ["dep:resvg", "dep:toml", "dep:sha2", "dep:meshopt", "dep:aphrody-brand-gpu"]
# Allocating helpers (CSS export, presets) of the color module.
std = []
# PNG/JPEG decode for `color::image`.
image = ["dep:image"]
serde = []
embedded-fonts = []
bevy = ["dep:bevy"]
egui = ["dep:egui"]

[dependencies]
base64 = { workspace = true }
image = { workspace = true, optional = true, features = ["png", "jpeg"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
lightningcss = { workspace = true, optional = true }
taffy = { workspace = true, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "content_size"] }
bevy = { workspace = true, optional = true, features = ["std", "bevy_ui"] }
egui = { workspace = true, optional = true }
oxc_allocator = { workspace = true, optional = true }
oxc_ast = { workspace = true, optional = true }
oxc_parser = { workspace = true, optional = true }
oxc_span = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }
resvg = { version = "0.50.0", default-features = false, features = ["text"], optional = true }
# brand::model: tile geometry shared with the wasm renderer, meshoptimizer codecs (glTF EXT_meshopt_compression).
aphrody-brand-gpu = { path = "../aphrody-brand-gpu", optional = true }
meshopt = { version = "0.7.0", optional = true }

[dev-dependencies]
sha2 = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
