# ring3-agent (r3d) Configuration
# Sovereign Ring-3 Local AI Agent, Boot HTTP + Tri-Backend Inference & Windows GPU-Diet Daemon

[server]
bind = "127.0.0.1:8080"
workers = 4
enabled = true
instant_disable_timeout_ms = 1

[isolation]
ring = "ring3-litebox"
pid_strategy = "upper-namespace"
target_min_pid = 3000000
max_memory_mb = 4096
cpu_affinity_mask = 0

[gpu_diet]
enabled = true
trim_working_sets = true
disable_ui_effects = true
eco_qos_background_renderers = true
backup_path = "gpu-diet-backup.json"
target_processes = [
    "msedgewebview2.exe",
    "SearchHost.exe",
    "TextInputHost.exe",
    "WWAHost.exe",
    "ShellExperienceHost.exe",
    "StartMenuExperienceHost.exe",
    "explorer.exe",
]

[inference]
default_backend = "auto"
cuda_device_id = 0
cuda_target = "sm_89"
max_context_tokens = 8192
kv_cache_budget_mb = 6144
vps_threads = 8
temperature = 0.7
top_p = 0.9
models = [
    { id = "r3d-q8-nano", backend = "vps-cpu-avx2", context = 4096, description = "Ring-3 AVX2/FMA Quantized CPU Transformer" },
    { id = "r3d-ada-sm89", backend = "cuda-sm89", context = 16384, description = "NVIDIA RTX 4070 Ada Lovelace Tensor-Core Engine" },
    { id = "r3d-webgpu-edge", backend = "webgpu-wgsl", context = 4096, description = "Client Browser In-Memory WGSL Compute Engine" },
]
