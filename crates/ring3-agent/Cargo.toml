[package]
repository.workspace = true
name = "ring3-agent"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Ring-3 Sovereign Local AI Agent, Boot HTTP + Tri-Backend Inference & Windows GPU-Diet Daemon"

[[bin]]
name = "r3d"
path = "src/main.rs"

[lib]
name = "ring3_agent"
path = "src/lib.rs"

[dependencies]
argh = { workspace = true }
zerocopy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
