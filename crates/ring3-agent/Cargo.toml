[package]
name = "ring3-agent"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Ring-3 Sovereign Local AI Agent, Boot HTTP + Tri-Backend Inference & Windows GPU-Diet Daemon"

[[bin]]
name = "r3d"
path = "src/main.rs"

[lib]
name = "ring3_agent"
path = "src/lib.rs"

[dependencies]
argh = "0.1.19"
zerocopy = { version = "0.9.0-alpha.0", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_Security",
]
