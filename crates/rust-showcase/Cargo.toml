[package]
name = "rust-showcase"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared-code Desktop (winit+wgpu) and Web (WASM+WebGPU+M3) interactive showcase of the Aphrody Rust ecosystem"
publish = false

[lib]
name = "rust_showcase"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "rust-showcase-desktop"
path = "src/main.rs"

[dependencies]
aphrody-ui = { version = "0.4.0", path = "../aphrody-ui", default-features = false, features = ["std", "serde", "layout", "fusion", "dioxus", "anyrender", "tui", "editor"] }
bytemuck = { workspace = true }
gamescope-core = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
taffy = { workspace = true }
wgpu = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { workspace = true }
rust-stack = { version = "0.1.0", path = "../rust-stack" }
winit = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { workspace = true }
getrandom = { workspace = true, features = ["wasm_js"] }
getrandom_03 = { package = "getrandom", version = "0.3.4", features = [
  "wasm_js",
] }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
wgpu = { workspace = true, features = ["web", "webgpu"] }
web-sys = { workspace = true, features = [
  "Document",
  "Element",
  "HtmlCanvasElement",
  "Performance",
  "Window",
] }

[lints]
workspace = true
