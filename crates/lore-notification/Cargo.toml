[package]
repository.workspace = true
description = "Lore version control: lore-notification (absorbed from Epic Games Lore, MIT)"
license = "MIT"
name = "aphrody-lore-notification"
edition = "2024"
version = "0.13.1-nightly"

[lib]
test = false

[dependencies]
async-trait = { workspace = true }
tonic = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
lore-base = { workspace = true }
lore-storage = { workspace = true }
lore-revision = { workspace = true }
lore-transport = { workspace = true }
lore-error-set = { workspace = true }
lore-macro = { workspace = true }
lore-proto = { workspace = true }

[features]
test-util = []

[dev-dependencies]
lore-notification = { path = ".", package = "aphrody-lore-notification",  features = ["test-util"]  }

[lints]
workspace = true
