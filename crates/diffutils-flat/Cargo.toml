[package]
publish = false
name = "aphrody-diffutils-flat"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
authors.workspace = true
description = "POSIX basic regular expression translation from the aphrody-labs/diffutils fork (uutils), flattened by `ay flat sync --fork third_party/diffutils`"
repository.workspace = true

[lib]
name = "diffutils_flat"
doctest = false

[dependencies]
regex.workspace = true

[dev-dependencies]
# The upstream unit tests of bre.rs.
pretty_assertions = "1.4"

# Verbatim upstream code: the fork's lints apply upstream, not the workspace's.
[lints]
