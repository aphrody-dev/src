[package]
name = "depot-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/aphrody-dev/depot"
description = "depot command set (VCS, ingest, code graph, RE) behind `ay git`, `ay ingest` and `ay graph`"
publish = false

[lib]
name = "depot_cli"
path = "src/lib.rs"

[dependencies]
depot-core.workspace = true
aphrody-core.workspace = true
depot-re.workspace = true
depot-migrate.workspace = true
depot-forge.workspace = true
depot-ingest.workspace = true
depot-graph.workspace = true
argh.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
