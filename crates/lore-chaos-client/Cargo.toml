[package]
repository.workspace = true
description = "Lore version control: lore-chaos-client (absorbed from Epic Games Lore, MIT)"
license = "MIT"
name = "aphrody-lore-chaos-client"
edition = "2024"
version = "0.13.1-nightly"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
clap = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
lore = { workspace = true }

[[bin]]
name = "lore_chaos_client"
path = "src/main.rs"
# The binary holds no unit tests; the library it drives does.
test = false

[lib]
name = "lore_chaos_client"
path = "src/lib.rs"
test = false

[features]
test-util = []

[dev-dependencies]
lore-chaos-client = { path = ".", features = ["test-util"], package = "aphrody-lore-chaos-client" }

[lints]
workspace = true
