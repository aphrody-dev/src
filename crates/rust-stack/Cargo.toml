[package]
name = "rust-stack"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Unified 100% Pure-Rust Sovereign Stack: Better-Auth, shadcn_rs, Open-WebUI, OpenCode, and OpenAI Gateway + C-ABI FFI"

[[bin]]
name = "rust-stack"
path = "src/main.rs"

[lib]
name = "rust_stack_ffi"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
argon2 = "0.6"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
base64 = "0.23"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
ed25519-dalek = { version = "3.0", features = ["rand_core"] }
getrandom = "0.4"
hex = "0.4"
hmac = "0.13"
pbkdf2 = { version = "0.13", features = ["hmac"] }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tokio = { version = "1.54", default-features = false, features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
ureq = { version = "3.5", features = ["json"] }
corelib = { package = "sovereign-corelib", path = "../corelib" }
