[package]
repository.workspace = true
name = "rust-stack"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Unified 100% Pure-Rust Sovereign Stack: Better-Auth, shadcn_rs, Open-WebUI, OpenCode, and OpenAI Gateway + C-ABI FFI"

[[bin]]
name = "rust-stack"
path = "src/main.rs"

[lib]
name = "rust_stack_ffi"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
argon2 = { workspace = true }
axum = { workspace = true, features = ["http1", "json", "query", "tokio"] }
base64 = { workspace = true }
blake3 = { workspace = true }
clap = { workspace = true, features = ["derive"] }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
getrandom = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
pbkdf2 = { workspace = true, features = ["hmac"] }
rusqlite = { workspace = true, features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
ureq = { workspace = true, features = ["json"] }
corelib = { version = "0.3.0", package = "aphrody-corelib", path = "../corelib" }
