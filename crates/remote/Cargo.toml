[package]
publish = false
repository.workspace = true
name = "aphrody-remote"
description = "Pure-Rust SSH client for `ay ssh`: exec, sftp copy, fleet hosts and health check (russh, no OpenSSH binary)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "remote"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
# Same versions russh uses, for hashed known_hosts entries (HMAC-SHA1).
hmac = "0.13"
sha1 = "0.11"
serde = { workspace = true }
toml = { workspace = true }
# ring instead of the default aws-lc-rs: no cmake/nasm needed on Windows or musl.
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "fs", "time", "net"] }
