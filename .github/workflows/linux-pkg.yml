# Unified package recipes (infra/pkg, `ay pkg`): one recipe -> PKGBUILD, debian/, APKBUILD, ebuild,
# Android.bp, Nix and an OCI layer; each CI pair builds and install-tests it in the distro container
# pinned by digest in infra/pkg/distros.toml. Docs: docs/linux/OWNERSHIP.md.
# Action versions: latest releases read with `gh api repos/<action>/releases/latest` on 2026-11-13.
name: linux-pkg
on:
  push:
    branches: [main]
    paths:
      [
        "infra/pkg/**",
        "infra/linux/**",
        "infra/fleet/sysctl/**",
        "packages/linux/**",
        ".github/workflows/linux-pkg.yml",
      ]
  pull_request:
    paths: ["infra/pkg/**", "infra/linux/**", "packages/linux/**"]
  workflow_dispatch:
concurrency:
  group: linux-pkg-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
        with: { bun-version-file: package.json }
      - run: bun test packages/linux
      - run: bun packages/linux/src/cli.ts pkg check
      - name: Shell syntax of the generated recipes and of the Linux scripts
        run: |
          bun packages/linux/src/cli.ts pkg gen all --out "$RUNNER_TEMP/pkg"
          find "$RUNNER_TEMP/pkg" \( -name PKGBUILD -o -name APKBUILD -o -name '*.ebuild' -o -name build.sh \) -exec bash -n {} \;
          shellcheck -S warning infra/linux/gpu/*.sh infra/linux/build/kernel.sh infra/linux/android/mirror.sh
          sh infra/linux/gpu/nvidia.sh --dry-run
          sh infra/linux/gpu/amd.sh --dry-run
      - id: m
        run: echo "matrix=$(bun packages/linux/src/cli.ts pkg matrix --json)" >> "$GITHUB_OUTPUT"
  # Boot harness of linux-kernel.yml on the CachyOS repository kernel: proves the QEMU/KVM path and the
  # PID 1 of infra/linux/build/boot/init.c on every change, without the multi-hour kernel build.
  boot-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends qemu-system-x86 cpio zstd clang lld
      - run: |
          f=$(curl -fsSL https://mirror.cachyos.org/repo/x86_64/cachyos/ | grep -oE 'linux-cachyos-[0-9][^"]*-x86_64\.pkg\.tar\.zst' | sort -uV | tail -1)
          curl -fsSLo "$RUNNER_TEMP/$f" "https://mirror.cachyos.org/repo/x86_64/cachyos/$f"
          REQUIRE_KVM=1 sh infra/linux/build/boot.sh "$RUNNER_TEMP/$f" "$RUNNER_TEMP/boot.log" | tee -a "$GITHUB_STEP_SUMMARY"
  build:
    needs: plan
    name: ${{ matrix.recipe }} / ${{ matrix.distro }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
        with: { bun-version-file: package.json }
      - run: bun packages/linux/src/cli.ts pkg build ${{ matrix.recipe }} --distro ${{ matrix.distro }} --out "$RUNNER_TEMP/pkg"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: pkg-${{ matrix.recipe }}-${{ matrix.distro }}
          path: |
            ${{ runner.temp }}/pkg/*.pkg.tar.zst
            ${{ runner.temp }}/pkg/*.deb
            ${{ runner.temp }}/pkg/repo/**/*.apk
          if-no-files-found: ignore
          retention-days: 14
