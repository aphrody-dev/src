# aphrody.app: every push on main builds the projects it touches (packages/deploy/projects.toml, `watch`),
# uploads each one as an immutable deployment (R2 through the aphrody.app API), publishes the preview
# https://<project>-<sha7>.aphrody.app, records a GitHub deployment, then moves production when
# production = "auto". `ay deploy <project>` dispatches this workflow; rollback is `ay deploy rollback`.
name: deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
    inputs:
      project: { description: "project of packages/deploy/projects.toml (empty: affected projects)", required: false, default: "" }
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
permissions: { contents: read, deployments: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APHRODY_DEPLOY_TOKEN: ${{ secrets.APHRODY_DEPLOY_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      BEFORE: ${{ github.event.before }}
      PROJECT: ${{ inputs.project }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      # Material Web (@aphrody/design) is bundled into the pages: workspace dependencies from bun.lock.
      - run: bun install --frozen-lockfile
      # Build cache: deploys/<p>/_cache/<key>.json (key = watch files + bun.lock + command). A hit reuses the
      # ready deployment that produced it: "cache hit ... build skipped, 0 files uploaded" in the log.
      - uses: actions/cache@v6
        with:
          path: deploys
          key: deploy-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: deploy-cache-
      - name: deploy
        run: |
          set -eu
          case "${PROJECT:-}" in ""|[a-z]*) ;; *) echo "bad project"; exit 1 ;; esac
          bun packages/deploy/src/cli.ts ci --after "$GITHUB_SHA" ${BEFORE:+--before "$BEFORE"} ${PROJECT:+--project "$PROJECT"}
