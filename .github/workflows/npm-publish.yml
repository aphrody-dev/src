# Publication npm sans humain (docs/infra/NPM.md).
# Trusted publishing OIDC (npm >= 11.5.1, Node >= 22.14, id-token: write, runner hébergé par GitHub) : aucun jeton,
# provenance automatique (dépôt et paquet publics). Repli sur le secret d'org NPM_TOKEN tant que le trusted publisher
# du paquet n'existe pas (premier publish) : npm/cli lib/utils/oidc.js ne remplace le jeton qu'après un échange OIDC réussi.
# bun pack (résout workspace: et catalog:) ; npm publie, car bun publish ne gère ni OIDC ni --provenance
# (oven-sh/bun#22423, #15601 ouverts au 2026-11-13 ; le release.yml de bun publie lui-même avec npm publish).
# Les dépôts des sous-modules (rosegriffon, shenron) appellent ce workflow depuis leur propre npm-publish.yml : npm
# vérifie le nom du workflow appelant, d'où le même nom de fichier partout. Un dry-run ne fait ni échange OIDC ni
# signature de provenance : il valide pack, version et registre ; l'OIDC se prouve au premier vrai publish.
name: npm-publish

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Dossiers des paquets, relatifs au dépôt, séparés par des espaces"
        required: true
      dry_run:
        description: "npm publish --dry-run"
        type: boolean
        default: true
      tag:
        description: "dist-tag"
        default: latest
  workflow_call:
    inputs:
      packages:
        type: string
        required: true
      dry_run:
        type: boolean
        default: true
      tag:
        type: string
        default: latest
    secrets:
      NPM_TOKEN:
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    # Le trusted publishing refuse les runners auto-hébergés (docs.npmjs.com/trusted-publishers).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm 12.2.2 (OIDC, provenance)
        run: bun add -g npm@12.2.2 && echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - run: test "$(npm --version)" = 12.2.2
      - name: bun install
        run: bun install --frozen-lockfile
      - name: pack + publish
        env:
          PACKAGES: ${{ inputs.packages }}
          DRY_RUN: ${{ inputs.dry_run }}
          TAG: ${{ inputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[a-z][a-z0-9._-]*$ ]] || { echo "::error::dist-tag invalide : $TAG"; exit 1; }
          out="$RUNNER_TEMP/npm"; mkdir -p "$out"
          for dir in $PACKAGES; do
            case "$dir" in /*|*..*) echo "::error::chemin refusé : $dir"; exit 1;; esac
            [ -f "$dir/package.json" ] || { echo "::error::$dir/package.json absent"; exit 1; }
            name=$(jq -er .name "$dir/package.json"); version=$(jq -er .version "$dir/package.json")
            if [ "$(jq -r '.private // false' "$dir/package.json")" = true ]; then echo "::warning::$name privé, ignoré"; continue; fi
            if v=$(npm view "$name@$version" version 2>"$out/view.err"); then
              if [ -n "$v" ]; then echo "$name@$version déjà publié"; continue; fi
            elif ! grep -q E404 "$out/view.err"; then cat "$out/view.err"; exit 1; fi
            (cd "$dir" && bun run --if-present build)
            tgz=$(cd "$dir" && bun pm pack --destination "$out" --quiet | tail -1)
            flags=(--access public --tag "$TAG" --provenance)
            if [ "$DRY_RUN" = true ]; then flags+=(--dry-run); fi
            npm publish "$out/$(basename "$tgz")" "${flags[@]}"
            echo "### $name@$version $([ "$DRY_RUN" = true ] && echo '(dry-run)')" >> "$GITHUB_STEP_SUMMARY"
          done
