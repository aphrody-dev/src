# Container images of src (infra/docker): amd64+arm64, pushed to ghcr.io/aphrody-dev/* with GITHUB_TOKEN.
# Rust images cross-compile with cargo-zigbuild on the amd64 runner (no qemu); Bun images are arch-neutral.
# Action versions: latest releases read with `gh api repos/<action>/releases/latest` on 2026-11-13.
name: images
on:
  push:
    branches: [main]
    paths: ["infra/docker/**", "crates/**", "packages/**", "apps/aphrody/**", "apps/yolo/**", "apps/r2-site/**",
            "infra/fleet/workers/**", "Cargo.lock", "bun.lock", "rust-toolchain.toml", ".github/workflows/images.yml"]
  workflow_dispatch:
    inputs:
      targets: { description: "bake group/targets", default: "default" }
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false # Rust LTO builds are long: queue, never cancel on the busy main branch
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build and push (registry cache shared with prd)
        uses: docker/bake-action@v7.5.0
        env:
          TAG: ${{ github.sha }}
          PUSH_CACHE: "true"
        with:
          source: .
          files: infra/docker/docker-bake.hcl
          targets: ${{ inputs.targets || 'default' }}
          push: true
  smoke:
    needs: bake
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4.8.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - run: SRC_TAG=${{ github.sha }} sh infra/docker/smoke.sh
