# Container images of src (infra/docker): built on the self-hosted fr1 runners (factory, buildx builder `aphrody`, local layer
# cache plus registry cache) and pushed to ghcr.io/<repository owner>/* with GITHUB_TOKEN (aphrody-labs since the repo transfer).
# Rust images cross-compile with cargo-zigbuild (no qemu for the Rust stages); Bun images are arch-neutral.
# Action versions: latest releases read with `gh api repos/<action>/releases/latest` on 2026-11-13.
name: images
on:
  push:
    branches: [main]
    paths:
      [
        "infra/docker/**",
        "crates/**",
        "packages/**",
        "apps/aphrody/**",
        "apps/yolo/**",
        "apps/r2-site/**",
        "infra/cloudflare/workers/api-gateway/**",
        "Cargo.lock",
        "bun.lock",
        "rust-toolchain.toml",
        ".github/workflows/images.yml",
      ]
  workflow_dispatch:
    inputs:
      targets: { description: "bake group/targets", default: "default" }
concurrency:
  group: images-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: false # Rust LTO builds are long: queue, never cancel on the busy main branch
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  bake:
    runs-on: [self-hosted, fr1]
    timeout-minutes: 340
    env:
      TAG: ${{ github.sha }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      PUSH_CACHE: "true"
      HEAVY_WAIT_MAX: "5400"
    steps:
      - uses: actions/checkout@v7
      - name: Registry login (job-local docker config; the shared buildx builder is copied in)
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/docker"; echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          mkdir -p "$DOCKER_CONFIG"; cp -a "$HOME/.docker/buildx" "$DOCKER_CONFIG/" 2>/dev/null || true
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push (heavy slot, registry cache shared with prd)
        run: aphrody-heavy docker buildx bake --builder aphrody -f infra/docker/docker-bake.hcl --push --progress plain ${{ inputs.targets || 'default' }}

  smoke:
    needs: bake
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4.8.0
        with:
          {
            registry: ghcr.io,
            username: "${{ github.actor }}",
            password: "${{ secrets.GITHUB_TOKEN }}",
          }
      - run: SRC_REGISTRY=ghcr.io/${{ github.repository_owner }} SRC_TAG=${{ github.sha }} sh infra/docker/smoke.sh
