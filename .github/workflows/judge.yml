# Judge of the PR-less flow on main (docs/agents/AGENT-FIRST.md): fast gates on a GitHub-hosted
# runner, so a verdict exists for every push even when the self-hosted fr1 runner is stopped
# (docs/infra/FLEET.md). Red -> ci-revert.yml reverts an attributable commit; the agent runner's
# ci-watch enqueues a coder fix task otherwise (runs on fr1). Rust builds and tests stay in ci.yml (tribunal 2026-11-13: no gate is duplicated between the two).
# Parallel jobs (2026-11-13): `gates` (repo-wide checks, one step each), `suites` (matrix, one Bun suite per
# job, fail-fast off so a red package never hides the next), `review` (indicative). Bun install cache keyed on bun.lock.
# Action versions: actions/checkout v7.0.1, actions/setup-go v7.0.0, actions/cache v6.1.0 (gh api releases/latest, 2026-11-13).
name: judge
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: judge-${{ github.sha }}
  cancel-in-progress: false
permissions: { contents: read }
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 1, submodules: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Bun revision (packageManager of package.json, the single source of the CI's bun)
        run: bun --revision | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Bun workspace dependencies (bun check reads @types/bun from node_modules)
        run: bun install --frozen-lockfile
      - name: Layered dependency gate (checkdeps)
        run: bun scripts/checkdeps.ts
      - name: Identity gate
        env:
          APHRODY_PII_TERMS: ${{ secrets.APHRODY_PII_TERMS }}
        run: "[ ! -f scripts/identity.ts ] || bun scripts/identity.ts check"
      - name: Agent runner parses and answers
        run: AGENTS_HOME="$RUNNER_TEMP/agents" bun --no-env-file infra/agents/runner.ts status
      - name: Agent runner tests (no shell, prompts with shell metacharacters)
        run: AGENTS_HOME="$RUNNER_TEMP/agents" bun --no-env-file test infra/agents
      - name: JS supply chain (bun workspace deps)
        run: bun scripts/js-deps-check.ts
      - name: Toolchain (Chromium 157 rustc, rustup chromium-157 named by rust-toolchain.toml)
        run: bun scripts/toolchain.ts install
      - name: Cargo graph resolves (members and path dependencies present, no compilation)
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - name: Version frozen (VERSION = Cargo.toml = path deps = package.json, above the last stable tag; docs/packaging/VERSIONING.md)
        run: bun packages/release/src/cli.ts freeze --check
      - name: No workflow targets prd or fr2 (owner fleet rule; self-hosted CI = fr1 only)
        run: |
          bad=$(grep -lE '^[[:space:]]*runs-on:.*\b(prd|fr2|cdn|usa)\b' .github/workflows/*.yml || true)
          [ -z "$bad" ] || { echo "prd/fr2 never run CI jobs, use [self-hosted, fr1]: $bad"; exit 1; }
  # One job per Bun suite: a red package never hides the next one. `bun check` needs the workspace
  # installed: without node_modules/@types/bun every bun version reports the same TS2868/TS2591.
  suites:
    name: bun ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: env-kit, run: "bun --no-env-file test packages/env-kit" }
          - { suite: upstream, run: "bun --no-env-file test packages/upstream" }
          - {
              suite: ai-os,
              run: "cd packages/ai-os && bun --no-env-file test test",
            }
          - {
              suite: chromium-bun,
              run: "cd packages/chromium-bun && bun check && bun --no-env-file test test/ssrf.test.ts test/engines.test.ts test/layers.test.ts test/purge-matrix.test.ts test/winner-picker.test.ts test/chromium-inspector.test.ts",
            }
          - {
              suite: design,
              run: "bun --no-env-file --cwd packages/design test && bun --no-env-file run --cwd packages/design lint",
            }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 1, submodules: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Suite
        run: ${{ matrix.run }}

  # Tribunal ai-os review (docs/reviews/README.md) sur les commits du push : job séparé et indicatif (continue-on-error),
  # il ne ralentit pas les portes ci-dessus et ne déclenche jamais ci-revert. Verdict du juge dans le résumé du run ; la
  # CI ne commite rien (les verdicts archivés viennent de `just review` et de `ai-os orch lifecycle`). Moteurs : registre
  # du runner (CLI claude avec ANTHROPIC_API_KEY, Workers AI si le jeton Cloudflare l'autorise) ; voix sans moteur = notée
  # « sans moteur ». @anthropic-ai/claude-code 2.1.323 (bun info, 2026-11-13).
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, filter: "blob:none", submodules: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - name: Claude Code CLI (voix claude et juge)
        run: bun add -g @anthropic-ai/claude-code@2.1.323 && echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Tribunal sur le push
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          range="$SHA"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$SHA"
          fi
          AGENT_HOME="$RUNNER_TEMP/agent" NHITL_DB="$RUNNER_TEMP/nhitl.sqlite" \
            bun --no-env-file packages/ai-os/src/cli.ts review "$range" --out "$RUNNER_TEMP/reviews" --summary "$GITHUB_STEP_SUMMARY" --quiet
