# Rust tier of the PR-less flow on main (tribunal 2026-11-13, docs/reviews/judge-2026-11-13-ci.md).
# Fast gates (checkdeps, identity, Go, every Bun suite, cargo metadata) live in judge.yml only.
# Self-hosted runner fr1 (labels self-hosted, fr1, build): the factory takes every build, test and CI job
# (owner decision 2026-11-13); prd serves production only, fr2 is edge (docs/infra/FLEET.md).
# Every cargo step goes through aphrody-heavy (one heavy job at a time, nice/ionice, load gate) so
# Chromium/LLVM builds keep priority. Cache: CARGO_TARGET_DIR and ~/.cargo persist on fr1 outside the
# checkout (actions/checkout cleans the workspace), warmer and faster than a network cache restore.
# On main a run is never cancelled: at most one runs and one waits (the waiting one is replaced by
# the newest push), so commits are verified in batches instead of being starved.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: { contents: read }
jobs:
  rust:
    runs-on: [self-hosted, fr1]
    timeout-minutes: 120
    env:
      RUSTC_WRAPPER: ""
      CARGO_TERM_COLOR: never
      CARGO_TARGET_DIR: ${{ github.workspace }}/../ci-target
      HEAVY_WAIT_MAX: "2700"
    steps:
      - id: app
        # GitHub App aphrody-labs (docs/infra/GITHUB-APP.md) : jeton d'installation de 1 h, borné aux permissions listées.
        if: vars.APHRODY_APP_CLIENT_ID != '' && !github.event.pull_request.head.repo.fork
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APHRODY_APP_CLIENT_ID }}
          private-key: ${{ secrets.APHRODY_APP_KEY }}
          owner: aphrody-labs
          permission-contents: read
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          submodules: false
      - name: Toolchain (Chromium 157 clang/lld and rustc on LLVM 24, rustup chromium-157)
        run: bun scripts/toolchain.ts install
      - name: Rust (ay and its libraries; toolchain from rust-toolchain.toml)
        run: |
          aphrody-heavy cargo build -p aphrody
          aphrody-heavy cargo test -p aphrody -p depot-gclient -p depot-cas -p depot-cipd -p aphrody-up -p aphrody-rt -p archguard -p agent-context
      - name: Supply-chain gate (cargo-deny)
        run: |
          command -v cargo-deny >/dev/null || aphrody-heavy cargo install --locked cargo-deny
          cargo deny --locked check
      - name: Architecture gate
        run: "\"$CARGO_TARGET_DIR/debug/ay\" arch check --strict"
      - name: Design tokens (packages/design/tokens/tokens.rs via nt-brand, tokens.zig)
        # tokens.rs et tokens.zig sont générés par bun (packages/design/src/build.ts) ; on les compile ici.
        run: |
          CARGO_MANIFEST_DIR="$PWD/apps/nt/sdk/rust/brand" aphrody-heavy rustc --edition 2024 --test -D warnings \
            -o "$CARGO_TARGET_DIR/nt-brand-test" apps/nt/sdk/rust/brand/src/lib.rs
          "$CARGO_TARGET_DIR/nt-brand-test"
          aphrody-heavy zig test packages/design/tokens/tokens_test.zig
