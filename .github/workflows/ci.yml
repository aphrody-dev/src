# Rust tier of the PR-less flow on main (tribunal 2026-11-13, docs/reviews/judge-2026-11-13-ci.md).
# Fast gates (checkdeps, identity, Go, every Bun suite, cargo metadata) live in judge.yml only.
# GitHub-hosted runner: free for this public repo; fr1 is Chromium/LLVM only, prd is saturated
# production, fr2 is proxy/CDN (docs/infra/FLEET.md, infra/agents/runner.ts).
# On main a run is never cancelled: at most one runs and one waits (the waiting one is replaced by
# the newest push), so commits are verified in batches instead of being starved.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: { contents: read }
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTC_WRAPPER: ""
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
          submodules: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Rust (ay and its libraries; toolchain from rust-toolchain.toml)
        run: |
          cargo build -p aphrody
          cargo test -p aphrody -p depot-gclient -p depot-cas -p depot-cipd -p aphrody-up -p aphrody-rt -p archguard -p agent-context
      - name: Supply-chain gate (cargo-deny)
        run: |
          command -v cargo-deny >/dev/null || cargo install --locked cargo-deny
          cargo deny --locked check
      - name: Architecture gate
        run: target/debug/ay arch check --strict
