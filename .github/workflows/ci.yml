name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test packages
  # Native builds (Rust/C++ on the shared Chromium LLVM toolchain) run on the prd self-hosted runner, never on the dev PC.
  native:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, prd]
    steps:
      - uses: actions/checkout@v5
      - name: cargo build
        shell: bash
        run: if ls crates/*/Cargo.toml >/dev/null 2>&1; then cargo build --workspace --release; else echo "no crates yet"; fi
