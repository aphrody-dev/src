# CWV alerts: p75 LCP/INP/CLS of every project with `budgets` (packages/deploy/projects.toml), read from
# GET /api/projects/<p>/insights (7 days). Over budget -> the run fails with a visible ::error and an NHITL
# entry (issue labelled nhitl, reused while open).
name: observe
on:
  schedule: [{ cron: "17 */6 * * *" }]
  workflow_dispatch:
permissions: { contents: read, issues: write }
concurrency: { group: observe, cancel-in-progress: false }
jobs:
  cwv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APHRODY_DEPLOY_TOKEN: ${{ secrets.APHRODY_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - name: budgets
        run: bun packages/deploy/src/cli.ts observe 2>&1 | tee observe.log; exit "${PIPESTATUS[0]}"
        shell: bash
      - name: nhitl entry
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -eu
          body="$(printf 'CWV budget exceeded (%s)\n\n```\n%s\n```\n' "$RUN" "$(tail -c 4000 observe.log 2>/dev/null || true)")"
          gh label create nhitl --color B60205 --force >/dev/null 2>&1 || true
          n="$(gh issue list --label nhitl --state open --search 'CWV budget in:title' --json number --jq '.[0].number // empty')"
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "NHITL: CWV budget exceeded" --label nhitl --body "$body"; fi
