# CI packages/ai-os (fusionné depuis aphrody-labs/agent) : tests bun du paquet (Windows et Linux) et publication NativeAOT
# du service Windows du relais (artefact relay-service, installé par packages/ai-os/native/relay-windows/install.ps1).
# Versions des actions : celles de nt.yml (relevées le 2026-11-12).
name: ai-os
on:
  push:
    branches: [main]
    paths:
      [
        "packages/ai-os/**",
        "src/agent/context/**",
        "src/agent/py/**",
        ".github/workflows/ai-os.yml",
      ]
  pull_request:
    paths:
      [
        "packages/ai-os/**",
        "src/agent/context/**",
        "src/agent/py/**",
        ".github/workflows/ai-os.yml",
      ]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run: { working-directory: packages/ai-os }
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - run: bun fmt --check .
      - run: bun check src/cli.ts src/relay/cli.ts bench/retrieval.ts test
      - run: bun test test
  relay-service:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: 11.0.x }
      - run: dotnet publish packages/ai-os/native/relay-windows/Relay.Service.csproj -c Release -o out/relay-service
      - uses: actions/upload-artifact@v5
        with:
          name: relay-service
          path: out/relay-service/aphrody-relay-svc.exe
          if-no-files-found: error
