# Claude Code with no human in the loop, on the fr1 build runner.
# Triggers: `@claude` in an issue or pull request comment, a new issue, or a manual run with a prompt.
# Needs the repository secret ANTHROPIC_API_KEY.
name: claude
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      prompt:
        description: Task for Claude
        required: true
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
jobs:
  claude:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'issues' ||
      contains(github.event.comment.body, '@claude')
    runs-on: [self-hosted, fr1]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ github.event.inputs.prompt }}
          claude_args: |
            --model claude-opus-5-5
            --permission-mode bypassPermissions
            --max-turns 200
