# Publication PyPI sans jeton (trusted publishing OIDC), dispatchée depuis fr1 par `ay release publish` (packages/release).
# docs.pypi.org/trusted-publishers : pypa/gh-action-pypi-publish + `id-token: write` au niveau du job. Pré-requis par
# projet : un trusted publisher (dépôt aphrody-labs/src, workflow pypi-publish.yml, environnement pypi) ; pour un
# projet neuf, un « pending publisher ». Les crates PyO3 sont construites par maturin (roue abi3 + sdist).
name: pypi-publish

on:
  workflow_dispatch:
    inputs:
      crates:
        description: "Crates PyO3 (chemins relatifs, séparés par des espaces)"
        required: true
      dry_run:
        description: "construire et vérifier seulement (sans upload)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: maturin build + twine check
        env:
          CRATES: ${{ inputs.crates }}
        run: |
          set -euo pipefail
          for c in $CRATES; do
            case "$c" in /*|*..*) echo "::error::chemin refusé : $c"; exit 1;; esac
            [ -f "$c/pyproject.toml" ] || bun packages/release/src/pyproject.ts "$c" > "$c/pyproject.toml"
            uvx maturin@1.16.0 build --release --sdist -m "$c/Cargo.toml" -o dist
          done
          uvx twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
