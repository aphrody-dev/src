# Keyless GCP access for CI (docs/infra/AUTH-ECOSYSTEM.md): GitHub Actions OIDC -> Workload Identity
# Federation (pool github, provider aphrody-dev, condition repository_owner == aphrody-labs, created by
# `ay auth oidc` from infra/deploy.toml [auth.oidc.gcp]) -> 1 h token for yolo-automation. No JSON key.
# Other workflows needing GCP reuse the same two steps with `permissions: id-token: write`.
# Action versions: `gh api repos/google-github-actions/{auth,setup-gcloud}/releases/latest` on 2026-11-13.
name: gcp-oidc
on:
  push:
    branches: [main]
    paths: [".github/workflows/gcp-oidc.yml", "infra/deploy.toml"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  gcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/468000409790/locations/global/workloadIdentityPools/github/providers/aphrody-dev
          service_account: yolo-automation@aphrody.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Token issued without a key
        run: |
          gcloud auth list --filter=status:ACTIVE --format='value(account)'
          gcloud projects describe aphrody --format='value(projectNumber)'
