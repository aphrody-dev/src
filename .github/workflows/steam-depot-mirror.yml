name: steam-depot mirror

# crates/steam-depot is canonical here; aphrody-dev/steam-depot is its public read-only mirror,
# consumed as a cargo git dependency by apps/rosegriffon (no access to this private repo needed).
on:
  push:
    branches: [main]
    paths: [crates/steam-depot/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Split and push
        env:
          TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          git subtree split --prefix=crates/steam-depot -b steam-depot-split
          git push --force "https://x-access-token:${TOKEN}@github.com/aphrody-dev/steam-depot.git" steam-depot-split:main
