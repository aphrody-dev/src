# Game vertical slice (docs/games/PLAN.md section 6, docs/games/PARITY.md): tests of src/game, the
# wasm32-unknown-unknown release build with wasm-bindgen, the /play bundle in apps/aphrody, and the
# browser frame-rate measurement. Runs on fr1 (factory): nothing compiles on the workstation. Two parallel jobs
# (`native`, `web`) with their own persistent target dirs on fr1 (outside the cleaned workspace, shared by the runners).
# Toolchain: rust-toolchain.toml pins `chromium-157`, which ships no wasm32 rust-std, so this job
# overrides it with a dated nightly (the root Cargo.toml needs nightly cargo-features) plus the wasm32
# target. Bump GAME_TOOLCHAIN together with the Chromium channel.
name: game
on:
  push:
    branches: [main]
    paths:
      - "src/game/**"
      - "packages/gaming/src/game-fps.ts"
      - ".github/workflows/game.yml"
  workflow_dispatch:
concurrency:
  group: game-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: false
permissions: { contents: read }
jobs:
  native:
    name: native tests and assets
    runs-on: [self-hosted, fr1]
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: ""
      CARGO_TERM_COLOR: never
      CARGO_TARGET_DIR: /home/ubuntu/build/game-target
      RUSTUP_TOOLCHAIN: nightly-2026-11-12
      HEAVY_WAIT_MAX: "2700"
    steps:
      - uses: actions/checkout@v7
        with: { submodules: false }
      - name: Unit tests (noise, chunk geometry, synth, GLB, day/night)
        run: aphrody-heavy cargo test -p game
      - name: Generated assets are up to date (deterministic GLB and SVG)
        run: aphrody-heavy cargo run -q -p game --bin gen-assets -- --check src/game/assets
      - name: Native build of the game binary
        run: aphrody-heavy cargo build -p game --bin game
  web:
    name: wasm build, site and frame rate
    runs-on: [self-hosted, fr1]
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: ""
      CARGO_TERM_COLOR: never
      CARGO_TARGET_DIR: /home/ubuntu/build/game-wasm-target
      RUSTUP_TOOLCHAIN: nightly-2026-11-12
      HEAVY_WAIT_MAX: "2700"
      GAME_WEB_DIR: ${{ github.workspace }}/target/game-web
    steps:
      - uses: actions/checkout@v7
        with: { submodules: false }
      - name: wasm32 target for the pinned nightly
        run: rustup target add wasm32-unknown-unknown --toolchain "$RUSTUP_TOOLCHAIN"
      - name: wasm32-unknown-unknown release build
        env:
          # Keep the target_features section wasm-bindgen reads (root profile strips symbols).
          CARGO_PROFILE_RELEASE_STRIP: none
        run: aphrody-heavy cargo build -p game --bin game --target wasm32-unknown-unknown --release
      - name: wasm-bindgen (CLI version must equal the wasm-bindgen crate in the lockfile)
        run: |
          v=$(cargo metadata --format-version 1 | jaq -r '[.packages[] | select(.name == "wasm-bindgen") | .version][0]')
          [ "$(wasm-bindgen --version 2>/dev/null)" = "wasm-bindgen $v" ] || aphrody-heavy cargo install --locked --root "$RUNNER_TEMP/wb" wasm-bindgen-cli --version "$v"
          export PATH="$RUNNER_TEMP/wb/bin:$PATH"
          wasm-bindgen --version
          mkdir -p "$GAME_WEB_DIR"
          wasm-bindgen --target web --no-typescript --out-dir "$GAME_WEB_DIR" --out-name game \
            "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/game.wasm"
          ls -l "$GAME_WEB_DIR"
      # The 33 MB wasm is not part of the aphrody.com deployment (deploy.yml runs on GitHub-hosted runners with no
      # wasm toolchain): it is published here to the aphrody-assets bucket, served as https://cdn.aphrody.com/game/.
      - name: Publish game.js and game_bg.wasm to cdn.aphrody.com/game (R2 aphrody-assets)
        if: github.ref == 'refs/heads/main'
        run: |
          rclone copyto "$GAME_WEB_DIR/game_bg.wasm" r2:aphrody-assets/game/game_bg.wasm --header-upload "Content-Type: application/wasm" --header-upload "Cache-Control: public, max-age=300"
          rclone copyto "$GAME_WEB_DIR/game.js" r2:aphrody-assets/game/game.js --header-upload "Content-Type: text/javascript" --header-upload "Cache-Control: public, max-age=300"
          rclone lsl r2:aphrody-assets/game
      - name: Bun workspace and fps script test
        run: bun install --frozen-lockfile && bun test ./packages/gaming/tests/game-fps.test.ts
      - uses: actions/upload-artifact@v7
        with:
          name: game-web
          path: target/game-web
          if-no-files-found: error
