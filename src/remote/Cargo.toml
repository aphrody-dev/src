[package]
publish = false
repository.workspace = true
name = "aphrody-remote"
description = "Pure-Rust SSH client for `ay ssh`: exec, sftp copy, fleet hosts and health check (russh, no OpenSSH binary)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "remote"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
hmac = { workspace = true }
sha1 = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
russh = { workspace = true, features = ["flate2", "ring", "rsa"] }
russh-sftp = { workspace = true }
tokio = { workspace = true, features = [
  "fs",
  "io-std",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "time",
] }
