[package]
name = "aphrody-re"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Unified Aphrody reverse engineering core: PE/ELF/Mach-O triage, byte-exact PE64 forge/COFF, .pdata/minidump/ASAR/Electron/Go/Android/SteamStub inspection, Ghidra P-Code/Pseudo-C & ghidra-decompiler, MinGW-REA, Lua 5.2, CRIWARE CPK/CRILAYLA, DBXV2 formats, AOB/live memory, YARA-X, Magika"
keywords = [
  "reverse-engineering",
  "ghidra",
  "disassembler",
  "pe",
  "binary-analysis",
]
categories = ["development-tools::debugging", "parser-implementations"]

[features]
default = ["game", "pipeline"]
game = ["dep:memmap2"]
pipeline = ["dep:tempfile", "dep:process-wrap"]
decompile = ["dep:ghidra-decompiler"]
magika = ["dep:magika"]
leveldb = ["dep:rusty-leveldb", "dep:tempfile"]
yara = ["dep:yara-x"]
# Compat alias for consumers expecting yolo-re-core/shenron-re wasm gating
wasm = ["dep:wasm-bindgen"]

[dependencies]
# Core workspace dependencies (all crates.io-backed)
blake3.workspace = true
goblin.workspace = true
iced-x86.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sha1.workspace = true
thiserror.workspace = true
regex.workspace = true
crc32fast.workspace = true
zerocopy.workspace = true
walkdir.workspace = true
flate2.workspace = true
getrandom.workspace = true
anyhow.workspace = true

# Standard crates.io RE libraries merged from rosegriffon (yolo-re-core, aphrody-nie-pe) & shenron (shenron-re)
aes = "0.9.3"
md5 = { package = "md-5", version = "0.11.0" }
hex = "0.4"
memchr = "2"
hashbrown = { version = "0.17", default-features = false, features = [
  "default-hasher",
  "inline-more",
] }
wasm-bindgen = { workspace = true, optional = true }

# Optional feature-gated dependencies
memmap2 = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
process-wrap = { version = "10.0.1", optional = true, default-features = false, features = ["std", "process-group", "job-object"] }
ghidra-decompiler = { version = "2.1.0", optional = true }
magika = { version = "1.1.0", optional = true }
rusty-leveldb = { version = "4", optional = true, default-features = false, features = ["fs"] }
yara-x = { version = "1.7.0", optional = true, default-features = false }

[lints]
workspace = true
