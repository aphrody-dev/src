[package]
repository.workspace = true
name = "gamescope-wgsl"
version = "0.1.0"
edition = "2024"
authors = ["Aphrody / DeepMind Antigravity"]
description = "Gamescope WGSL compute shaders (FSR 1.0 EASU, RCAS, HDR Compositor) and wgpu pipeline runner"
