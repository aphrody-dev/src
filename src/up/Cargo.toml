[package]
repository.workspace = true
name = "aphrody-up"
description = "Toolchain installer and updater behind `ay up`: tools.toml manifest, GitHub release and URL sources, sha256 checks, provider setup"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "up"
path = "src/lib.rs"

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ureq = { workspace = true }
dotenvy = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
ruzstd = { workspace = true }
lzma-rust2 = { workspace = true, features = ["std", "xz"] }
zip = { workspace = true, features = ["deflate"] }
ubi = { workspace = true }
tokio = { workspace = true, features = ["rt"] }

# .claude/skills -> .agents/skills style directory links without admin rights.
[target.'cfg(windows)'.dependencies]
junction = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
lzma-rust2 = { workspace = true, features = ["encoder", "std", "xz"] }

[lints.rust]
unsafe_code = "forbid"
