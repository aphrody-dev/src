[package]
publish = false
name = "aphrody"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "ay: one multicall CLI for the Aphrody monorepo (arch gate, lock, git, ingest, graph, deploy, bench, build)"
repository = "https://github.com/aphrody-labs/aphrody"

# Released with dist (dist-workspace.toml); the only dist package in the workspace.
[package.metadata.dist]
dist = true

[[bin]]
name = "ay"
path = "src/main.rs"

[lib]
name = "ay"
path = "src/lib.rs"
# No doctests in ay; rustdoc does not see the build-script rlib of bun-flat nor aphrody-docs (fr1, 2026-11-13).
doctest = false

[dependencies]
archguard.workspace = true
aphrody-conformance = { version = "0.4.0", path = "../../test/conformance" }
aphrody-re.workspace = true
clap.workspace = true
depot-cli.workspace = true
depot-cipd.workspace = true
depot-core.workspace = true
depot-gclient = { version = "0.4.0", path = "../depot/gclient" }
depot-vpython = { version = "0.4.0", path = "../depot/vpython" }
remote = { version = "0.4.0", package = "aphrody-remote", path = "../remote" }
serde_json.workspace = true
# `ay ai`: ai.toml, provider HTTP checks, secrets from `.env`.
serde.workspace = true
toml.workspace = true
ureq.workspace = true
regex.workspace = true
# `ay code`: parser-backed refs/mv/stage.
tree-sitter.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-javascript.workspace = true
uuid.workspace = true
dotenvy = { workspace = true }
sys = { version = "0.4.0", path = "../sys", package = "aphrody-sys" }
xtk.workspace = true
up = { version = "0.4.0", package = "aphrody-up", path = "../up" }
rt = { version = "0.4.0", package = "aphrody-rt", path = "../rt" }
# `ay docs` (Bun docs index) and `ay flat` / `ay hash` / `ay time` (bun fork crates, flattened).
aphrody-docs = { version = "0.4.0", path = "../docs" }
aphrody-omarchy = { version = "0.4.0", path = "../posix/omarchy" }
aphrody-ui = { version = "0.4.0", path = "../ui/kit", default-features = false, features = ["std", "serde", "fusion", "dioxus", "anyrender", "tui", "editor"] }
bun-flat = { version = "0.4.0", package = "aphrody-bun-flat", path = "../bun-flat" }
# `ay steam`: Steam data as JSON (VDF, appinfo, manifests, compat tools, Proton env).
bun-steam = { version = "1.4.8", package = "steam-depot", path = "../steam" }
# `ay self-update` against the dist releases (blocking API, no async runtime in ay itself).
axoupdater = { workspace = true, features = ["blocking"] }

# The benchmark suite measures Win32 APIs; `ay bench` reports unsupported elsewhere.
[target.'cfg(windows)'.dependencies]
stack-bench.workspace = true

# Brand icon and version resource of ay.exe (build.rs, ay.ico from assets/brand).
[build-dependencies]
winresource = "0.1.34"
