[package]
repository.workspace = true
homepage.workspace = true
authors.workspace = true
name = "aphrody-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
keywords = ["ffi", "c-abi", "reverse-engineering", "depot", "aphrody"]
categories = ["api-bindings", "development-tools::ffi"]
description = "Stable C ABI over depot, RE (aphrody-re), and corelib Boq parser (aphrody_ffi shared library)"

[lib]
name = "aphrody_ffi"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
default = ["depot", "re", "web"]
depot = [
  "dep:depot-core",
  "dep:aphrody-core",
  "dep:depot-migrate",
  "dep:depot-forge",
  "dep:depot-ingest",
  "dep:depot-graph",
]
re = ["dep:aphrody-re"]
web = ["dep:corelib"]

[dependencies]
aphrody-core-capi = { workspace = true, default-features = false }
aphrody-re = { workspace = true, optional = true }
corelib = { workspace = true, optional = true }
depot-core = { workspace = true, optional = true }
aphrody-core = { workspace = true, optional = true }
depot-migrate = { workspace = true, optional = true }
depot-forge = { workspace = true, optional = true }
depot-ingest = { workspace = true, optional = true }
depot-graph = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
