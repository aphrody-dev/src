[package]
repository.workspace = true
description = "Lore version control: lore-macro (absorbed from Epic Games Lore, MIT)"
license = "MIT"
name = "aphrody-lore-macro"
edition = "2024"
version = "0.13.1-nightly"

[lib]
name = "lore_macro"
proc-macro = true
# The crate holds no unit tests. Set this back to build a harness for them.
test = false

[dependencies]
proc-macro2 = { workspace = true }
syn = { workspace = true, features = ["full"] }
quote = { workspace = true }

[lints]
workspace = true
