[package]
repository.workspace = true
description = "Lore version control: lore-proto (absorbed from Epic Games Lore, MIT)"
license = "MIT"
name = "aphrody-lore-proto"
# Crate version is used for proto-artifactory workflow
version = "0.1.67"
edition = "2024"

[lib]
name = "lore_proto"
# The generated bindings hold no unit tests; the suites in tests/ are their own
# targets. Set this back to build a harness for unit tests.
test = false

[dependencies]
lore-base = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }

[lints]
workspace = true
