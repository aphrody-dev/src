# Official download manifests of the proprietary Steam pieces. Nothing listed here is committed or
# redistributed: `ay gaming steamcmd install` fetches steamcmd from Valve's CDN into
# ~/.local/share/ay/steamcmd (Windows: %LOCALAPPDATA%\ay\steamcmd), and Proton / Steam Linux Runtime
# arrive through steamcmd from Steam itself (`ay gaming steamcmd app-update <name>`), under the
# Steam Subscriber Agreement of the account used. Licenses: docs/gaming/OWNERSHIP.md.
#
# Checked live on 2026-11-13: HTTP 200, Content-Length and sha256 of each URL (curl | sha256sum; Valve
# replaces the bootstrap rarely: on a mismatch, re-check the source and update size and sha256); app ids and names from
# the PC's appcache/appinfo.vdf (`ay steam vdf <steam>/appcache/appinfo.vdf --app <id>`).

[steamcmd.windows]
url = "https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip"
size = 774825
sha256 = "7669b170dee42db8ee2273775ed7dfb2d173bdba1b849f70d2c7b379290bce13"
archive = "zip"
exe = "steamcmd.exe"

[steamcmd.linux]
url = "https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz"
size = 2428561
sha256 = "cebf0046bfd08cf45da6bc094ae47aa39ebf4155e5ede41373b579b8f1071e7c"
archive = "tar.gz"
exe = "steamcmd.sh"

[steamcmd.macos]
url = "https://steamcdn-a.akamaihd.net/client/installer/steamcmd_osx.tar.gz"
size = 2523751
sha256 = "8ecc17c8988e5acadcc78e631c48490f76150f2dfaa6cf8d7b4b67b097bd753b"
archive = "tar.gz"
exe = "steamcmd.sh"

# Tools Steam installs as apps (`--user <account>` when the anonymous login is refused). Proton ids mirror
# src/steam/src/proton.rs VALVE_PROTON_APPS and STEAM_LINUX_RUNTIME_SNIPER_APP_ID; the
# packages/gaming test fails when the two disagree. `platform = "linux"` makes
# steamcmd fetch the Linux depots from any host (@sSteamCmdForcePlatformType).
[apps.proton-experimental]
appid = 1493710
name = "Proton Experimental"
platform = "linux"

