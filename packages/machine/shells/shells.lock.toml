# Lock des shells (style Nix : version + source + empreintes). Contrôlé par
# `bun packages/machine/src/shells.ts --check` (chemin, `--version`, b3sum du binaire installé).
# sha256.* = digest de l'asset amont (gh api releases, 2026-11-13) ; b3sum.* = binaire installé tel quel.
# L'installation reste celle de l'outil indiqué par `install` (tools.toml / winget DSC / pacman) :
# ce lock fige et vérifie, il ne réimplémente pas d'installeur. Même schéma que toolchains.lock.toml.
# hosts : pc (Windows 11), prd (Arch), fr2 = cdn (Ubuntu 26.10), fr1 = vps (Ubuntu 26.10).

[shell.niubash]
version = "1.5.0"
expect = "5.3.20"
source = "https://github.com/unixwin/niubash/releases/tag/v1.5.0"
install = "ay up (tools.toml niubash) ; winget configure shell.dsc.winget ; binaire en service : just unixwin-install (docs/unixwin/BUILD.md)"
# Décisions de déduplication : docs/unixwin/DEDUP.md. b3sum.* = niu.exe de la chaîne des forks une fois installé.
hosts = ["pc"]
verify = ["--version"]
path.windows-x86_64 = "{localappdata}/Programs/Niubash/winuxcmd/bin/bash.exe"
url.windows-x86_64 = "https://github.com/unixwin/niubash/releases/download/v1.5.0/niubash-v1.5.0-win-x64.zip"
sha256.windows-x86_64 = "bb2e142ec617e91cb48bde8c0fa2b9cce2dc95bfc00857c82cef6a7ad4e12bcc"
b3sum.windows-x86_64 = "56b49cd89b649843f85287bccc7b697a9f213ee51b47d2a5a70da79317c3acdb"

[shell.git-bash]
# Repli seulement (Claude Code = niubash) ; bash 5.3.15 Cygwin/MSYS.
version = "2.56.0.windows.4"
expect = "5.3.15"
source = "https://github.com/git-for-windows/git/releases/tag/v2.56.0.windows.4"
