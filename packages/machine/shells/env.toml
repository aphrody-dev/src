# Source unique de l'environnement des shells (bash/niubash/Git Bash/brush, pwsh, nushell, fish).
# Généré vers env.sh, env.ps1, env.nu, env.fish par `bun packages/machine/src/shells.ts --gen` ;
# ne jamais éditer les fichiers générés. `--check` signale tout écart (fichiers, liens, lock, HKCU).
#
# Valeurs : `all` (toutes plateformes), `windows`, `linux` ; `{home}` = USERPROFILE / HOME,
# `{NOM}` = variable déclarée plus haut. Écrire les chemins Windows avec `\`.
# Aucun secret ici : les jetons restent dans `ay secret` (DPAPI / systemd-creds).

[var.SRC_ROOT]
windows = 'C:\src'
linux = '{home}/src'

[var.AY_SHELL_CACHE]
# Caches d'init (zoxide, carapace, complétions) régénérés par shells.ts --apply.
windows = '{home}\.cache\shell'
linux = '{home}/.cache/shell'

# XDG : Linux seulement. Sous Windows, XDG_CONFIG_HOME déplacerait la config de nushell et de git.
[var.XDG_CONFIG_HOME]
linux = '{home}/.config'
[var.XDG_CACHE_HOME]
linux = '{home}/.cache'
[var.XDG_DATA_HOME]
linux = '{home}/.local/share'
[var.XDG_STATE_HOME]
linux = '{home}/.local/state'

[var.LANG]
all = 'C.UTF-8'
[var.PYTHONUTF8]
all = '1'

# Épinglés (aucun `command -v` au démarrage : ~7 ms par balayage du PATH sous Git Bash).
[var.EDITOR]
windows = 'hx'
linux = 'nvim'
[var.VISUAL]
windows = 'hx'
linux = 'nvim'
[var.PAGER]
all = 'less'

[var.CARGO_HOME]
windows = '{home}\.cargo'
linux = '{home}/.cargo'
[var.RUSTUP_HOME]
windows = '{home}\.rustup'
linux = '{home}/.rustup'
[var.BUN_INSTALL]
windows = '{home}\.bun'
linux = '{home}/.bun'

[var.DENO_INSTALL]
windows = '{home}\.deno'
[var.DENO_DIR]
windows = '{home}\.cache\deno'
[var.DENO_NO_UPDATE_CHECK]
all = '1'

# Épinglés (style Nix) : --check signale un dossier absent après une mise à jour du JDK/SDK.
[var.JAVA_HOME]
windows = 'C:\Program Files\Microsoft\jdk-25.0.5.21-hotspot'
[var.ANDROID_HOME]
windows = '{home}\AppData\Local\Android\Sdk'
[var.ANDROID_SDK_ROOT]
windows = '{ANDROID_HOME}'
[var.GHIDRA_INSTALL_DIR]
windows = '{home}\AppData\Local\ghidra'

[var.npm_config_fund]
all = 'false'
[var.npm_config_audit]
all = 'false'
[var.npm_config_update_notifier]
all = 'false'

# Télémétrie coupée (noms vérifiés dans le dépôt amont, gh search code 2026-11-13).
[var.DO_NOT_TRACK]
all = '1'
[var.DOTNET_CLI_TELEMETRY_OPTOUT]
all = '1'
[var.POWERSHELL_TELEMETRY_OPTOUT]
all = '1'
[var.POWERSHELL_UPDATECHECK]
all = 'Off'
[var.NEXT_TELEMETRY_DISABLED]
all = '1'
[var.TURBO_TELEMETRY_DISABLED]
all = '1'
[var.ASTRO_TELEMETRY_DISABLED]
all = '1'
[var.WRANGLER_SEND_METRICS]
all = 'false'
[var.CHECKPOINT_DISABLE]
all = '1'

[var.FZF_DEFAULT_COMMAND]
all = 'fd --type f --hidden --exclude .git --path-separator /'

# PATH : le premier gagne ; dossiers absents ignorés. pwsh/nu/fish déplacent en tête une entrée déjà
# présente ; la famille bash ne déplace que celles de `front` (substitution coûteuse sous niubash).
# niubash préfixe WinuxCmd à l'ouverture : Coreutils for Windows doit repasser devant.
[path]
front = [
  'C:\Program Files\coreutils\bin',
  '{home}\.local\bin',
  '{CARGO_HOME}\bin',
  '{BUN_INSTALL}\bin',
]
windows = [
  'C:\Program Files\coreutils\bin',
  '{home}\.local\bin',
  '{CARGO_HOME}\bin',
  '{BUN_INSTALL}\bin',
  '{DENO_INSTALL}\bin',
  'C:\Program Files\nodejs',
  '{JAVA_HOME}\bin',
  '{ANDROID_HOME}\cmdline-tools\latest\bin',
  '{ANDROID_HOME}\platform-tools',
  '{GHIDRA_INSTALL_DIR}',
]
linux = ['{home}/.local/bin', '{CARGO_HOME}/bin', '{BUN_INSTALL}/bin']

# Variables lues avant le démarrage du processus (pwsh : about_Environment_Variables 7.7) :
# doivent exister dans HKCU\Environment. --check les contrôle ; sans --check, setx les écrit (diffusion WM_SETTINGCHANGE).
[persist.windows]
POWERSHELL_TELEMETRY_OPTOUT = '1'
POWERSHELL_UPDATECHECK = 'Off'
DOTNET_CLI_TELEMETRY_OPTOUT = '1'
PYTHONUTF8 = '1'
BUN_INSTALL = '{home}\.bun'
CARGO_HOME = '{home}\.cargo'
RUSTUP_HOME = '{home}\.rustup'
SRC_ROOT = 'C:\src'
AY_SHELL_CACHE = '{home}\.cache\shell'
# Claude Code : l'environnement HKCU doit concorder avec ~/.claude/settings.json (niubash, pas d'outil PowerShell).
CLAUDE_CODE_USE_POWERSHELL_TOOL = '0'
AGY_USE_POWERSHELL_TOOL = '0'
CLAUDE_CODE_GIT_BASH_PATH = '{localappdata}\Programs\Niubash\winuxcmd\bin\bash.exe'

# PATH utilisateur (HKCU\Environment\Path) : ces entrées passent devant les autres, dans cet ordre
# (WinGet\Links\bun.exe masquait ~/.bun/bin). Écrit par shells.ts sans --check ; le reste du PATH est conservé.
[persist_path]
windows = [
  'C:\Program Files\coreutils\bin',
  '{home}\.local\bin',
  '{home}\.cargo\bin',
  '{home}\.bun\bin',
]
