[package]
name = "sovereign-polyglot-ffi"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Fat-LTO Rust + PyO3 + Safetensors Zero-Copy + AVX2 SIMD Vector RAG + Tree-Sitter Polyglot FFI Engine"

[lib]
name = "sovereign_polyglot_ffi"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python-ext = ["dep:pyo3"]

[dependencies]
zerocopy = { version = "0.8.20", features = ["derive"] }
memmap2 = "0.9.5"
safetensors = "0.5.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
rayon = "1.10.0"
tree-sitter = "0.24.7"
tree-sitter-python = "0.23.6"
tree-sitter-rust = "0.23.3"
tree-sitter-typescript = "0.23.2"
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py312"], optional = true }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59.0"
features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Threading"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
