[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "agent-core"
version = "0.1.0"
description = "pyo3 bridge to the agent Context store (crates/agent-py)."
requires-python = ">=3.10"

[tool.maturin]
manifest-path = "../../crates/agent-py/Cargo.toml"
module-name = "agent_core"
