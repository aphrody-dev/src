# dist (axodotdev cargo-dist) release config for the `ay` CLI (package `aphrody`, crates/ay).
# Only `aphrody` opts in (`[package.metadata.dist] dist = true`); `dist = false` below keeps
# every other binary crate out. Regenerate the workflow with `dist generate` after
# editing; tag `v<workspace version>` to release. See docs/INSTALL_UPDATE.md.
[workspace]
members = ["cargo:."]

[dist]
# Opt-in only: members are skipped unless they set `[package.metadata.dist] dist = true`.
dist = false
cargo-dist-version = "0.34.0"
ci = "github"
installers = ["shell", "powershell"]
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]
# Same directory `ay up` manages, on every OS (never a system directory).
install-path = "~/.local/bin"
# `ay self-update` embeds axoupdater; no separate aphrody-update binary.
install-updater = false
# Release notes and artifacts on aphrody-dev/src GitHub Releases.
hosting = "github"
pr-run-mode = "plan"
# Build only the `aphrody` package (`--package`), not `--workspace`: cdylib members such as
# crates/agent-py cannot build for musl targets (release v0.2.0, 2026-11-13).
precise-builds = true
# release.yml carries two manual patches (checkout token for private submodules; ubuntu-24.04
# instead of 22.04, unsupported 2027-04-17, docs/infra/RUNNERS.md); re-apply them
# after `dist generate`.
allow-dirty = ["ci"]
