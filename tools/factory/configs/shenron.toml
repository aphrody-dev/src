# Factory pipeline config: shenron-chat-v2 (first pipeline of tools/factory).
# No secrets here: the MCP endpoint is public and read-only; anything private comes from
# /etc/aphrody/secrets.env on the fleet.

[model]
alias = "shenron-chat-v2"
base_hf = "Qwen/Qwen3.5-0.8B"
base_rev = "2fc06364715b967f1860aea9cf38778875588b17"
base_gguf_repo = "unsloth/Qwen3.5-0.8B-GGUF"
base_gguf_rev = "6ab461498e2023f6e3c1baea90a8f0fe38ab64d0"
base_gguf_file = "Qwen3.5-0.8B-Q4_K_M.gguf"
quant = "Q4_K_M"

[mcp]
url = "https://dragonballfr.com/mcp"
result_chars = 900

[sources]
# Paths relative to the shenron checkout shipped to the trainer.
code_roots = [
  "packages/api/src",
  "packages/db/src",
  "packages/config/src",
  "crates/shenron-mcp/src",
  "apps/server/src",
]
db_schema = "packages/db/src/full-schema.ts"
max_code_pairs = 500
max_db_pairs = 150

[train]
lora_r = 16
lora_alpha = 32
epochs = 2
lr = 2e-4
max_len = 1536
distractors = 7
eval_frac = 0.12
threads = 6
seed = 7

[serve]
port = 8799
ctx = 16384
threads = 4

# Entity seeds for the question templates (public Dragon Ball canon, no user data).
[seeds]
characters = [
  "Goku",
  "Vegeta",
