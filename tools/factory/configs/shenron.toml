# One or more French prompt templates per tool; {c} character, {t} topic, {d} databook, {n} number.
# args uses the same placeholders; tools not listed are still offered as distractors.
[[tasks]]
tool = "dragonball.wiki_search"
prompts = [
  "Cherche {c} dans le wiki.",
  "Que dit le wiki sur {t} ?",
  "Fiche wiki de {c} ?",
]
args = { query = "{c|t}" }
[[tasks]]
tool = "dragonball.rag_ask"
prompts = [
  "Qui est {c} exactement ?",
  "Explique-moi {t} avec des sources.",
  "Quel est le rôle de {c} dans Dragon Ball Z ?",
]
args = { question = "{prompt}" }
[[tasks]]
tool = "dragonball.canon_check"
prompts = [
  "Est-ce canon que {c} maîtrise le {t} ?",
  "Vérifie si {c} et {t} c'est canon.",
  "{t} est canon dans le manga ?",
]
args = { question = "{prompt}" }
[[tasks]]
tool = "dragonball.manga_search"
prompts = [
  "Dans quel chapitre du manga apparaît {c} ?",
  "Trouve les passages du manga sur {t}.",
  "Cherche {c} dans le manga.",
]
args = { query = "{c|t}" }
[[tasks]]
tool = "dragonball.manga_chapter"
prompts = [
  "Donne-moi le chapitre {n} du manga.",
  "Ouvre le chapitre {n}.",
  "Résumé du chapitre {n} ?",
]
args = { chapterId = "{n}" }
[[tasks]]
tool = "dragonball.databooks_search"
prompts = [
  "Quels databooks parlent de {c} ?",
  "Cherche {t} dans les guides officiels.",
  "Liste les databooks sur {t}.",
]
args = { q = "{c|t}" }
[[tasks]]
tool = "dragonball.databooks_plates"
prompts = [
  "Montre les planches du {d} sur {c}.",
  "Planches de databook avec {c} ?",
]
args = { q = "{c}" }
[[tasks]]
tool = "dragonball.lexicon_search"
prompts = [
  "Comment s'écrit {c} en japonais ?",
  "Traduction japonaise de {t} ?",
  "Nom original de {c} ?",
]
args = { query = "{c|t}" }
[[tasks]]
tool = "dragonball.timeline"
prompts = [
  "Donne la chronologie de Dragon Ball.",
  "Chronologie des événements de Dragon Ball Z ?",
  "Frise chronologique de la saga ?",
]
args = {}
[[tasks]]
tool = "dragonball.news"
prompts = [
  "Quelles sont les dernières actus Dragon Ball ?",
  "Quoi de neuf sur Dragon Ball ?",
  "Les {n} dernières news ?",
]
args = {}
[[tasks]]
tool = "dragonball.sources_search"
prompts = ["Quelles sources citent {c} ?", "Sources officielles sur {t} ?"]
args = { query = "{c|t}" }
[[tasks]]
tool = "dragonball.wiki_events"
prompts = [
  "Quels événements impliquent {c} ?",
  "Événements du wiki autour de {t} ?",
]
args = { q = "{c|t}" }
[[tasks]]
tool = "dragonball.bot_leaderboard"
prompts = ["Classement du bot Discord ?", "Top {n} du leaderboard ?"]
args = {}
[[tasks]]
tool = "dragonball.bot_commands"
prompts = [
  "Quelles commandes a le bot Shenron ?",
  "Liste des commandes Discord du bot ?",
]
args = {}
[[tasks]]
tool = "dragonball.data_coverage"
prompts = [
  "Quelle est la couverture des données du site ?",
  "Combien de données sont indexées ?",
]
args = {}
[[tasks]]
tool = "dragonball.manga_catalog"
prompts = [
  "Catalogue du manga disponible ?",
  "Quelles séries manga sont disponibles ?",
]
args = {}
[[tasks]]
tool = "dragonball.wiki_categories"
prompts = ["Quelles catégories a le wiki ?", "Liste des catégories du wiki."]
args = {}
[[tasks]]
tool = "dbfr_databooks"
prompts = [
  "Liste les databooks de dragonballfr.com sur {c}.",
  "Catalogue des databooks {d} ?",
]
args = { q = "{c|d}" }
[[tasks]]
tool = "dragonball.rag_search"
prompts = ["Recherche des passages sur {t}.", "Passages sourcés sur {c} ?"]
args = { query = "{c|t}" }
