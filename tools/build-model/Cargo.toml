[package]
name = "build-model"
version = "0.1.0"
edition = "2024"
publish = false
description = "Work/span model of a ninja/siso build: DAG from `siso query graph`, measured weights from siso_metrics.json, Graham/Brent bounds, list-scheduling simulation, bootstrap."

# Standalone: not a member of the C:\labs workspace.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false
