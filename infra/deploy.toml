# =============================================================================
# Multi-cloud and self-hosted deployment manifest. Node roles (2026-11-12, owner decision):
#   usa (ssh prd) = all production, every public DNS record points here;
#   fr1 (ssh vps) = builds only (Chromium, AOSP, kernel, wasm, Steam games);
#   fr2 (ssh cdn) = CDN edge and test machine (to be wiped and reinstalled). See docs/INFRA_MATRIX.md.
# Engine: `src-deploy` / `dpl` (Go 1.27 + Zig CGO + Rust + Bun v1.4.4 FFI)
# =============================================================================

[engine]
module = "sovereign.local/infra"
cli = "src-deploy"
shim = "dpl"
go_version = "1.27.0"
cshared_dll = "C:/Users/aphro/.local/bin/infra_go.dll"
oci_spec = "1.1"
caddyfile_out = "C:/src/infra/generated/Caddyfile"
plan_out = "C:/src/infra/generated/deploy-plan.json"

[mesh]
network_cidr = "10.200.77.0/24"
tunnel_protocol = "MASQUE+WireGuard"
config_dir = "C:/src/infra/mesh-vn/generated"

[nodes.fr1]
provider = "ovhcloud"
public_ip = "51.77.147.152"
mesh_ip = "10.200.77.1"
region = "eu-fr"
role = "build"
ssh_alias = "vps"
ssh_user = "ubuntu"

[nodes.fr2]
provider = "ovhcloud"
public_ip = "51.255.162.6"
mesh_ip = "10.200.77.3"
region = "eu-fr"
role = "cdn-edge-and-test"
ssh_alias = "cdn"
ssh_user = "ubuntu"

[nodes.usa]
provider = "hostinger"
public_ip = "72.60.186.43"
mesh_ip = "10.200.77.5"
region = "us-google-egress"
role = "production"
ssh_alias = "prd"
ssh_user = "root"
allow_non_google_workloads = true

[cloud]
cloudflare_account_id = "ca22c1a51a145f919b54afa18d936516"
gcloud_project = "aphrody"
gcloud_region = "europe-west1"
ollama_models = ["qwen3-coder", "deepseek-r1", "gemma4"]

[services.aphrody]
path = "C:/src/apps/aphrody"
runtime = "bun-fullstack"
region = "eu-fr"
nodes = ["usa"]
domains = ["aphrody.com", "www.aphrody.com"]
port = 3000
blue_port = 13000
green_port = 23000
r2_bucket = "aphrody-assets"
verify_gate = "wck check C:/src/apps/aphrody"

[services.shenron]
path = "C:/src/apps/shenron"
runtime = "bun-fullstack"
region = "eu-fr"
nodes = ["usa"]
domains = ["dragonballfr.com", "www.dragonballfr.com", "tv.dragonballfr.com"]
port = 3100
blue_port = 13100
green_port = 23100
r2_bucket = "shenron-cdn"

[services.rosegriffon]
path = "C:/src/apps/rosegriffon"
runtime = "bun-fullstack"
region = "eu-fr"
nodes = ["usa"]
domains = ["rosegriffon.fr", "www.rosegriffon.fr"]
port = 3320
blue_port = 13320
green_port = 23320
r2_bucket = "rosegriffon-media"

[services.ai-os]
path = "packages/ai-os"
runtime = "bun-fullstack"
region = "eu-fr"
nodes = ["usa"]
domains = ["ai.aphrody.com"]
port = 4000
blue_port = 14000
green_port = 24000

[services.rust-stack]
path = "C:/src/crates/depot-cli"
runtime = "rust-daemon"
region = "eu-fr"
nodes = ["usa"]
domains = ["depot.internal.aphrody.com"]
port = 4100
blue_port = 14100
green_port = 24100

[services.ai-triad]
path = "packages/ai-os"
runtime = "bun-fullstack"
region = "us-google-egress"
google_egress = true
nodes = ["usa"]
domains = ["gemini-egress.internal.aphrody.com", "triad.aphrody.com"]
port = 4200
blue_port = 14200
green_port = 24200

[services.ring3-agent]
path = "C:/src/crates/ring3-agent"
runtime = "rust-daemon"
region = "eu-fr"
nodes = ["usa"]
domains = ["r3d.internal.aphrody.com"]
port = 8080
blue_port = 18080
green_port = 28080

[services.yolo]
path = "C:/src/apps/yolo"
runtime = "bun-fullstack"
region = "eu-fr"
nodes = ["usa"]
domains = ["yolo.aphrody.com", "yolo.aphrody.app"]
port = 3092
blue_port = 13092
green_port = 23092
verify_gate = "wck check C:/src/apps/yolo"

# -----------------------------------------------------------------------------
# Live test targets (owner directive 2026-11-12). Tests tagged e2e:auth drive the
# owner's logged-in Chrome over CDP (APHRODY_CDP_URL, profile dir in
# APHRODY_CHROME_PROFILE); never store cookies or tokens. Mirror: packages/net/targets.json.
# Pure unit fixtures (URL parsing, rewriting) keep RFC 2606 example.* hosts: they must not touch the network.
# -----------------------------------------------------------------------------
[test_targets.gemini]
url = "https://gemini.google.com/app"
tag = "e2e:auth"
expect = ["avatar", "prompt", "model-response", "h2|h3", "TLS 1.3", "alt-svc h3"]

[test_targets.google]
url = "https://www.google.com/"
tag = "e2e:auth"
expect = ["avatar", "h2|h3", "TLS 1.3"]
# =============================================================================
# Hosting placement (docs/infra/HOSTING-POLICY.md). One table per deployable app.
# `bun scripts/deploy-target.ts <app> <cf|vercel|vps>` renders the host config from here.
#   target      = current production host; every app must also render for the others
#   commercial  = true forbids Vercel Hobby (non-commercial personal use only)
#   cf_tool     = "wrangler" when the project already ships a wrangler config (keep it), else "cf"
#   storage/kv/sql per target: r2:<BINDING> | s3 | fs:<dir> ; cf:<BINDING> | redis ; d1:<BINDING> | url
#   Secrets (S3_*, REDIS_URL, DATABASE_URL, CRON_SECRET) live in Workers secrets / Vercel env / systemd EnvironmentFile, never here.
# =============================================================================

[hosting.aphrody]
service = "aphrody"
target = "cf"
commercial = true # ads.txt + sellers.json (AdSense)
cf_tool = "wrangler"
cf_config = "apps/aphrody/wrangler.toml"
vps_exec = "bun run server.ts"
origin_path = ["/api/*", "/g/*", "/search"]

[hosting.aphrody-app]
target = "cf"
commercial = true
cf_tool = "wrangler"
cf_config = "apps/aphrody-app/wrangler.toml"
domains = ["aphrody.app"]
path = "C:/src/apps/aphrody-app"
port = 3010

[hosting.downloads]
path = "C:/src/apps/r2-site"
target = "cf"
commercial = false
domains = ["downloads.aphrody.com"]
port = 8797
cf_entry = "src/entry.cf.ts"
worker_name = "downloads-portable"
vps_exec = "bun run src/entry.vps.ts"
cf = { STORAGE = "r2:BUCKET", r2_bucket = "aphrody-dist" }
vps = { STORAGE = "s3", S3_BUCKET = "aphrody-dist" }
vercel = { STORAGE = "s3", S3_BUCKET = "aphrody-dist" }
vars = { PREFIX = "aphrody", SERVICE = "aphrody-downloads", SPA = "0" }

[hosting.cdn]
path = "C:/src/apps/r2-site"
target = "cf"
commercial = false
domains = ["cdn.aphrody.com"]
port = 8796
cf_entry = "src/entry.cf.ts"
worker_name = "cdn-portable"
vps_exec = "bun run src/entry.vps.ts"
cf = { STORAGE = "r2:BUCKET", r2_bucket = "aphrody-assets" }
vps = { STORAGE = "s3", S3_BUCKET = "aphrody-assets" }
vercel = { STORAGE = "s3", S3_BUCKET = "aphrody-assets" }
vars = { PREFIX = "", SERVICE = "aphrody-cdn", SPA = "0" }

[hosting.yolo]
service = "yolo"
target = "vps"
commercial = false
vps_exec = "bun run server.ts"

# =============================================================================
# Authentication and network access (docs/infra/AUTH.md). `ay auth status|repair|gh-secrets|tunnels`
# (packages/env-kit/src/auth.ts) walks [nodes.*] over ssh and the tables below. Names only: values
# live in the OS secret store (`ay secret`: DPAPI on Windows, systemd-creds on Linux), then .env.
# =============================================================================

# GitHub Actions secrets pushed by `ay auth gh-secrets` (`gh secret set --body -`, value on stdin).
# AI provider keys (ANTHROPIC_API_KEY...) are synced by the AI provider tooling, not listed here.
[auth.github.repo_secrets]
"aphrody-labs/src" = ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID", "HOSTINGER_API_TOKEN", "VERCEL_TOKEN", "SUBMODULES_TOKEN"]

[auth.github.org_secrets]
aphrody-labs = ["HOSTINGER_API_TOKEN", "CARGO_REGISTRY_TOKEN"]

# Per node: cloudflared units (unit = tunnel name), WireGuard interfaces (handshake < 180 s),
# units that renew a credential (must not be failed). repair = false: checked, never changed.
[auth.hosts.fr1]
wireguard = ["wg1"]
repair = false

[auth.hosts.fr2]
wireguard = ["wg1"]
units = ["certbot"]

[auth.hosts.usa]
tunnels = { cloudflared-mig-prd = "mig-prd", cloudflared-prod = "prod" }
wireguard = ["prod", "vps"]
units = ["shenron-cloudflare-s3-renew", "rg-steam-depot"]

# Keyless CI (docs/infra/AUTH-ECOSYSTEM.md). `ay auth oidc` creates the GitHub Actions OIDC federation
# into GCP idempotently; workflows then use google-github-actions/auth with
# workload_identity_provider = projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
# and service_account, `permissions: id-token: write`, no JSON key. `replaces`: long-lived CI secret ->
# the OIDC mechanism that makes it unnecessary (reported by `ay auth status --only oidc` while present).
[auth.oidc.gcp]
project = "aphrody"
project_number = "468000409790"
pool = "github"
provider = "aphrody-dev"
issuer = "https://token.actions.githubusercontent.com"
condition = "assertion.repository_owner=='aphrody-labs'"
service_account = "yolo-automation@aphrody.iam.gserviceaccount.com"
repos = ["aphrody-labs/src"]
account = "yohanpierre15@gmail.com"

[auth.oidc.replaces]
CARGO_REGISTRY_TOKEN = "crates.io trusted publishing (RFC 3691, rust-lang/crates-io-auth-action) : lier aphrody-labs sur crates.io, puis gh secret delete CARGO_REGISTRY_TOKEN --org aphrody-labs"
NPM_TOKEN = "npm trusted publishing (OIDC, GA 2025-07-31) : configurer chaque paquet, puis supprimer le secret"

# Public keys leaked in aphrody-labs/mesh-vn history (docs/publish/STATUS.md): rotate with
# infra/fleet/wg/rotate-wg-win.sh (UAC), then remove the peer everywhere.
[auth.wireguard]
revoked = ["up+fbCDKsbVlLZSFXR3k4U3I784oSqwO8/ijyHSM/yM="]

# =============================================================================
# Container images (infra/docker, docs/infra/DEPLOY.md). One entry per image built by
# infra/docker/docker-bake.hcl and run by infra/docker/compose.yaml (service = compose service).
# host_port = the deploy.toml green port, 127.0.0.1 only; nginx/cloudflared switch blue -> green.
# Rollback: SRC_TAG=<previous sha> just docker-up <profile> <ctx>.
# =============================================================================
[containers]
registry = "ghcr.io/aphrody-labs"
platforms = ["linux/amd64", "linux/arm64"]

[containers.images]
ai-os = { target = "ai-os", services = ["ai-os-relay", "ai-os-gateway"], host_ports = [28790, 24000], profile = "core", nodes = ["usa"] }
aphrody = { target = "aphrody", services = ["aphrody"], host_ports = [23000], profile = "core", nodes = ["usa"] }
yolo = { target = "yolo", services = ["yolo"], host_ports = [23092], profile = "core", nodes = ["usa"] }
rust-stack = { target = "rust-stack", services = ["rust-stack"], host_ports = [24100], profile = "core", nodes = ["usa"] }
r3d = { target = "r3d", services = ["r3d"], host_ports = [28080], profile = "core", nodes = ["usa"] }
loreserver = { target = "loreserver", services = ["loreserver"], host_ports = [31339], profile = "core", nodes = ["usa"] }
r2-site = { target = "r2-site", services = ["downloads", "cdn"], host_ports = [28797, 28796], profile = "edge", nodes = ["fr2", "usa"] }
api-gateway = { target = "api-gateway", services = ["api-gateway"], host_ports = [28081], profile = "edge", nodes = ["fr2", "usa"] }
llama = { upstream = "ghcr.io/ggml-org/llama.cpp:server-b12316", services = ["llama"], host_ports = [28088], profile = "ai", nodes = ["usa"] }

# -----------------------------------------------------------------------------
# Cluster layer (origin side): LB + failover + request dedup across fr1/fr2/prd.
# Single source for infra/cluster/gen.ts -> infra/cluster/generated/<member>/ (docs/infra/CLUSTER.md).
# Edge (DNS, Workers, Cache Rules, Tunnel ingress, Access) belongs to infra/cloudflare + docs/infra/FR2-CLOUDFLARE.md.
# Transport (definitive, 2026-11-13): HAProxy backend mTLS over TCP 7444 between members; also carries sshd
# (ProxyCommand infra/cluster/ssh-mesh.sh) so runner.ts / orch/fleet.ts get an ssh path independent of WireGuard.
# Data plane = HAProxy 3.4: 127.0.0.1:<lb> on every member -> weighted, URI-hashed pool -> local nginx
# cache shard or remote member over backend mTLS (TCP 7444, private CA, verify required); no ssh, no WireGuard.
# -----------------------------------------------------------------------------
[cluster]
domain = "cluster.internal"     # SNI <service>.<member>.cluster.internal
mesh_port = 7444                # TCP, public IPv4, mTLS only (fleet IPs already allowed by fr2 nft table)
stats_port = 19900              # 127.0.0.1: /stats, /metrics (Prometheus)
check_inter_ms = 1000
check_fall = 2
check_rise = 3
cache_max_size = "2g"

[cluster.members.fr1]
node = "fr1"
ssh = "fr1"
pc_identity = "~/.ssh/id_ed25519_vn"
weight = 20                     # low weight: Chromium/LLVM builds keep priority
slice = { CPUQuota = "200%", MemoryMax = "6G", CPUWeight = "10", IOWeight = "10" }
[cluster.members.fr2]
node = "fr2"
ssh = "fr2"
pc_identity = "~/.ssh/id_ed25519_vn"
weight = 60
[cluster.members.prd]
node = "usa"
ssh = "prd"
pc_identity = "~/.ssh/hostinger_us_ed25519"
weight = 100

# Stateless, multi-member. targets = member -> local origin. cache: micro (honour origin headers, else 1 s
# for anonymous GET/HEAD), honor (origin headers only), off (no shard, no coalescing).
[cluster.services.downloads]
lb_port = 19797
targets = { fr1 = "127.0.0.1:28797", fr2 = "127.0.0.1:28797", prd = "127.0.0.1:28797" }
check = { path = "/", host = "downloads.aphrody.com", expect = "! rstatus ^5" }
cache = "micro"
[cluster.services.cdn]
lb_port = 19796
targets = { fr1 = "127.0.0.1:28796", fr2 = "127.0.0.1:28796", prd = "127.0.0.1:28796" }
check = { path = "/", host = "cdn.aphrody.com", expect = "status 200" }
cache = "micro"
[cluster.services.api-gateway]
lb_port = 19081
targets = { fr1 = "127.0.0.1:28081", fr2 = "127.0.0.1:28081", prd = "127.0.0.1:28081" }
check = { path = "/", host = "api.aphrody.com", expect = "status 200" }
cache = "micro"

# Single-member today (prd); every member still answers on lb_port, so Tunnel replicas can run anywhere.
[cluster.services.mig-test]
lb_port = 19780
targets = { prd = "127.0.0.1:8780" }
check = { path = "/", host = "mig-test.aphrody.com", expect = "status 200" }
cache = "honor"
[cluster.services.depot]
lb_port = 19182
targets = { prd = "10.200.77.5:8182" }
check = { path = "/health", host = "mig-depot.aphrody.com", expect = "rstatus ^[24]" }
cache = "off"
[cluster.services.commons]
lb_port = 19766
targets = { prd = "10.200.77.5:8766" }
check = { path = "/health", host = "mig-commons.aphrody.com", expect = "status 200" }
cache = "off"
[cluster.services.relay]
lb_port = 19889
targets = { prd = "127.0.0.1:3889" }
check = { path = "/health", host = "relay.cluster.internal", expect = "status 200" }
cache = "off"

# TCP services (mode tcp, connect check). nativelink: replaces the prd -> fr1 ssh forward of 50051/50061.
[cluster.services.nativelink]
mode = "tcp"
lb_port = 19051
targets = { fr1 = "10.200.77.1:50051" }
[cluster.services.nativelink-cas]
mode = "tcp"
lb_port = 19061
targets = { fr1 = "10.200.77.1:50061" }

# sshd of every member over the mesh (pinned: no pool, reached as <member>-mesh through ProxyCommand
# aphrody-ssh-mesh / openssl s_client). Independent of WireGuard; runner.ts and orch/fleet.ts fall back to direct ssh.
[cluster.services.ssh]
mode = "tcp"
pinned = true
targets = { fr1 = "127.0.0.1:22", fr2 = "127.0.0.1:22", prd = "127.0.0.1:22" }

# Benchmark endpoint (static nginx files on every member; 29990 also reachable from the WireGuard subnet for the comparison).
[cluster.services.bench]
lb_port = 19990
targets = { fr1 = "127.0.0.1:29990", fr2 = "127.0.0.1:29990", prd = "127.0.0.1:29990" }
check = { path = "/bench/health", host = "bench.cluster.internal", expect = "status 200" }
cache = "off"

# Stateful: single primary, never load-balanced, not exposed on the mesh.
[cluster.stateful.postgres]
primary = "prd"
target = "127.0.0.1:5432"
backup = []                     # no standby yet: dumps only; a standby would stream WAL over the mesh (mode tcp service)
[cluster.stateful.redis]
primary = "prd"
target = "127.0.0.1:6379"
backup = []
