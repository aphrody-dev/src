# Chromium profiles of the agents and user data to back up (age envelope to the PC recipient,
# `env-kit vault backup`). The owner's main profile (Google\Chrome\User Data) is refused by code.
# Portability per engine: docs/infra/VAULT.md, section "Chromium".

[[profile]]
name = "relay-chrome"
# CDP relay of ai-os (packages/ai-os/src/relay/cdp.ts): Chrome stable, dedicated --user-data-dir.
path = "%LOCALAPPDATA%/aphrody/relay/chrome"
engine = "chrome-stable"

[[profile]]
name = "chrome-devtools-mcp"
path = "%LOCALAPPDATA%/chrome-devtools-mcp"
engine = "cft"

# Caches and lock files are never copied (regenerated by Chromium).
[exclude]
globs = ["*/Cache/*", "*/Code Cache/*", "*/GPUCache/*", "*/DawnGraphiteCache/*", "*/DawnWebGPUCache/*",
  "*/GrShaderCache/*", "*/ShaderCache/*", "*/Service Worker/CacheStorage/*", "*/Crashpad/*",
  "*/component_crx_cache/*", "*/optimization_guide_model_store/*", "Singleton*", "*.lock", "LOCK"]

[[userdata]]
name = "relay-state"
# OAuth state of the relay is a sealed document (vault doc relay-oauth); token and TLS stay here.
path = "%LOCALAPPDATA%/aphrody/relay"
include = ["token", "tls"]

[[userdata]]
name = "gh-config"
path = "%APPDATA%/GitHub CLI"

[[userdata]]
name = "rclone"
path = "%APPDATA%/rclone"

[[userdata]]
name = "ssh"
path = "~/.ssh"
