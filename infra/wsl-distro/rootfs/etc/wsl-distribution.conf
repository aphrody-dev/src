# /etc/wsl-distribution.conf - learn.microsoft.com/windows/wsl/build-custom-distro (MicrosoftDocs/WSL@7b28cc1e).
# defaultName is rewritten per profile by scripts/build-image.sh (aphrody-desktop, aphrody-dev).
[oobe]
command = /usr/lib/wsl/first-setup-aphrody-omarchy.sh
defaultUid = 1000
defaultName = aphrody-omarchy

[shortcut]
enabled = true
icon = /usr/lib/wsl/aphrody-omarchy.ico

[windowsterminal]
enabled = true
