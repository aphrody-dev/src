# /etc/wsl.conf - aphrody (CachyOS) WSL 2 distribution settings.
# Keys: learn.microsoft.com/windows/wsl/wsl-config (MicrosoftDocs/WSL@50342fc5).
# Default user comes from wsl-distribution.conf (oobe.defaultUid = 1000), not from [user].
# WSLg creates /tmp/.X11-unix -> /mnt/wslg/.X11-unix during WSL init: no /tmp in fstab, tmp.mount stays masked.
[boot]
systemd=true

[automount]
enabled=true
root=/mnt/
options="metadata,umask=22,fmask=11"
mountFsTab=true
cgroups=v2

[interop]
enabled=true
appendWindowsPath=true

[network]
generateHosts=true
generateResolvConf=true

[gpu]
enabled=true
appendLibPath=true

[time]
useWindowsTimezone=true
