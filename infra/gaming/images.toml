# Gaming OS images followed by the monorepo (sources, not builds). Owner: docs/gaming/OWNERSHIP.md.
# Nothing here is built on the workstation; an image build runs in CI (ghcr.io/aphrody-labs/*) or on
# fr1 with nice -n 19. CachyOS kernel and packages belong to the Linux layer (docs/native/linux/OWNERSHIP.md,
# infra/pkg); this file only records the gaming-facing images.

[bazzite]
source = "third_party/bazzite" # fork aphrody-labs/bazzite (Apache-2.0), stack `bazzite` (stacks.d/gaming.toml)
image = "ghcr.io/ublue-os/bazzite-nvidia" # RTX 4070 hosts; `bazzite` for AMD/Intel, `bazzite-deck` for handhelds
channel = "stable" # tags seen on 2026-11-13: stable, testing, stable-44.YYYYMMDD
rebase = "rpm-ostree rebase ostree-unverified-registry:ghcr.io/ublue-os/bazzite-nvidia:stable" # third_party/bazzite/README.md

[steamos]
# SteamOS images are Valve's: downloaded from Valve, never mirrored. Open components are forked:
# steamos-manager (MIT), steam-runtime-tools (LGPL-2.1+, pressure-vessel), gamescope (BSD-2).
recovery = "https://steamdeck-images.steamos.cloud/recovery/steamdeck-repair-latest.img.bz2" # linked from store.steampowered.com/steamos/download?ver=steamdeck (checked 2026-11-13)
sources = [
  "third_party/steamos-manager",
  "third_party/steam-runtime-tools",
  "third_party/gamescope",
]

[cachyos]
# Gaming side only: proton-cachyos and wine-cachyos are branches of the single Proton and Wine forks
# (cachyos_main, cachyos_11.0); release tarballs are picked by crates/steam-depot/src/proton.rs
# (select_release_asset, x86-64-v3 detection). Kernel, PKGBUILDs and ISO: Linux layer.
proton_branch = "aphrody-labs/Proton:cachyos_main"
wine_branch = "aphrody-labs/wine:cachyos_11.0"
