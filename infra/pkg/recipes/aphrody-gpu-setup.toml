name = "aphrody-gpu-setup"
version = "1.0.0"
release = 1
date = "2026-11-13"
summary = "Reproducible NVIDIA and AMD GPU setup scripts (official repositories only)"
description = "Installs the NVIDIA open kernel modules, CUDA and the container toolkit, or ROCm and RADV, from the vendors' and distributions' own repositories. Ships no proprietary file."
license = "MIT OR Apache-2.0"
homepage = "https://github.com/aphrody-labs/src"
maintainer = "aphrody-dev <dev@aphrody.com>"
arch = "all"
portage_category = "app-admin"
targets = ["arch", "debian", "alpine", "portage", "nix", "docker"]

[[files]]
src = "infra/linux/gpu/nvidia.sh"
dest = "/usr/libexec/aphrody/gpu-nvidia"
mode = "755"

[[files]]
src = "infra/linux/gpu/amd.sh"
dest = "/usr/libexec/aphrody/gpu-amd"
mode = "755"

[[files]]
src = "infra/linux/gpu/manifest.toml"
dest = "/usr/share/aphrody/gpu-manifest.toml"
mode = "644"

[depends]
arch = ["curl"]
debian = ["curl", "ca-certificates", "gnupg"]
alpine = ["curl"]
portage = ["net-misc/curl"]
nix = []
