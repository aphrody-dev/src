# makepkg drop-in (pacman >= 7 reads /etc/makepkg.conf.d/*.conf after makepkg.conf).
# x86-64-v3 for the whole fleet (prd Zen 4 is v4, fr1/fr2 Haswell are v3), clang + lld + ThinLTO.
CC=clang
CXX=clang++
AR=llvm-ar
NM=llvm-nm
RANLIB=llvm-ranlib
CFLAGS="-march=x86-64-v3 -mtune=generic -O2 -pipe -fno-plt -fexceptions -Wp,-D_FORTIFY_SOURCE=3 -Wformat -Werror=format-security -fstack-clash-protection -fcf-protection -fno-omit-frame-pointer -mno-omit-leaf-frame-pointer"
CXXFLAGS="$CFLAGS -Wp,-D_GLIBCXX_ASSERTIONS"
LDFLAGS="-fuse-ld=lld -Wl,-O1 -Wl,--sort-common -Wl,--as-needed -Wl,-z,relro -Wl,-z,now -Wl,-z,pack-relative-relocs"
LTOFLAGS="-flto=thin"
RUSTFLAGS="-C target-cpu=x86-64-v3 -C force-frame-pointers=yes -C link-arg=-fuse-ld=lld"
MAKEFLAGS="-j$(nproc)"
OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug lto)
