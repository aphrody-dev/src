# Gaming forks (docs/gaming/OWNERSHIP.md): mirror model, no local patches. Default branch even with the
# fork parent (GitHub Sync fork); variants (Valve, CachyOS, GE) are branches of the same fork, never copies.
# `ay upstream sync gaming --push` (group = this file name), daily on prd through aphrody-upstream.timer.
# A fork that starts carrying patches moves to model = "branch" or "series" in ../stacks.toml.

[stack.proton]
model = "mirror"
upstream = "ValveSoftware/Proton"
upstream_url = "https://github.com/ValveSoftware/Proton.git"
ref = "proton_11.0"
fork = "aphrody-labs/Proton"
branch = "proton_11.0"
checkout = "third_party/Proton"
forge = "github"
rules = "common"
runner = "prd"

[[stack.proton.variants]]
branch = "cachyos_main"
url = "https://github.com/CachyOS/proton-cachyos.git"
ref = "cachyos_main"
network = "CachyOS/proton-cachyos"

[[stack.proton.variants]]
branch = "ge"
url = "https://github.com/GloriousEggroll/proton-ge-custom.git"
ref = "master"
network = "GloriousEggroll/proton-ge-custom"

[stack.wine]
model = "mirror"
upstream = "wine-mirror/wine"
upstream_url = "https://github.com/wine-mirror/wine.git"
ref = "master"
fork = "aphrody-labs/wine"
branch = "master"
checkout = "third_party/wine"
forge = "github"
rules = "common"
runner = "prd"

[[stack.wine.variants]]
branch = "proton_11.0"
url = "https://github.com/ValveSoftware/wine.git"
ref = "proton_11.0"

[[stack.wine.variants]]
branch = "cachyos_11.0"
url = "https://github.com/CachyOS/wine-cachyos.git"
ref_pattern = "^cachyos_11\\.0_[0-9]{8}/main$"

