# Patch stacks of the forks we keep compatible with upstream. Read by `ay upstream` (packages/upstream).
# Process, statuses and calendar: docs/upstream/STRATEGY.md.
#
# model = "branch": the fork's default branch is upstream/<ref> plus a linear series of patch commits
#   (each commit = one patch, status in its `Upstream-Status:` trailer). `ay upstream sync` replays the
#   series on the new upstream tip and pushes with --force-with-lease.
# model = "series": patch files in `series` (Electron layout: one .patch per change, order in `.patches`),
#   checked against the upstream tip on a scratch index; the fork's default branch mirrors upstream.

[stack.bun]
model = "branch"
upstream = "oven-sh/bun"
upstream_url = "https://github.com/oven-sh/bun.git"
ref = "main" # canary: bun publishes canary builds from main
fork = "aphrody-labs/bun"
branch = "main"
checkout = "third_party/bun"
forge = "github"
rules = "bun"
runner = "prd"
# Upstream's own CI, dispatched on an ephemeral PR head before the PR is opened (they run on pull_request
# and workflow_dispatch in oven-sh/bun; build + test runs on oven's Buildkite once the PR is open).
lint_workflows = ["format.yml", "lint.yml", "rust-lints.yml", "source-lints.yml"]


[stack.chromium]
model = "series"
upstream = "chromium/src"
upstream_url = "https://chromium.googlesource.com/chromium/src.git"
ref = "main"
fork = "aphrody-labs/chromium" # GitHub mirror, kept even with upstream (merge-upstream API)
github_upstream = "chromium/chromium"
branch = "main"
checkout = "third_party/chromium/src"
series = "infra/upstream/chromium/patches"
forge = "gerrit"
gerrit = "https://chromium-review.googlesource.com"
rules = "chromium"
runner = "fr1"


# Linux system stacks (docs/linux/OWNERSHIP.md, docs/linux/PATCHSETS.md). Series model: the fork mirrors
# upstream on its default branch (merge-upstream API at each `sync --push`), our patches live in
# infra/upstream/patches/<stack>/ and are checked against the upstream tip every day on prd (git only).
# Kernel source patchsets we only follow (zen, xanmod, liquorix, GKI, ChromeOS) are in
# infra/linux/patchsets.toml, read by `ay linux status`.

[stack.linux-cachyos]
model = "series"
upstream = "CachyOS/linux-cachyos"
upstream_url = "https://github.com/CachyOS/linux-cachyos.git"
ref = "master"
fork = "aphrody-labs/linux-cachyos"
branch = "master"
checkout = "third_party/linux-cachyos"
series = "infra/upstream/patches/linux-cachyos"
forge = "github"
rules = "common"
runner = "prd"

[stack.cachyos-pkgbuilds]
model = "series"
upstream = "CachyOS/CachyOS-PKGBUILDS"
upstream_url = "https://github.com/CachyOS/CachyOS-PKGBUILDS.git"
ref = "master"
fork = "aphrody-labs/CachyOS-PKGBUILDS"
branch = "master"
checkout = "third_party/CachyOS-PKGBUILDS"
series = "infra/upstream/patches/cachyos-pkgbuilds"
forge = "github"
rules = "common"
runner = "prd"

[stack.kernel-patches]
model = "series"
upstream = "CachyOS/kernel-patches"
upstream_url = "https://github.com/CachyOS/kernel-patches.git"
ref = "master"
fork = "aphrody-labs/kernel-patches"
branch = "master"
checkout = "third_party/kernel-patches"
series = "infra/upstream/patches/kernel-patches"
forge = "github"
rules = "common"
runner = "prd"

[stack.liquorix]
model = "series"
upstream = "damentz/liquorix-package"
upstream_url = "https://github.com/damentz/liquorix-package.git"
ref = "7.3/master" # follows the kernel series; `ay linux sync --write` moves it with infra/linux/patchsets.toml
fork = "aphrody-labs/liquorix-package"
branch = "7.3/master"
checkout = "third_party/liquorix-package"
series = "infra/upstream/patches/liquorix"
forge = "github"
