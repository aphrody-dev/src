# Skills propres à une machine (hors dépôt public) : contrôle de présence seul.
[[skill.private]]
name = "windows-machine"
hosts = ["pc"]

[[skill.private]]
name = "chrome"
hosts = ["pc"]

[[skill.private]]
name = "shell"
hosts = ["pc"]

# Autres agents : mêmes plugins depuis la marketplace racine (copie dans leur propre cache, aucun lien).
# mcp = liste exclusive : tout autre serveur MCP de l'agent est retiré (le relais l'expose déjà).
[codex]
marketplace = "aphrody"
plugins = ["aphrody-skills@aphrody"]
mcp = ["relay"]

[agy]
plugins = ["aphrody-skills@aphrody"]
mcp = ["relay"]

# Agents configurés par fichier : la clé MCP est réécrite (les autres clés sont conservées, les commentaires JSONC non).
# Fichier absent = agent non installé, ignoré.
[[mcpfile]]
agent = "opencode"
path = "{home}/.config/opencode/opencode.jsonc"
key = "mcp"
shape = "opencode"
mcp = ["relay"]

# Claude Desktop : serveurs stdio seulement ; le relais en stdio remplace les serveurs à clé d'API en clair.
[[mcpfile]]
agent = "claude-desktop"
path = "{appdata}/Claude/claude_desktop_config.json"
key = "mcpServers"
shape = "stdio"
mcp = ["relay"]

[[mcpfile]]
agent = "pi"
path = "{home}/.pi/agent/mcp.json"
key = "mcpServers"
shape = "claude"
mcp = ["relay"]

[[mcpfile]]
agent = "gemini"
path = "{home}/.gemini/settings.json"
key = "mcpServers"
shape = "gemini"
mcp = ["relay"]

[gemini]
extensions = [".agents"]

# Liens et copies interdits : tout lien (symlink, jonction) ou copie homonyme d'une skill de src dans ces dossiers est retiré,
# le plugin aphrody-skills la fournit déjà.
[cleanup]
link_dirs = [
  "{home}/.claude/skills",
  "{home}/.gemini/skills",
  "{home}/.agents/skills",
  "{home}/.codex/skills",
]
drop_copies = true
drop_skills = [
  "web-design-guidelines",
  "gpui-kit",
  "gpui-kit-design-guides",
  "webui-reference",
]
