# --- MCP Aphrody / AI Tools (conservés) ---
# ~/.claude.json est la seule liste de serveurs MCP : le relais les agrège (<serveur>__<outil>) pour les autres agents.
# Claude Code les déclare déjà : il prend le relais sans agrégat (/mcp/core) ; shared_url = route complète des autres.
[[claude.mcp]]
name = "relay"
url = "http://127.0.0.1:8790/mcp/core"
shared_url = "http://127.0.0.1:8790/mcp"
headers_helper = "bun {src}/packages/machine/src/relay-headers.ts"
# agy n'a ni OAuth vérifiable ni en-tête sans secret en clair : même serveur en stdio, sans autorisation.
stdio_command = ["bun", "{src}/packages/ai-os/src/relay/cli.ts", "mcp-stdio"]
hosts = ["pc"]

[[claude.mcp]]
name = "cloudflare"
url = "https://mcp.cloudflare.com/mcp"
hosts = ["pc"]

[[claude.mcp]]
name = "cloudflare-docs"
url = "https://docs.mcp.cloudflare.com/mcp"
hosts = ["pc"]

[[claude.mcp]]
name = "vercel"
url = "https://mcp.vercel.com"
hosts = ["pc"]

[[claude.mcp]]
name = "rea"
command = ["C:/Program Files/nodejs/node.exe", "{home}/.bun/install/global/node_modules/rea-agents/scripts/rea.mjs", "mcp"]
# JAVA_HOME vient de l'environnement utilisateur (aucun chemin de correctif JDK figé ici).
env = { GHIDRA_INSTALL_DIR = "{home}/AppData/Local/ghidra" }
install = ["bun", "add", "-g", "rea-agents"]
hosts = ["pc"]

[[claude.mcp]]
name = "agent-desktop"
command = ["{bin}/agent-desktop.exe", "mcp"]
hosts = ["pc"]

[[claude.mcp]]
name = "agent-browser"
command = ["{bin}/agent-browser.exe", "mcp"]
hosts = ["pc"]

