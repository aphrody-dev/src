# Manifeste versionné de l'outillage agent (Claude Code, Codex, agy, OpenCode, Pi, Gemini CLI ; PC et flotte). Toute installation passe ici ;
# applier : packages/machine/src/toolchain.ts (`ay agents install|sync|check|list`).
# Nettoyé le 2026-11-14 : plugins de skills tiers désinstallés ; les skills utiles (dont android-*, issues de android/skills) sont versionnées dans .agents/skills et servies par `aphrody-skills`. Outils AI : `relay`, `agent-desktop`, `agent-browser`.

# Config globale de Claude Code, versionnée dans infra/agents/claude ({src} et {home} substitués).
# settings.json : fusion des clés gérées seulement (modèle, effort, mode rapide et plugins restent au choix du poste).
[[claude.home]]
src = "infra/agents/claude/CLAUDE.md"
dest = "{home}/.claude/CLAUDE.md"
hosts = ["pc"]

[[claude.home]]
src = "infra/agents/claude/output-styles/autonome.md"
dest = "{home}/.claude/output-styles/autonome.md"
hosts = ["pc"]

[[claude.home]]
src = "infra/agents/claude/settings.json"
dest = "{home}/.claude/settings.json"
merge = true
hosts = ["pc"]

[[claude.marketplace]]
name = "aphrody"
path = "."

# Marketplaces dont plus aucun plugin n'est installé (clones et vérifications de mise à jour inutiles).
