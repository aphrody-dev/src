# Manifeste versionné de l'outillage agent (Claude Code, Codex, agy, Gemini CLI ; PC et flotte). Toute installation passe ici ;
# applier : packages/machine/src/toolchain.ts (`ay agents install|sync|check|list`).
# Nettoyé le 2026-11-14 : ne conserve que les skills Aphrody (`aphrody-skills`, `aphrody-nhitl`) et les outils AI (`relay`, `ai-os`, `agent-desktop`, `agent-browser`).

[[claude.marketplace]]
name = "aphrody"
path = "."

[[claude.marketplace]]
name = "rosegriffon-plugins"
path = "apps/rosegriffon"
hosts = ["pc"]

# --- Plugins Aphrody (conservés) ---
[[claude.plugin]]
id = "aphrody-skills@aphrody"
refresh = true

[[claude.plugin]]
id = "aphrody-nhitl@aphrody"
refresh = true

# --- Plugins externes / tiers (désinstallés) ---
[[claude.plugin]]
id = "document-skills@anthropic-agent-skills"
scope = "user"
state = "absent"

[[claude.plugin]]
id = "google-cloud-developer@google-plugins"
scope = "user"
state = "absent"

[[claude.plugin]]
id = "modern-web-guidance@googlechrome"
scope = "user"
state = "absent"

[[claude.plugin]]
id = "gemini-skills@gemini-skills"
scope = "user"
state = "absent"

[[claude.plugin]]
id = "android-skills@android-skills"
scope = "user"
state = "absent"

[[claude.plugin]]
id = "figma@claude-plugins-official"
scope = "user"
state = "absent"

[[claude.plugin]]
id = "figma-to-code-design-to-react-vue-and-html@anthropic-plugin-directory"
scope = "user"
state = "absent"

[[claude.plugin]]
id = "vercel-agent-skills@aphrody"
state = "absent"

[[claude.plugin]]
id = "web-quality-skills@aphrody"
state = "absent"

[[claude.plugin]]
id = "unreal-engine-skills-for-claude-code@aphrody"
hosts = ["pc"]
state = "absent"

[[claude.plugin]]
id = "github@claude-plugins-official"
state = "absent"

[[claude.plugin]]
id = "clangd-lsp@claude-plugins-official"
state = "absent"

[[claude.plugin]]
id = "rust-analyzer-lsp@claude-plugins-official"
state = "absent"

[[claude.plugin]]
id = "typescript-lsp@claude-plugins-official"
state = "absent"

[[claude.plugin]]
id = "math-proof@claude-plugins-official"
state = "absent"

[[claude.plugin]]
id = "cloudflare@anthropic-plugin-directory"
state = "absent"

[[claude.plugin]]
id = "microsoft-docs@anthropic-plugin-directory"
state = "absent"

[[claude.plugin]]
id = "context7@anthropic-plugin-directory"
state = "absent"

[[claude.plugin]]
id = "resend@anthropic-plugin-directory"
hosts = ["pc"]
state = "absent"

# --- MCP Aphrody / AI Tools (conservés) ---
[[claude.mcp]]
name = "relay"
url = "http://127.0.0.1:8790/mcp"
hosts = ["pc"]

[[claude.mcp]]
name = "agent-desktop"
command = ["{bin}/agent-desktop.exe", "mcp"]
hosts = ["pc"]

[[claude.mcp]]
name = "agent-browser"
command = ["{bin}/agent-browser.exe", "mcp"]
hosts = ["pc"]

# --- MCP externes / tiers (retirés) ---
[[claude.mcp]]
name = "chrome-devtools"
hosts = ["pc"]
state = "absent"

[[claude.mcp]]
name = "firebase"
hosts = ["pc"]
state = "absent"

[[claude.mcp]]
name = "figma"
hosts = ["pc"]
state = "absent"

[[claude.mcp]]
name = "developer-knowledge"
hosts = ["pc"]
state = "absent"

[[claude.mcp]]
name = "hostinger-api"
hosts = ["pc"]
state = "absent"

# Skills propres à une machine (hors dépôt public) : contrôle de présence seul.
[[skill.private]]
name = "windows-machine"
hosts = ["pc"]

[[skill.private]]
name = "chrome"
hosts = ["pc"]

[[skill.private]]
name = "shell"
hosts = ["pc"]

# Autres agents : mêmes plugins depuis la marketplace racine (copie dans leur propre cache, aucun lien).
[codex]
marketplace = "aphrody"
plugins = ["aphrody-skills@aphrody"]
mcp = ["relay"]

[agy]
plugins = ["aphrody-skills@aphrody"]
mcp = ["relay"]

[gemini]
extensions = [".agents"]

# Liens interdits : tout lien (symlink, jonction) vers une skill de src dans ces dossiers est retiré,
# le plugin aphrody-skills la fournit déjà.
[cleanup]
link_dirs = [
  "{home}/.claude/skills",
  "{home}/.gemini/skills",
  "{home}/.agents/skills",
  "{home}/.codex/skills",
]
drop_skills = [
  "web-design-guidelines",
  "gpui-kit",
  "gpui-kit-design-guides",
  "webui-reference",
]
