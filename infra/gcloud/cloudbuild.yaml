# Sovereign Monorepo Google Cloud Build Pipeline (GCP Project: aphrody #468000409790)
# Regions: europe-west1 (primary) / us-central1 (Artifact Registry: bunos)
# Verifies Bun v1.4.4 Full-Rust + Rust 2024 + Go 1.27 + WCK 100/100 and publishes OCI images.
# Zero npm bloat, pure native Bun execution, zero raw secret exposure.

substitutions:
  _PRIMARY_REGION: europe-west1
  _SECONDARY_REGION: us-central1
  _AR_REPO: bunos
  _SERVICE_IMAGE: aphrody-forge

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  dynamicSubstitutions: true

steps:
  # 1. Secret Hygiene, Anti-AI-Slop Design Gate & Bun Native Typecheck / Test
  - id: verify-bun-and-wck
    name: oven/bun:1.4.4-alpine
    entrypoint: sh
    args:
      - -ceu
      - |
        test ! -f .env || (echo "FATAL: .env must never be committed" && exit 1)
        bun --cwd packages/forge check
        bun test --cwd packages/forge
        if [ -f packages/google-design/src/cli.ts ]; then
          bun run packages/google-design/src/cli.ts verify
        fi
        if [ -f packages/wck/src/cli.ts ]; then
          bun test --cwd packages/wck
        fi
        mkdir -p dist
        bun build --compile packages/forge/src/cli.ts --outfile dist/frg
        ./dist/frg remotes

  # 2. Verify Architecture Domain-Purity Gate & Rust Systems Crates (archguard + unix + wayland WSLg)
  - id: verify-rust-crates
    name: rust:1.85-bookworm
    entrypoint: bash
    waitFor: ["-"]
    args:
      - -ceu
      - |
        apt-get update && apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev libpixman-1-dev
        cargo run -p aphrody --bin ay -- arch check --strict --root .
        cargo test -p archguard -p aphrody
        cargo check --workspace --all-targets

  # 3. Verify Go Sovereign Deploy Engine (infra/src-deploy)
  - id: verify-go-infra
    name: golang:1.24-bookworm
    entrypoint: bash
    waitFor: ["-"]
    args:
      - -ceu
      - |
        cd infra
        go build -o ../dist/src-deploy ./cmd/src-deploy

  # 4. Build & Tag Sovereign OCI Images for Artifact Registry `bunos` (europe-west1 + us-central1)
  - id: build-oci-images
    name: gcr.io/cloud-builders/docker
    waitFor:
      - verify-bun-and-wck
      - verify-rust-crates
      - verify-go-infra
    entrypoint: bash
    args:
      - -ceu
      - |
        cat <<'EOF' > Dockerfile.cloudbuild.frg
        FROM debian:bookworm-slim
        RUN apt-get update && apt-get install -y --no-install-recommends git ca-certificates && rm -rf /var/lib/apt/lists/*
        COPY dist/frg /usr/local/bin/frg
        COPY dist/src-deploy /usr/local/bin/src-deploy
        ENTRYPOINT ["/usr/local/bin/frg"]
        CMD ["serve", "--port", "8080"]
        EOF
        docker build -f Dockerfile.cloudbuild.frg \
          -t "${_PRIMARY_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_IMAGE}:${SHORT_SHA}" \
          -t "${_PRIMARY_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_IMAGE}:latest" \
          -t "${_SECONDARY_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_IMAGE}:${SHORT_SHA}" \
          -t "${_SECONDARY_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_IMAGE}:latest" \
          .
        rm -f Dockerfile.cloudbuild.frg

images:
  - "${_PRIMARY_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_IMAGE}:${SHORT_SHA}"
  - "${_PRIMARY_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_IMAGE}:latest"
  - "${_SECONDARY_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_IMAGE}:${SHORT_SHA}"
  - "${_SECONDARY_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_IMAGE}:latest"

timeout: 1800s
