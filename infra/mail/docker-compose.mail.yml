# Sovereign Mail Infrastructure for aphrody.com (contact@aphrody.com)
# Pure-Rust Stalwart Mail Server (JMAP, IMAP4rev2, SMTP, ManageSieve, SPF/DKIM/DMARC/ARC/MTA-STS/TLS-RPT/ACME)
# Deployed on OVH FR VPS (fr1: 51.77.147.152 primary, fr2: 51.255.162.6 warm replica)

name: aphrody-sovereign-mail

services:
  stalwart-mail:
    image: stalwartlabs/mail-server:latest
    container_name: aphrody-stalwart-mail
    hostname: mail.aphrody.com
    domainname: aphrody.com
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      # Public MX Inbound SMTP (STARTTLS + MTA-STS enforced)
      - "25:25/tcp"
      # Authenticated Submission over Implicit TLS 1.3 (SMTPS)
      - "465:465/tcp"
      # Authenticated Submission with Mandatory STARTTLS
      - "587:587/tcp"
      # IMAP4rev2 over Implicit TLS 1.3
      - "993:993/tcp"
      # ManageSieve Filter Management over TLS 1.3
      - "4190:4190/tcp"
      # HTTPS JMAP API + MTA-STS Policy + WebAdmin (bound to WireGuard mesh / Caddy reverse proxy or direct 8443)
      - "443:443/tcp"
      - "127.0.0.1:8080:8080/tcp"
    environment:
      TZ: "Europe/Paris"
      MAIL_DOMAIN: "${MAIL_DOMAIN:-aphrody.com}"
      MAIL_HOST: "${MAIL_HOST:-mail.aphrody.com}"
      STALWART_ADMIN_USER: "${STALWART_ADMIN_USER:-postmaster}"
      STALWART_ADMIN_PASSWORD: "${STALWART_ADMIN_PASSWORD:?Set STALWART_ADMIN_PASSWORD in environment}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
    volumes:
      - ./config/stalwart.toml:/opt/stalwart-mail/etc/config.toml:ro
      - stalwart_data:/opt/stalwart-mail/data
      - stalwart_blobs:/opt/stalwart-mail/blobs
      - stalwart_logs:/opt/stalwart-mail/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 465 && nc -z 127.0.0.1 993"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  stalwart_data:
    name: aphrody_stalwart_data
  stalwart_blobs:
    name: aphrody_stalwart_blobs
  stalwart_logs:
    name: aphrody_stalwart_logs
