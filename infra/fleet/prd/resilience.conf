# prd (srv2116886, USA): backends. Read by fleet-resilience.sh / fleet-backup.sh as /etc/fleet/resilience.conf.
HOST=prd
SERVICES="nginx docker aphrody-cluster-haproxy agent-relay-broker aphrody-gpu-depot commons-relay ay-ai-litellm cloudflared-prod cloudflared-mig-prd loreserver shenron-cdn-origin wii-os-shenron"
TIMERS="fleet-health.timer fleet-notify.timer fleet-backup.timer src-checkout-update.timer fleet-wg-failover@fr2.timer lore-r2-backup.timer certbot-renew.timer shenron-container-backup.timer shenron-dbfr-backup.timer"
WG="prod vps"
LINGER="root agent"
USER_UNITS="root:aphrody-relay.service agent:aphrody-agents.service agent:aphrody-agents-health.timer agent:aphrody-agents-pull.timer agent:aphrody-upstream.timer"
PROBES="aphrody-cluster-haproxy=http://127.0.0.1:19900/stats cloudflared-prod=http://127.0.0.1:20241/ready cloudflared-mig-prd=http://127.0.0.1:20244/ready ay-ai-litellm=http://127.0.0.1:4000/health/liveliness commons-relay=http://10.200.77.5:8766/ aphrody-gpu-depot=http://10.200.77.5:8182/ shenron-cdn-origin=http://127.0.0.1:9077/ wii-os-shenron=http://127.0.0.1:8780/ root:aphrody-relay.service=http://127.0.0.1:8790/"
BACKUP_RCLONE_USER=root
BACKUP_PATHS="/etc /var/lib/systemd/credential.secret /srv/commons-relay/state /srv/aphrody-gpu-depot/private /home/ubuntu/tools/agent-coordination/state /srv/wii-os/userland/data /srv/shenron/data/workspace /srv/cdn-shenron/bunre-pipeline/bt3_assets.sqlite /home/ubuntu/.aphrody/memory.sqlite /home/ubuntu/.aphrody/memory /root/.config/credstore.encrypted /root/.config/systemd/user /root/.config/rclone /home/agent/.config/credstore.encrypted /home/agent/.config/systemd/user /usr/local/lib/aphrody-ai"
BACKUP_SQLITE="/srv/commons-relay/state/relay.db /srv/wii-os/userland/data/wii-os.sqlite3 /srv/shenron/data/workspace/knowledge.db /srv/cdn-shenron/bunre-pipeline/bt3_assets.sqlite /home/ubuntu/.aphrody/memory.sqlite /home/ubuntu/.aphrody/memory/vps-ops.sqlite"
FLEET_TCP="10.200.77.1:50051 10.200.77.1:50061 10.200.77.5:8766 10.200.77.5:8182"
HEAL_PEERS="fr2=root:root@51.255.162.6 fr1=root:ubuntu@51.77.147.152"
# Backups and syncs: Nice 19, idle I/O, CPUWeight 10, rclone 2 transfers / 4 checkers / 10M, serialized with
# heavy jobs (prd load rule: flock /var/lock/aphrody-heavy.lock).
BATCH="fleet-backup lore-r2-backup shenron-container-backup shenron-dbfr-backup rg-cdn-sync auto-sauvegarde"
BATCH_LOCK=/var/lock/aphrody-heavy.lock
# Read-only checkout for host services (src-checkout-update.timer): the ai-os relay runs from it, not a copy.
# Whole packages/: ai-os imports sibling packages (vault, env-kit).
SRC_CHECKOUT=/srv/src
SRC_SPARSE="packages infra/ai infra/fleet infra/agents infra/chromium-factory"
SRC_RESTART="packages/ai-os=root:aphrody-relay.service packages/vault=root:aphrody-relay.service"
# Edge DNS failover from prd (fleet-dns-failover.sh; token fleet-prd-dns in /etc/aphrody/secrets.env).
FLEET_DNS_FAILOVER=1
