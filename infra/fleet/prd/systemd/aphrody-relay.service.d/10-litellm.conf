# Relais de prd branché sur LiteLLM (127.0.0.1:4000, unité ay-ai-litellm) : clé maîtresse du proxy lue dans
# systemd-creds, jamais dans relay.env. relay.env garde RELAY_OPENAI_ENDPOINTS=litellm=http://127.0.0.1:4000/v1
# et RELAY_ACP_MODEL=litellm/<route>/<modèle> (routes gratuites d'abord : infra/ai/litellm-overlay.toml).
# Installation : install -Dm644 10-litellm.conf ~/.config/systemd/user/aphrody-relay.service.d/10-litellm.conf
[Service]
# Copie à portée utilisateur (unité --user) : systemd-creds --user encrypt --name=LITELLM_MASTER_KEY - ~/.config/credstore.encrypted/LITELLM_MASTER_KEY
LoadCredentialEncrypted=LITELLM_MASTER_KEY
ExecStart=
ExecStart=/bin/sh -c 'RELAY_LITELLM_KEY="$(cat "$CREDENTIALS_DIRECTORY/LITELLM_MASTER_KEY")" exec %h/.bun/bin/bun %h/src/packages/ai-os/src/relay/cli.ts serve'
