# prd (production): /etc/fleet/tune.conf, read by infra/fleet/bin/fleet-tune.sh. 8 CPU, 31 GiB, btrfs root.
SYSCTL="vm.swappiness = 150; vm.page-cluster = 0; vm.dirty_background_bytes = 134217728; vm.dirty_bytes = 536870912"
ZRAM_SIZE="min(ram / 4, 8192)"
# btrfs: nocow swapfile made by `btrfs filesystem mkswapfile` in the existing /swap subvolume (was 512 MiB, full).
SWAPFILE=/swap/swapfile
SWAP_SIZE=8G
SWAP_PRIO=10
# / is mounted by the kernel cmdline (no fstab line): remounted noatime at every boot by fleet-tune.service.
NOATIME="/"
CLEAN_USERS="root ubuntu agent"
TARGET_ROOTS="/home /root /srv"
TARGET_MAX_DAYS=7
BUN_CACHE_MAX_MB=1024
DOCKER_KEEP_HOURS=336
BUILDER_KEEP=2GB
JOURNAL_MAX=2G
