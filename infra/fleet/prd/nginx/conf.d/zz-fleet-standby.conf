# managed by infra/fleet/fr2/bin/fleet-standby-sync.sh: fr2 vhosts as prd loopback standby (tunnel mig-prd)
# Generated by `bun infra/fleet/api.ts render` from infra/fleet/api.toml. Do not edit on the host.
map $http_upgrade $fleet_connection_upgrade {
    default upgrade;
    '' close;
}

map $http_origin $fleet_api_origin {
    default "";
    "https://aphrody.com" $http_origin;
    "https://www.aphrody.com" $http_origin;
    "https://aphrody.app" $http_origin;
    "https://store.aphrody.com" $http_origin;
    "https://downloads.aphrody.com" $http_origin;
}


server {
    listen 127.0.0.1:29401;
    listen 10.200.77.5:29401;  # mig-prd replicas on fr1/fr2 reach it via fleet-fwd-standby@29401
    server_name dbfr.aphrody.com mcp.rosegriffon.fr db.rosegriffon.fr;
    add_header Strict-Transport-Security "max-age=63072000" always;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location = /v1/health {
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway"}';
    }

    location = /v1/ {
        default_type application/json;
        return 200 '{"services":[{"name":"a2a","base":"/v1/a2a/","description":"Agent-to-agent hub"},{"name":"bunos","base":"/v1/bunos/","description":"Bun OS server (product API)"},{"name":"chat","base":"/v1/chat/","description":"Aphrody Chat gateway"},{"name":"downloads","base":"/v1/downloads/","description":"Downloads and release artifacts"},{"name":"fonts","base":"/v1/fonts/","description":"Fonts proxy"},{"name":"site","base":"/v1/site/","description":"aphrody.com site backend"},{"name":"store","base":"/v1/store/","description":"Bun OS Store API (apt, pacman, flatpak, F-Droid, bun, cargo feeds)"},{"name":"webos","base":"/v1/webos/","description":"WebOS server (session API and stream)"}]}';
    }

    # Agent-to-agent hub (vps:8788)
    location /v1/a2a/ {
        proxy_pass http://10.200.77.1:8080/v1/a2a/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fleet_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header traceparent $http_traceparent;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header Access-Control-Allow-Origin $fleet_api_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Vary Origin always;
    }

    # Bun OS server (product API) (vps:29030)
    location /v1/bunos/ {
        proxy_pass http://10.200.77.1:8080/v1/bunos/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fleet_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header traceparent $http_traceparent;
        proxy_read_timeout 60s;
        add_header Access-Control-Allow-Origin $fleet_api_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Vary Origin always;
    }

    # Aphrody Chat gateway (vps:8794)
    location /v1/chat/ {
        proxy_pass http://10.200.77.1:8080/v1/chat/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fleet_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header traceparent $http_traceparent;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header Access-Control-Allow-Origin $fleet_api_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Vary Origin always;
    }

    # Downloads and release artifacts (vps:8797)
    location /v1/downloads/ {
        proxy_pass http://10.200.77.1:8080/v1/downloads/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fleet_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header traceparent $http_traceparent;
        proxy_read_timeout 60s;
        add_header Access-Control-Allow-Origin $fleet_api_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Vary Origin always;
    }

    # Fonts proxy (vps:8796)
    location /v1/fonts/ {
        proxy_pass http://10.200.77.1:8080/v1/fonts/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fleet_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header traceparent $http_traceparent;
        proxy_read_timeout 60s;
        add_header Access-Control-Allow-Origin $fleet_api_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Vary Origin always;
    }

    # aphrody.com site backend (vps:8083)
    location /v1/site/ {
        proxy_pass http://10.200.77.1:8080/v1/site/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fleet_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header traceparent $http_traceparent;
        proxy_read_timeout 60s;
        add_header Access-Control-Allow-Origin $fleet_api_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Vary Origin always;
    }

    # Bun OS Store API (apt, pacman, flatpak, F-Droid, bun, cargo feeds) (vps:8791)
    location /v1/store/ {
        proxy_pass http://10.200.77.1:8080/v1/store/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fleet_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header traceparent $http_traceparent;
        proxy_read_timeout 60s;
        add_header Access-Control-Allow-Origin $fleet_api_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Vary Origin always;
    }

    # WebOS server (session API and stream) (vps:8790)
    location /v1/webos/ {
        proxy_pass http://10.200.77.1:8080/v1/webos/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fleet_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header traceparent $http_traceparent;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header Access-Control-Allow-Origin $fleet_api_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Vary Origin always;
    }

    location = / {
        default_type application/json;
        return 200 '{"status":"ok","service":"bunos-fleet-gateway","domain":"dbfr.aphrody.com","v1":"/v1/"}';
    }

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"bunos-fleet-gateway"}';
    }

    location / {
        default_type application/problem+json;
        return 404 '{"type":"about:blank","title":"Not Found","status":404}';
    }
}
# SPDX-License-Identifier: Apache-2.0
# Host nginx on cdn (bunos): edge for cdn.rosegriffon.fr and nie.aphrody.app.
# - /static/: derived assets on local disk (/srv/rosegriffon/cdn/static, rsynced from the
#   vps storage copy by infra/scripts/sync-cdn.sh), then the origin on a miss.
# - everything else: the prd host nginx over HTTPS (origin vhost allow-listed to this host,
#   infra/docker/host-nginx/rosegriffon-stack.conf), Host cdn.rosegriffon.fr, cached here.
# - /raw /vfs /depot are refused here as well as at the origin.
#
#   sudo install -m 644 infra/docker/cdn-edge/rosegriffon-cdn.conf /etc/nginx/conf.d/
#   sudo install -d -o www-data -g www-data /var/cache/nginx/rg-cdn
#   sudo nginx -t && sudo systemctl reload nginx

proxy_cache_path /var/cache/nginx/rg-cdn levels=1:2 keys_zone=rg_cdn:64m max_size=3g inactive=30d use_temp_path=off;

upstream rg_origin {
    # prd public address (infra/hosts.toml: prod role). Direct: the mesh goes through vps.
    server 10.200.77.5:8443;
    keepalive 32;
}

map $http_upgrade $rg_cdn_connection {
    default upgrade;
    '' "";
}


server {
    listen 127.0.0.1:29402;
    listen 10.200.77.5:29402;  # mig-prd replicas on fr1/fr2 reach it via fleet-fwd-standby@29402
    server_name nie.aphrody.app;
    include /etc/fleet-standby/snippets/rosegriffon-cdn-edge.inc;
}

