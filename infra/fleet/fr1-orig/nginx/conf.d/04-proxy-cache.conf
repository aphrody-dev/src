proxy_cache_path /var/cache/nginx/aphrody_cache levels=1:2 keys_zone=aphrody_cache:128m max_size=50g inactive=7d use_temp_path=off;
proxy_cache_path /dev/shm/nginx_fast_cache levels=1:2 keys_zone=nginx_fast_cache:64m max_size=4g inactive=24h use_temp_path=off;
proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
proxy_cache_lock on;
