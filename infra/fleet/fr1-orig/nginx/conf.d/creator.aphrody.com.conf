server {
    listen 80;
    listen [::]:80;
    server_name creator.aphrody.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name creator.aphrody.com;
    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    include snippets/aphrody-security.inc;

    root /home/ubuntu/apps/creator/current;
    index index.html;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"aphrody-creator"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
