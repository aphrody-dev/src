server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name azalee.rosegriffon.fr;
    ssl_certificate /etc/letsencrypt/live/rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rosegriffon.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    location ^~ /_next/static/ {
        alias /home/ubuntu/apps/rg/current/apps/rg-website/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = / {
        rewrite ^ /wiki break;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host rosegriffon.fr;
        include snippets/proxy-client-ip.inc;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host rosegriffon.fr;
        include snippets/proxy-client-ip.inc;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name azalee.rosegriffon.fr;
    return 301 https://azalee.rosegriffon.fr$request_uri;
}
