log_format rg_stats escape=json
    '$time_iso8601\t$host\t$request_method\t$uri\t$status\t$body_bytes_sent\t'
    '$request_time\t$upstream_response_time\t$upstream_cache_status\t'
    '$http_referer\t$http_user_agent\t$remote_addr';

map $http_upgrade $rg_core_connection {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ranked.rosegriffon.fr api.rosegriffon.fr;
    ssl_certificate /etc/letsencrypt/live/rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rosegriffon.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/rg-stats.log rg_stats buffer=32k flush=5s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8810;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include snippets/proxy-client-ip.inc;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $rg_core_connection;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bot.rosegriffon.fr;
    ssl_certificate /etc/letsencrypt/live/rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rosegriffon.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = / {
        default_type application/json;
        return 200 '{"status":"ok","service":"rosegriffon-bot","domain":"bot.rosegriffon.fr","health":"/health"}';
    }

    location / {
        proxy_pass http://127.0.0.1:8810;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include snippets/proxy-client-ip.inc;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mcp.rosegriffon.fr db.rosegriffon.fr ftp.rosegriffon.fr;
    ssl_certificate /etc/letsencrypt/live/rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rosegriffon.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location = / {
        default_type application/json;
        return 200 '{"status":"ok","service":"rosegriffon-mcp","domain":"$host","health":"/health"}';
    }

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"rosegriffon-mcp","domain":"$host"}';
    }

    location / {
        proxy_pass http://127.0.0.1:8810;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include snippets/proxy-client-ip.inc;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cdn.rosegriffon.fr;
    access_log off;
    ssl_certificate /etc/letsencrypt/live/rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rosegriffon.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    proxy_read_timeout 120s;
    proxy_send_timeout 60s;

    location = / {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        return 200 '{"status":"ok","service":"rosegriffon-cdn","domain":"cdn.rosegriffon.fr","health":"/health"}';
    }

    location ~ ^/storage/v1/object/public/(tweets|assets)/(.+)$ {
        root /var/lib/rg-core/media;
        try_files /$1/$2 @storage;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location @storage {
        proxy_pass https://xzwfnxzkxtcpgmtqulbh.supabase.co;
        proxy_http_version 1.1;
        proxy_set_header Host xzwfnxzkxtcpgmtqulbh.supabase.co;
        proxy_ssl_server_name on;
        proxy_intercept_errors on;
        error_page 400 = @storage_absent;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location @storage_absent {
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
        add_header Access-Control-Allow-Origin "*" always;
        return 404 '{"statusCode":"404","error":"not_found","message":"Object not found"}';
    }

    location ^~ /static/ {
        alias /var/lib/rg-core/cdn/static/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location ~ ^/dx11/.+\.png$ {
        rewrite ^ /tex$uri break;
        limit_req zone=nie_assets burst=40 nodelay;
        limit_conn nie_conn 8;
        limit_req_status 429;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8810;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include snippets/proxy-client-ip.inc;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location ~ ^/raw/.+\.g4cm$ {
        limit_req zone=nie_assets burst=20 nodelay;
        limit_conn nie_conn 8;
        limit_req_status 429;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8810;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include snippets/proxy-client-ip.inc;
        add_header Access-Control-Allow-Origin "*" always;
    }

    include snippets/nie-assets.inc;
}

server {
    listen 80;
    listen [::]:80;
    server_name ranked.rosegriffon.fr api.rosegriffon.fr bot.rosegriffon.fr cdn.rosegriffon.fr mcp.rosegriffon.fr db.rosegriffon.fr ftp.rosegriffon.fr;
    return 301 https://$host$request_uri;
}
