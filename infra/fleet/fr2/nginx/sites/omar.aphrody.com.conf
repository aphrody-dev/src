# Managed in labs/infra/fleet/fr2/nginx - migrated from fr1 on 2026-11-12
server {
    listen 80;
    listen [::]:80;
    server_name omar.aphrody.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name omar.aphrody.com;
    ssl_certificate /etc/nginx/certs/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/aphrody.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include snippets/aphrody-security.inc;

    location / {
        proxy_pass http://127.0.0.1:8793;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
