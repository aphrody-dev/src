# Managed in labs/infra/fleet/fr2/nginx - migrated from fr1 on 2026-11-12
server {
    listen 80;
    listen [::]:80;
    server_name aphrody.com www.aphrody.com aphrody.app www.aphrody.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aphrody.com www.aphrody.com;

    ssl_certificate /etc/nginx/certs/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/aphrody.com/privkey.pem;

    location / {
        proxy_pass http://10.200.77.5:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aphrody.app www.aphrody.app;

    ssl_certificate /etc/nginx/certs/aphrody.app/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/aphrody.app/privkey.pem;

    location / {
        proxy_pass http://10.200.77.5:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


# Catch-all for subdomains without their own vhost (fr1 behaviour: default server -> site backend)
server {
    listen 80;
    listen [::]:80;
    server_name *.aphrody.com *.aphrody.app;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name *.aphrody.com;
    ssl_certificate /etc/nginx/certs/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/aphrody.com/privkey.pem;
    location / {
        proxy_pass http://10.200.77.5:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name *.aphrody.app;
    ssl_certificate /etc/nginx/certs/aphrody.app/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/aphrody.app/privkey.pem;
    location / {
        proxy_pass http://10.200.77.5:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
