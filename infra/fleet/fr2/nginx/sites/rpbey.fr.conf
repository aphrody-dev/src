# Managed in labs/infra/fleet/fr2/nginx - migrated from fr1 on 2026-11-12
server {
    listen 80;
    listen [::]:80;
    server_name rpbey.fr www.rpbey.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rpbey.fr www.rpbey.fr;

    ssl_certificate /etc/nginx/certs/rpbey.fr/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/rpbey.fr/privkey.pem;

    root /srv/www/rpbey.fr;
    index index.html;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"rpbey.fr"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
