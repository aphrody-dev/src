# fr2 origin authentication (http context). Peers: snippets/fleet-peers.geo (single list).
# - dbfr.aphrody.com: per-hostname Authenticated Origin Pulls (infra/cloudflare/aop.ts). Keyed on the TLS SNI
#   and on the Host header (see the maps below).
#   Wired in conf.d/fleet-api.conf (443 server): ssl_client_certificate /etc/nginx/aop/ca.pem; ssl_verify_client optional;
#   if ($aop_deny) { return 403; }. $ssl_client_verify is SUCCESS, NONE or FAILED:<reason>: anything but SUCCESS is denied.
# - Worker-served vhosts (api, cdn, creator, downloads): snippets/fleet-only.inc (403 unless $fleet_peer).
geo $fleet_peer {
    default 0;
    include /etc/nginx/snippets/fleet-peers.geo;
}
# dbfr is matched on the SNI and on the Host header: a client cannot dodge the check by sending another SNI (or none)
# with Host: dbfr.aphrody.com, nor the reverse, on this shared server block.
map $ssl_server_name $aop_sni { default 0; dbfr.aphrody.com 1; }
map $host $aop_host { default 0; dbfr.aphrody.com 1; }
map "$aop_sni$aop_host:$fleet_peer:$ssl_client_verify" $aop_deny {
    default 0;
    "~^(10|01|11):0:SUCCESS$" 0;
    "~^(10|01|11):0:" 1;
}
