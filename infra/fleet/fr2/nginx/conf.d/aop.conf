# Per-hostname Authenticated Origin Pulls (infra/cloudflare/aop.ts): dbfr.aphrody.com accepts only requests carrying
# the client certificate that this account's Cloudflare edge presents (CA /etc/nginx/aop/ca.pem), or coming from the
# fleet/mesh. Wired in conf.d/fleet-api.conf (443 server): ssl_client_certificate /etc/nginx/aop/ca.pem;
# ssl_verify_client optional; if ($aop_deny) { return 403; }. Other names of that server block are unaffected.
geo $aop_fleet {
    default 0;
    127.0.0.0/8 1;
    ::1 1;
    10.200.77.0/24 1;
    51.77.147.152 1;
    72.60.186.43 1;
    51.255.162.6 1;
    2001:41d0:404:200::4d8e 1;
    2a02:4780:28:8e1e::1 1;
    2001:41d0:305:2100::a461 1;
}
map "$host:$aop_fleet:$ssl_client_verify" $aop_deny {
    default 0;
    "~^dbfr\.aphrody\.com:0:SUCCESS$" 0;
    "~^dbfr\.aphrody\.com:0:" 1;
}
