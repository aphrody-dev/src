# fr2 (edge): /etc/fleet/tune.conf, read by infra/fleet/bin/fleet-tune.sh. 6 CPU, 11 GiB: zram first, swapfile last.
SYSCTL="vm.swappiness = 150; vm.page-cluster = 0; vm.dirty_background_bytes = 67108864; vm.dirty_bytes = 268435456"
ZRAM_SIZE="min(ram / 2, 6144)"
SWAPFILE=/swapfile
SWAP_SIZE=2G
SWAP_PRIO=10
NOATIME="/"
CLEAN_USERS="root ubuntu agent omar"
TARGET_ROOTS="/home /root"
TARGET_MAX_DAYS=7
BUN_CACHE_MAX_MB=1024
DOCKER_KEEP_HOURS=336
BUILDER_KEEP=2GB
JOURNAL_MAX=1G
