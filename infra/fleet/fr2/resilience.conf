# fr2 (bunos, cdn): proxy, vhosts, CDN. Read by fleet-resilience.sh / fleet-backup.sh as /etc/fleet/resilience.conf.
HOST=fr2
SERVICES="nginx cloudflared-fr2 docker aphrody-cluster-haproxy earlyoom fail2ban"
# Timers and sockets: enabled + active only.
TIMERS="fleet-health.timer fleet-backup.timer fleet-wg-failover@prd.timer fr2-edge-fw.timer certbot.timer"
WG="wg1"
LINGER="ubuntu agent"
USER_UNITS="agent:aphrody-agents.service agent:aphrody-agents-health.timer agent:aphrody-agents-pull.timer ubuntu:yolo-clean.timer ubuntu:yolo-git-sync.timer"
PROBES="nginx=http://127.0.0.1/ cloudflared-fr2=http://127.0.0.1:20245/ready aphrody-cluster-haproxy=http://127.0.0.1:19900/stats"
# Backup (fleet-backup.sh): age-encrypted tar.zst to $BACKUP_REMOTE/<host>/, rclone config of $BACKUP_RCLONE_USER.
BACKUP_RCLONE_USER=ubuntu
BACKUP_PATHS="/etc /srv/www /var/lib/systemd/credential.secret /var/lib/aphrody /home/ubuntu/.config/systemd/user /home/ubuntu/.config/credstore.encrypted /home/ubuntu/.config/rclone"
BACKUP_SQLITE="/var/lib/aphrody/cloudflare/migration20261011/transfer-receipts.sqlite"
# Health (fleet-health.sh): peers and edge checked from here; peers healed over ssh (public IP, TCP).
FLEET_TCP="10.200.77.5:8766 10.200.77.5:8182"
HEAL_PEERS="prd=root:root@72.60.186.43 fr1=ubuntu:ubuntu@51.77.147.152"
BATCH="fleet-backup"
# yolo crawl worker: its Redis (127.0.0.1:16379 tunnel) no longer exists, fr2 is edge only (owner 2026-11-13).
DISABLE_USER="ubuntu:yolo-worker.service ubuntu:yolo-cluster.target"
