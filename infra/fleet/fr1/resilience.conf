# fr1 (vps-203bea89): Chromium/LLVM builds only, preemptible. Read as /etc/fleet/resilience.conf.
HOST=fr1
SERVICES="nginx docker containerd aphrody-cluster-haproxy nativelink-server nativelink-worker fail2ban actions.runner.aphrody-dev-src.fr1.service"
TIMERS="fleet-health.timer src-checkout-update.timer fleet-notify.timer fleet-backup.timer chromium-factory.timer certbot.timer fleet-fwd-commons.socket fleet-fwd-gpu-depot.socket"
WG="wg1"
LINGER="ubuntu agent"
USER_UNITS="agent:aphrody-agents.service agent:aphrody-agents-health.timer agent:aphrody-agents-pull.timer"
# Legacy yolo/bun-os stack (apps/auto/MIGRATION.md): sources gone (~/src/bun-os, ~/yolo-cluster, fr2:/srv/yolo_build_cache).
DISABLE="srv-yolo_build_cache.automount srv-yolo_build_cache.mount"
DISABLE_USER="ubuntu:bunos-auto-deliver.timer ubuntu:bunos-auto-deliver.path ubuntu:bunos-auto-guard.timer ubuntu:bunos-auto-health.timer ubuntu:bunos-auto-status.timer ubuntu:bunos-native-publish.path ubuntu:yolo-worker.service ubuntu:bunos-auto-deliver.service ubuntu:bunos-auto-guard.service ubuntu:bunos-auto-health.service ubuntu:bunos-auto-status.service"
NOFAIL="/home"
PROBES="nginx=http://127.0.0.1/ aphrody-cluster-haproxy=http://127.0.0.1:19900/stats"
BACKUP_RCLONE_USER=ubuntu
BACKUP_PATHS="/etc /var/lib/systemd/credential.secret /srv/chromium/factory/factory.toml /home/ubuntu/.config/systemd/user /home/ubuntu/.config/rclone /home/ubuntu/actions-runner/.runner /home/ubuntu/actions-runner/.credentials /home/ubuntu/actions-runner/.credentials_rsaparams"
BACKUP_SQLITE=""
FLEET_TCP="10.200.77.1:50051 10.200.77.1:50061 10.200.77.5:8766 10.200.77.5:8182"
HEAL_PEERS="fr2=ubuntu:root@51.255.162.6 prd=ubuntu:root@72.60.186.43"
BATCH="fleet-backup"
# Read-only src checkout (src-checkout-update.sh, timer above): default SRC_ROOT of ay on this host (env-kit, ai-os, engines, factory.toml).
SRC_CHECKOUT=/srv/src
SRC_SPARSE="packages/ai-os packages/env-kit packages/chromium-bun infra/ai infra/fleet infra/agents infra/chromium-factory"
