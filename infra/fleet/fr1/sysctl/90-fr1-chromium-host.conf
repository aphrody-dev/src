# fr1 = Chromium / ChromiumOS / LLVM / kernel build host. Single source of truth (labs infra/fleet/fr1).
# Replaces 12 historical drop-ins (lxc, bun, bun-os-gaming, yolo, shenron, vps-*), kept in /etc/sysctl.d/.disabled-20261112/.

# --- Build: file watching, fds, mappings (siso/ninja/gclient, clang/lld, rust-lld, emerge) ---
fs.inotify.max_user_watches = 2097152
fs.inotify.max_user_instances = 8192
fs.file-max = 4194304
fs.nr_open = 4194304
fs.aio-max-nr = 1048576
vm.max_map_count = 2147483642
kernel.pid_max = 4194304
user.max_user_namespaces = 262144
# Chromium sandbox / unit tests launched from out/ and cros_sdk need unprivileged user namespaces
# (Ubuntu >= 24.04 restricts them through AppArmor by default).
kernel.unprivileged_userns_clone = 1
kernel.apparmor_restrict_unprivileged_userns = 0
kernel.sched_autogroup_enabled = 0

# --- Memory: zram (12G, prio 100) + swapfile (8G, prio 10) ---
vm.swappiness = 100
vm.page-cluster = 0
vm.vfs_cache_pressure = 50
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
vm.overcommit_memory = 1
# no hugetlbfs consumer on a build host: do not pin RAM (was 512 x 2M)
vm.nr_hugepages = 0
vm.nr_overcommit_hugepages = 0

# --- Network: mesh hub (WireGuard wg1 forwards 10.200.77.0/24), REAPI traffic ---
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 65536
net.ipv4.tcp_max_syn_backlog = 65535
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.ipv4.tcp_rmem = 4096 131072 33554432
net.ipv4.tcp_wmem = 4096 65536 33554432
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_mtu_probing = 1
net.ipv4.ip_local_port_range = 10240 65535
net.ipv4.tcp_keepalive_time = 60
net.ipv4.tcp_keepalive_intvl = 10
net.ipv4.tcp_keepalive_probes = 6
net.netfilter.nf_conntrack_max = 524288

# --- Hardening (from 90-vps-security) ---
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.log_martians = 1
kernel.yama.ptrace_scope = 1
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
fs.protected_fifos = 2
fs.protected_regular = 2
kernel.kptr_restrict = 1
# perf for siso/clang profiling (AutoFDO/Propeller collection)
kernel.perf_event_paranoid = 1
kernel.io_uring_disabled = 0
