# fr1 (factory): /etc/fleet/tune.conf, read by infra/fleet/bin/fleet-tune.sh. Memory keys of
# fr1/sysctl/90-fr1-chromium-host.conf stay there; this adds dirty_bytes for 45 GiB and the zram page-cluster.
SYSCTL="vm.dirty_background_bytes = 268435456; vm.dirty_bytes = 1073741824; vm.page-cluster = 0"
# zram: own zram-swap.service (12 GiB, prio 100) kept; swapfile2 8 GiB on ext4 root (prio 10) kept.
SWAPFILE=/swapfile2
SWAP_SIZE=8G
SWAP_PRIO=10
NOATIME="/ /home"
CLEAN_USERS="root ubuntu agent omar"
# CI runner work dirs and agent checkouts; the persistent CI CARGO_TARGET_DIR is touched by every run.
TARGET_ROOTS="/home /root /srv"
TARGET_MAX_DAYS=3
BUN_CACHE_MAX_MB=3072
SCCACHE_MAX_MB=40960
DOCKER_KEEP_HOURS=48
BUILDER_KEEP=8GB
JOURNAL_MAX=2G
