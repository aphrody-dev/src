# Worker "creator-aphrody-com" (script = ./worker.js). Deployed via Cloudflare API (MCP), no secrets.
name = "creator-aphrody-com"
main = "worker.js"
compatibility_date = "2026-11-01"
routes = [{ pattern = "creator.aphrody.com", custom_domain = true }]
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "aphrody-dist"
[vars]
PREFIX = "sites/creator.aphrody.com"
SERVICE = "aphrody-creator"
SPA = "1"
