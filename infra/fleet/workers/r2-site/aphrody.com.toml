# Worker "aphrody-com" (script = ./worker.js). Deployed via Cloudflare API (MCP), no secrets.
name = "aphrody-com"
main = "worker.js"
compatibility_date = "2026-11-01"
routes = [{ pattern = "aphrody.com", custom_domain = true }]
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "aphrody-dist"
[vars]
PREFIX = "sites/aphrody.com"
SERVICE = "aphrody-web"
SPA = "0"
