# Worker "downloads-aphrody-com" (script = ./worker.js). Deployed via Cloudflare API (MCP), no secrets.
name = "downloads-aphrody-com"
main = "worker.js"
compatibility_date = "2026-11-01"
routes = [{ pattern = "downloads.aphrody.com", custom_domain = true }]
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "aphrody-dist"
[vars]
PREFIX = "aphrody"
SERVICE = "aphrody-downloads"
SPA = "0"
