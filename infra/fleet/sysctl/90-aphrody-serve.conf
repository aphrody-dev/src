# Serving hosts (prd backends, fr2 edge). Installed by infra/fleet/bootstrap/common.sh sysctl_serve, replaces
# 90-dbfr.conf / 90-yolo-swappiness.conf / 99-yolo-2026-perf.conf. fr1 has its own (infra/fleet/fr1/sysctl).
# Rollback: rm /etc/sysctl.d/90-aphrody-serve.conf && sysctl --system

# --- Network: many short HTTP/TLS connections behind nginx/cloudflared/haproxy ---
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.core.somaxconn = 8192
net.ipv4.tcp_max_syn_backlog = 16384
net.core.netdev_max_backlog = 16384
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.optmem_max = 2048576
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 1
net.ipv4.ip_local_port_range = 10240 65535
# Docker bridges and the WireGuard mesh forward through these hosts.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# --- Files and memory: databases, llama-server mmap, bun services ---
fs.file-max = 4194304
fs.nr_open = 4194304
fs.aio-max-nr = 1048576
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 2048
vm.max_map_count = 1048576
vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15
vm.min_free_kbytes = 65536
# Redis (shenron, rosegriffon, fr2 redis-server) background saves.
vm.overcommit_memory = 1
kernel.pid_max = 4194304
kernel.sched_autogroup_enabled = 0
kernel.kptr_restrict = 2
kernel.unprivileged_bpf_disabled = 1
