# Sovereign Monorepo GitLab CI Pipeline (C:\src)
# Enforces Anti-AI-Slop Design-First Gate, Bun v1.4.4 Full-Rust, Rust 2024 WSLg/Unix,
# Go 1.27 Infra, Arch/CachyOS/Omarchy pkgctl + WSL2 build, WCK 100/100, and Tri-Forge Mirroring.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_TAG

stages:
  - lint-anti-slop
  - build-bun-rust-go
  - test-gate
  - arch-cachy-omarchy-wsl
  - wck-seo-100
  - triforge-mirror

variables:
  GIT_SUBMODULE_STRATEGY: normal
  GIT_DEPTH: "20"
  CARGO_TERM_COLOR: always
  BUN_INSTALL_CACHE_DIR: "$CI_PROJECT_DIR/.cache/bun"

default:
  interruptible: true
  cache:
    key: "aphrody-monorepo-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/bun/
      - target/

# 1. Anti-AI-Slop, Zero-Emoji, Secret-Hygiene & Design-First Gate (gds verify + bun check)
lint-anti-slop-gate:
  stage: lint-anti-slop
  image: oven/bun:latest
  tags:
    - docker
  script:
    - test ! -f .env || (echo "FATAL: .env must never be committed" && exit 1)
    - bun --cwd packages/forge check
    - |
      if [ -f packages/google-design/src/cli.ts ]; then
        bun run packages/google-design/src/cli.ts verify
      fi

# 2. Build Bun v1.4.4 AOT CLIs, Rust WSLg/Unix Crates & Go 1.27 Infra Engine
build-bun-packages:
  stage: build-bun-rust-go
  image: oven/bun:latest
  tags:
    - docker
  script:
    - bun build --compile packages/forge/src/cli.ts --outfile dist/frg
    - ./dist/frg remotes
  artifacts:
    paths:
      - dist/frg
    expire_in: 7 days

build-rust-unix-wayland:
  stage: build-bun-rust-go
  image: registry.aphrody.com/aphrody/arch-builder:latest
  tags:
    - archlinux-pkgctl
  script:
    - cargo run --manifest-path tools/archguard/Cargo.toml -- check --strict --root .
    - cargo test --manifest-path tools/archguard/Cargo.toml
    - cargo check --workspace --all-targets

build-go-infra:
  stage: build-bun-rust-go
  image: golang:1.24-bookworm
  tags:
    - docker
  script:
    - cd infra && go build ./cmd/...

# 3. Deterministic Test Gate (Bun Workspace + Rust WSLg/Unix)
test-bun-forge-and-workspace:
  stage: test-gate
  image: oven/bun:latest
  tags:
    - docker
  script:
    - bun test --cwd packages/forge

test-rust-unix-wayland:
  stage: test-gate
  image: registry.aphrody.com/aphrody/arch-builder:latest
  tags:
    - archlinux-pkgctl
  script:
    - cargo test --workspace

# 4. Arch Linux + CachyOS v3 + Omarchy Package (.pkg.tar.zst) & WSL2 Rootfs Build
arch-cachyos-omarchy-pkgctl:
  stage: arch-cachy-omarchy-wsl
  image: registry.aphrody.com/aphrody/arch-builder:latest
  tags:
    - archlinux-pkgctl
  script:
    - ./dist/frg arch-upstreams
    - mkdir -p artifacts/arch-pkgs artifacts/wsl
    - |
      if [ -d crates/unix/packaging ]; then
        su builder -c "cd crates/unix/packaging && makepkg -sf --noconfirm --noprogressbar"
        cp -v /var/cache/makepkg/pkg/*.pkg.tar.zst artifacts/arch-pkgs/ || true
      elif command -v pkgctl >/dev/null 2>&1; then
        pkgctl --version
      fi
  artifacts:
    paths:
      - artifacts/arch-pkgs/
      - artifacts/wsl/
    expire_in: 14 days

# 5. WCK 100/100 Web Perfection, Core Web Vitals & SEO Gate
wck-seo-100-gate:
  stage: wck-seo-100
  image: oven/bun:latest
  tags:
    - docker
  script:
    - |
      if [ -f packages/wck/src/cli.ts ]; then
        bun test --cwd packages/wck
      fi

# 6. Tri-Forge Mirror Synchronization (GitHub + GitLab + Google Cloud Git)
triforge-mirror-sync:
  stage: triforge-mirror
  image: oven/bun:latest
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
  script:
    - ./dist/frg remotes --apply
    - ./dist/frg tri-sync --dry-run --forge all
